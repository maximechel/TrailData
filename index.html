<title>DATAS Trail running</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --accent-ink:#ffffff;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-ink:#ffffff; --warning-ink:#2b1c00; --serious-ink:#341000; --critical-ink:#ffffff;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
    --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
    --z1:#5598e7; --z2:#1baf7a; --z3:#eda100; --z4:#eb6834; --z5:#d03b3b; --z6:#4a3aa7; --z7:#e87ba4;
    --font-ui:'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
      --accent:#3987e5;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
      --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
      --z6:#9085e9; --z7:#d55181;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --accent:#3987e5;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
    --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
    --z6:#9085e9; --z7:#d55181;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);}
  .ls-app{max-width:1320px;margin:0 auto;padding:20px 24px 64px;}

  /* ---------- header ---------- */
  .ls-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 4px 20px;flex-wrap:wrap;}
  .ls-brand{display:flex;align-items:baseline;gap:10px;}
  .ls-brand h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0;}
  .ls-brand span{color:var(--text-muted);font-size:13px;}
  .ls-header-actions{display:flex;align-items:center;gap:8px;}
  .ls-btn{font-family:var(--font-ui);font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-primary);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .ls-btn:hover{background:var(--surface-2);}
  .ls-btn.primary{background:var(--accent);color:#fff;border-color:transparent;}
  .ls-btn.primary:hover{filter:brightness(1.08);}
  .ls-btn.ghost{background:transparent;}
  .ls-btn.small{padding:5px 10px;font-size:12px;}
  .ls-tabbar{display:flex;gap:18px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .ls-tab-btn{font-family:var(--font-ui);font-size:13px;font-weight:700;background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 2px;color:var(--text-muted);cursor:pointer;}
  .ls-tab-btn:hover{color:var(--text-primary);}
  .ls-tab-btn.active{color:var(--text-primary);border-bottom-color:var(--accent);}
  input[type=file].ls-hidden{display:none;}

  /* ---------- layout ---------- */
  .ls-layout{display:grid;grid-template-columns:272px 1fr;gap:20px;align-items:start;}
  @media (max-width: 880px){ .ls-layout{grid-template-columns:1fr;} }

  /* ---------- sidebar ---------- */
  .ls-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .ls-panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 10px;font-weight:700;}
  .ls-athlete-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .ls-athlete-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;cursor:pointer;text-align:left;width:100%;font-family:var(--font-ui);}
  .ls-athlete-card:hover{background:var(--surface-2);}
  .ls-athlete-card.active{background:var(--surface-2);border-color:var(--border);}
  .ls-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .ls-athlete-meta{flex:1;min-width:0;}
  .ls-athlete-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ls-athlete-sub{font-size:11.5px;color:var(--text-muted);}
  .ls-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;font-family:var(--font-mono);flex:none;}
  .ls-side-divider{height:1px;background:var(--border);margin:14px 0;}
  .ls-side-actions{display:flex;flex-direction:column;gap:6px;}

  /* ---------- main ---------- */
  .ls-empty{padding:60px 20px;text-align:center;color:var(--text-muted);}
  .ls-athlete-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .ls-athlete-title{display:flex;align-items:center;gap:12px;}
  .ls-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:16px;flex:none;}
  .ls-athlete-title h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .ls-athlete-title .ls-athlete-sub{font-size:12.5px;margin-top:2px;}
  .ls-title-actions{display:flex;gap:6px;}

  .ls-stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width: 1100px){ .ls-stat-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width: 620px){ .ls-stat-grid{grid-template-columns:repeat(2,1fr);} }
  .ls-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .ls-stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px;}
  .ls-stat-value{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
  .ls-stat-value small{font-family:var(--font-ui);font-size:11px;color:var(--text-muted);font-weight:600;margin-left:2px;}
  .ls-status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;font-family:var(--font-mono);}

  .ls-insight{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-bottom:18px;
    border-left:4px solid var(--accent);background:var(--surface);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
  .ls-insight b{font-weight:700;}
  .ls-insight p{margin:0;font-size:13px;line-height:1.5;color:var(--text-secondary);}

  .ls-period-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;border-radius:12px;padding:12px 14px;margin-bottom:18px;
    background:var(--surface);border:1px solid var(--border);}
  .ls-period-bar .ls-field{margin:0;width:150px;}
  .ls-period-bar .ls-field label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em;}
  .ls-period-bar .ls-period-arrow{color:var(--text-muted);font-size:14px;padding-bottom:9px;}
  .ls-period-note{flex:1 1 240px;font-size:11.5px;color:var(--text-muted);line-height:1.5;padding-bottom:2px;}

  .ls-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media (max-width: 980px){ .ls-charts{grid-template-columns:1fr;} }
  .ls-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 8px;}
  .ls-chart-card.full{grid-column:1 / -1;}
  .ls-chart-card h3{font-size:13px;font-weight:700;margin:0 0 2px;}
  .ls-chart-card .ls-chart-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
  .ls-chart-wrap{position:relative;height:220px;}
  .ls-chart-wrap.tall{height:260px;}
  .ls-chart-corner-badge{position:absolute;top:6px;right:8px;z-index:3;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 9px;text-align:right;box-shadow:0 1px 4px rgba(0,0,0,.10);pointer-events:none;}
  .ls-chart-corner-badge span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:1px;}
  .ls-chart-corner-badge b{display:block;font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--text-primary);white-space:nowrap;}
  .ls-ff-badges{display:flex;gap:14px;margin:2px 0 10px;}
  .ls-ff-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;border:3px solid;flex-shrink:0;}
  .ls-ff-circle .ls-ff-value{font-size:16px;font-weight:800;line-height:1;}
  .ls-ff-circle .ls-ff-label{font-size:8px;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;opacity:.85;}
  .ls-chart-wrap.radar{height:340px;max-width:440px;margin:0 auto;}
  .ls-chart-wrap.donut{height:400px;max-width:760px;margin:0 auto;}
  .ls-subchart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width: 760px){ .ls-subchart-grid{grid-template-columns:1fr;} }
  .ls-subchart-label{font-size:11.5px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
  .ls-matrix-note{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;text-align:center;}

  /* ---------- VAM heatmap (onglet Jumeau numérique) ---------- */
  .ls-heat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;}
  .ls-heat-grid{display:grid;gap:6px;}
  .ls-heat-head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);text-align:center;padding-bottom:2px;}
  .ls-heat-row-label{font-size:11.5px;font-weight:700;color:var(--text-secondary);display:flex;align-items:center;line-height:1.25;}
  .ls-heat-cell{border-radius:10px;padding:10px 6px;text-align:center;min-height:52px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;border:1px solid var(--border);font-family:var(--font-mono);
    font-size:13px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .ls-heat-cell.empty{background:var(--surface-2);color:var(--text-muted);font-weight:600;}

  /* ---------- curseurs modernes (simulateur) ---------- */
  .ls-slider-wrap{position:relative;padding-top:30px;}
  .ls-slider-pill{position:absolute;top:0;transform:translateX(-50%);background:var(--text-primary);color:var(--bg);
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap;
    box-shadow:0 4px 10px -4px rgba(0,0,0,0.35);pointer-events:none;}
  .ls-slider-pill:after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:7px;height:7px;background:var(--text-primary);}
  .ls-slider-wrap input[type=range].ls-slider-modern{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;
    background:var(--surface-2);margin:0;cursor:pointer;accent-color:unset;padding:0;border:none;}
  .ls-slider-wrap input[type=range].ls-slider-modern::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:transparent;}
  .ls-slider-wrap input[type=range].ls-slider-modern::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;
    border-radius:999px;background:#fff;border:4px solid var(--accent);box-shadow:0 4px 10px -4px rgba(0,0,0,0.35);cursor:grab;}
  .ls-slider-wrap input[type=range].ls-slider-modern.orange::-webkit-slider-thumb{border-color:var(--cat-2);}
  .ls-slider-wrap input[type=range].ls-slider-modern::-moz-range-track{height:8px;border-radius:999px;background:var(--surface-2);}
  .ls-slider-wrap input[type=range].ls-slider-modern::-moz-range-thumb{width:14px;height:14px;border-radius:999px;background:#fff;
    border:4px solid var(--accent);box-shadow:0 4px 10px -4px rgba(0,0,0,0.35);cursor:grab;}
  .ls-slider-wrap input[type=range].ls-slider-modern.orange::-moz-range-thumb{border-color:var(--cat-2);}
  .ls-slider-wrap input[type=range].ls-slider-modern:disabled{opacity:.5;cursor:default;}
  .ls-slider-scale{display:flex;justify-content:space-between;margin-top:5px;}
  .ls-slider-scale span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);}

  /* ---------- onglet Santé (coach) ---------- */
  .ls-sante-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;}
  .ls-sante-card h3{font-size:15px;font-weight:800;letter-spacing:-0.01em;margin:0 0 2px;}
  .ls-sante-hint{font-size:12px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
  .ls-sante-legend-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);margin-top:12px;}
  .ls-sante-legend-item{display:flex;align-items:center;gap:6px;}
  .ls-sante-legend-swatch{width:16px;height:3px;border-radius:2px;flex:none;}
  .ls-sante-legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .ls-sante-toggle-group{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;}
  .ls-sante-toggle-btn{font-family:var(--font-ui);font-size:12px;font-weight:700;border:none;background:transparent;color:var(--text-muted);padding:7px 14px;border-radius:8px;cursor:pointer;}
  .ls-sante-toggle-btn.active{background:var(--surface);color:var(--text-primary);box-shadow:0 1px 2px rgba(11,11,11,.08);}
  .ls-sante-body-label{font-size:11.5px;font-weight:700;color:var(--text-muted);}

  .ls-table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .ls-table-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .ls-table-head h3{font-size:13px;font-weight:700;margin:0;}
  .ls-nutrition-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .ls-nutrition-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .ls-nutrition-card-items{display:flex;flex-direction:column;gap:6px;}
  .ls-nutrition-item-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);}
  .ls-portion-row{display:flex;gap:8px;margin-top:6px;}
  .ls-portion-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;font-family:var(--font-ui);
    font-size:10.5px;color:var(--text-muted);}
  .ls-portion-btn.active{border-color:var(--accent);color:var(--text-primary);background:var(--surface);}
  .ls-table-scroll{overflow-x:auto;max-height:360px;overflow-y:auto;border-radius:10px;}
  table.ls-log{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
  table.ls-log th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--grid);font-weight:700;}
  table.ls-log td{padding:8px 10px;border-bottom:1px solid var(--grid);color:var(--text-secondary);white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.ls-log td.ls-num{font-family:var(--font-mono);}
  table.ls-log tr:last-child td{border-bottom:none;}
  .ls-row-actions{display:flex;gap:4px;}
  .ls-icon-btn{border:none;background:transparent;color:var(--text-muted);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:12px;}
  .ls-icon-btn:hover{background:var(--surface-2);color:var(--text-primary);}
  .ls-legend-note{font-size:11px;color:var(--text-muted);margin-top:8px;}

  /* ---------- modal ---------- */
  .ls-modal-overlay{position:fixed;inset:0;background:rgba(11,11,11,0.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .ls-modal{background:var(--surface);border-radius:16px;border:1px solid var(--border);max-width:520px;width:100%;
    max-height:88vh;overflow-y:auto;padding:22px;}
  .ls-modal h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .ls-modal .ls-modal-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
  .ls-field{margin-bottom:12px;}
  .ls-field label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:5px;}
  .ls-field input, .ls-field select{width:100%;font-family:var(--font-ui);font-size:13.5px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--border);background:var(--bg);color:var(--text-primary);}
  .ls-field input:focus, .ls-field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .ls-field input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:none;background:none;height:auto;margin:6px 0 2px;}
  .ls-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ls-field-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .ls-field-row5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .ls-zone-check{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono);}
  .ls-zone-check.warn{color:var(--serious);}
  .ls-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .ls-footer{margin-top:28px;text-align:center;font-size:11.5px;color:var(--text-muted);}
  .ls-footer a{color:var(--text-secondary);}
  [hidden]{display:none!important;}

  /* ---------- export PDF ---------- */
  /* Pendant la capture html2canvas, on masque les contrôles interactifs du
     tableau de bord (boutons d'action, barre de période, sélecteur de filtre)
     : ces éléments n'ont pas leur place dans un rapport figé, et la période
     est de toute façon réaffichée en texte dans l'en-tête du PDF. */
  .pdf-exporting .ls-title-actions,
  .pdf-exporting .ls-period-bar,
  .pdf-exporting .pdf-hide{ display:none!important; }
  .ls-btn[disabled]{opacity:.6;cursor:default;pointer-events:none;}

  /* ---------- toast / banner ---------- */
  .ls-toast{display:flex;align-items:flex-start;gap:10px;border-radius:12px;padding:11px 14px;margin-bottom:16px;
    border:1px solid var(--border);background:var(--surface);border-left:4px solid var(--accent);font-size:13px;color:var(--text-secondary);}
  .ls-toast button{margin-left:auto;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:13px;padding:0 2px;flex:none;}

  /* ---------- strava ---------- */
  .ls-btn.strava{background:#fc4c02;color:#fff;border-color:transparent;}
  .ls-btn.strava:hover{filter:brightness(1.06);}
  .ls-strava-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;
    background:var(--good);color:var(--good-ink);font-family:var(--font-mono);}
  .ls-source-tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;font-family:var(--font-mono);}
  .ls-source-tag.manual{background:var(--surface-2);color:var(--text-muted);}
  .ls-source-tag.strava{background:#fc4c0222;color:#fc4c02;}
  .ls-source-tag.garmin{background:#0a84c222;color:#0a84c2;}

  /* ---------- key gate ---------- */
  .ls-gate-note{font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.5;}
  .ls-gate-error{font-size:12px;color:var(--critical);margin-top:8px;}

  /* ---------- intensity table ---------- */
  .ls-modal.wide{max-width:920px;}
  table.ls-intensity{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  table.ls-intensity col.ls-intensity-col-name{width:34%;}
  table.ls-intensity th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
    padding:6px 8px;font-weight:700;}
  table.ls-intensity td{padding:4px 6px;}

  { value:"route", label:"Route" },

function defaultIntensityZones(){

  return zones;

// Visualisation de la table d'intensité (barre segmentée + liste compacte),
// remplace l'ancien tableau à 3 colonnes -- proposition validée par Maxime
// le 2026-09-23 (voir l'artefact de proposition visuelle : barre + liste avec
// entêtes "Zone d'allure"/"Zone FC", couleurs Z1-Z7 d'origine conservées pour
// rester cohérent avec les graphiques de zones de séance). Barre proportionnelle
// aux plages d'allure quand les 7 zones sont entièrement renseignées, sinon
// segments à largeur égale (les données ne permettent alors aucun calcul fiable).
function intensityZonesVisualHtml(athleteObj){
  const zones = intensityZonesOf(athleteObj);
  const allComplete = zones.every(z => z.kmh_min!=null && z.kmh_max!=null && z.kmh_max > z.kmh_min);
  const widths = allComplete ? zones.map(z => z.kmh_max - z.kmh_min) : zones.map(()=>1);
  const total = widths.reduce((a,b)=>a+b, 0) || 1;
  const pct = widths.map(w => (w/total*100).toFixed(2));

  const bar = zones.map((z,i)=>
    `<div style="flex:0 0 ${pct[i]}%;background:${cssVar(PACE_ZONE_VARS[i])};${i<6?`border-right:2px solid ${cssVar("--surface")};`:""}"></div>`
  ).join("");

  const labels = zones.map((z,i)=> `<span style="flex:0 0 ${pct[i]}%;">Z${i+1}</span>`).join("");

  const rows = zones.map((z,i)=>{
    const allureTxt = (z.kmh_min!=null || z.kmh_max!=null) ? `${z.kmh_min!=null?z.kmh_min:"?"}–${z.kmh_max!=null?z.kmh_max:"?"} km/h` : "—";
    const fcTxt = i>=5 ? "—" : ((z.hr_min!=null || z.hr_max!=null) ? `${z.hr_min!=null?z.hr_min:"?"}–${z.hr_max!=null?z.hr_max:"?"}` : "—");
    return `<div class="ls-izone-row">
      <span class="ls-izone-dot" style="background:${cssVar(PACE_ZONE_VARS[i])}"></span>
      <span class="ls-izone-name">${escapeHtml(z.name)}</span>
      <span class="ls-izone-val ls-izone-col-allure">${allureTxt}</span>
      <span class="ls-izone-val ls-izone-col-fc">${fcTxt}</span>
    </div>`;
  }).join("");

  return `
    <div class="ls-izone-bar">${bar}</div>
    <div class="ls-izone-labels">${labels}</div>
    <div class="ls-izone-list">
      <div class="ls-izone-row ls-izone-head">
        <span class="ls-izone-dot" style="background:transparent"></span>
        <span class="ls-izone-name"></span>
        <span class="ls-izone-val ls-izone-col-allure">Zone d'allure</span>
        <span class="ls-izone-val ls-izone-col-fc">Zone FC</span>
      </div>
      ${rows}
    </div>`;
}

// hebdo, Zones d'allure, Efficacité physiologique) : un seul état
// `chartPeriod` partagé, mais une instance du contrôle sur chaque carte —
// modifier l'une met à jour toutes les autres au prochain rendu, sans avoir
// à remonter en haut de page. `suffix` distingue les id (uniques dans le
// DOM) de chaque instance ; voir les écouteurs dans renderMain().
function periodBarHtml(suffix, note){
  return `
        <div class="ls-period-bar">
          <div class="ls-field">
            <label>Période — début</label>
            <input type="date" id="period-start-${suffix}" value="${chartPeriod.start}" max="${chartPeriod.end}">
          </div>
          <div class="ls-period-arrow">→</div>
          <div class="ls-field">
            <label>Période — fin</label>
            <input type="date" id="period-end-${suffix}" value="${chartPeriod.end}" min="${chartPeriod.start}">
          </div>
          <button class="ls-btn small ghost" type="button" id="btn-period-reset-${suffix}">Réinitialiser (6 mois)</button>
          <div class="ls-period-note">${note}</div>
        </div>`;
}

// Même principe que defaultChartPeriod/ensureChartPeriod, mais pour le
// graphe "Durée réelle vs ajustée" : sur un historique profond (des années
// de séances), le tracer en entier le rend illisible — on affiche donc par
// défaut le dernier mois, affinable via son propre sélecteur de dates.
function defaultEnvChartPeriod(){
  const end = new Date();
  const start = new Date(end); start.setMonth(start.getMonth()-1);
  return { start: fmtDate(start), end: fmtDate(end) };
}
function ensureEnvChartPeriod(){ if(!envChartPeriod) envChartPeriod = defaultEnvChartPeriod(); return envChartPeriod; }

// Période par défaut de l'onglet Nutrition : 2 dernières semaines (contrairement
// aux séances, les repas sont quotidiens — un mois entier surchargerait la liste).
function defaultNutritionPeriod(){
  const end = new Date();
  const start = new Date(end); start.setDate(start.getDate()-14);
  return { start: fmtDate(start), end: fmtDate(end) };
}
function ensureNutritionPeriod(){ if(!nutritionPeriod) nutritionPeriod = defaultNutritionPeriod(); return nutritionPeriod; }

// Initialise (une seule fois — n'écrase jamais un choix déjà fait par le
// coach) les deux périodes de comparaison du graphique "Profil terrain", en
// reproduisant par défaut l'ancien calcul automatique (fenêtre de
// `weeks` semaines se terminant à periodStart pour la référence, et à
// periodEnd pour la période récente) pour que rien ne change visuellement
// tant que le coach n'a pas touché aux nouveaux sélecteurs.
function ensureTerrainComparePeriods(periodStartStr, periodEndStr, weeks){
  if(!terrainCompareA){
    const end = new Date(periodStartStr+"T00:00:00");
    const start = new Date(end); start.setDate(start.getDate() - weeks*7);
    terrainCompareA = { start: fmtDate(start), end: periodStartStr };
  }
  if(!terrainCompareB){
    const end = new Date(periodEndStr+"T00:00:00");
    const start = new Date(end); start.setDate(start.getDate() - weeks*7);
    terrainCompareB = { start: fmtDate(start), end: periodEndStr };
  }
}

/* ---------------------------- API layer ---------------------------- */

async function apiFetch(path, options){
  options = options || {};
  const key = localStorage.getItem(COACH_KEY_STORAGE) || "";
  const headers = Object.assign({ "Content-Type":"application/json", "x-coach-key": key }, options.headers||{});
  let res;
  try{
    res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
  }catch(e){
    throw new Error("Connexion au serveur impossible. Vérifiez votre connexion internet.");
  }
  if(res.status === 401){
    localStorage.removeItem(COACH_KEY_STORAGE);
    const err = new Error("unauthorized");
    err.unauthorized = true;
    throw err;
  }
  if(!res.ok){
    let msg = "Erreur serveur (" + res.status + ")";
    try{ const j = await res.json(); if(j.error) msg = j.error; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

/* ---------------------------- Rattrapage VAM (maintenance ponctuelle) ---------------------------- */
// Recalcule vam_climb_profile/vam_descent_profile des séances Strava déjà
// synchronisées, par lots successifs (fonction Edge vam-backfill), tant que
// le bouton reste actif et que la page est ouverte. Curseur + compteurs
// cumulés persistés en localStorage pour pouvoir reprendre là où on s'était
// arrêté (fermeture de la page, ou pause imposée par la limite Strava) sans
// tout recompter depuis le début.
let vamBackfillRunning = false;
function loadVamBackfillState(){
  try{
    const s = JSON.parse(localStorage.getItem(VAM_BACKFILL_STATE_KEY));
    if(s && typeof s === "object") return s;
  }catch(e){}
  return { afterId:"00000000-0000-0000-0000-000000000000", totalProcessed:0, totalUpdated:0, totalErrors:0, done:false };
}
function saveVamBackfillState(s){
  try{ localStorage.setItem(VAM_BACKFILL_STATE_KEY, JSON.stringify(s)); }catch(e){}
}
async function runVamBackfillLoop(){
  if(vamBackfillRunning) return;
  const btn = document.getElementById("btn-vam-backfill");
  const statusEl = document.getElementById("vam-backfill-status");
  if(!btn || !statusEl) return;
  const key = localStorage.getItem(COACH_KEY_STORAGE) || "";
  let state = loadVamBackfillState();
  if(state.done){
    state = { afterId:"00000000-0000-0000-0000-000000000000", totalProcessed:0, totalUpdated:0, totalErrors:0, done:false };
    saveVamBackfillState(state);
  }
  vamBackfillRunning = true;
  btn.disabled = true;
  btn.textContent = "Rattrapage en cours… (cliquer pour arrêter)";
  const render = (extra) => {
    statusEl.textContent = state.totalProcessed + " séance(s) vérifiée(s), " + state.totalUpdated + " mise(s) à jour, " + state.totalErrors + " erreur(s)" + (extra ? " — " + extra : "");
  };
  render();
  try{
    while(!state.done && vamBackfillRunning){
      let res;
      try{
        res = await fetch(VAM_BACKFILL_URL + "?limit=30&after=" + encodeURIComponent(state.afterId), { headers: { "x-coach-key": key } });
      }catch(e){
        render("connexion impossible, nouvelle tentative dans 30s");
        await new Promise(r=>setTimeout(r, 30000));
        continue;
      }
      if(res.status === 401){ render("clé d'accès invalide"); break; }
      let data;
      try{ data = await res.json(); }catch(e){ render("réponse serveur invalide"); break; }
      if(data.error){ render("erreur : " + data.error); break; }
      state.totalProcessed += data.processed || 0;
      state.totalUpdated += data.updated || 0;
      state.totalErrors += (data.errors ? data.errors.length : 0);
      if(data.lastId) state.afterId = data.lastId;
      state.done = !!data.done;
      saveVamBackfillState(state);
      if(data.rateLimited){
        render("limite Strava atteinte, reprise dans 15 min");
        await new Promise(r=>setTimeout(r, 15*60*1000));
        continue;
      }
      render();
      if(!state.done) await new Promise(r=>setTimeout(r, 1500));
    }
  } finally {
    vamBackfillRunning = false;
    btn.disabled = false;
    btn.textContent = "Rattrapage VAM (montée/descente)";
    render(state.done ? "terminé ✓" : "arrêté — recliquer pour reprendre");
  }
}

/* ------------------- Rattrapage terrain Minetti (maintenance ponctuelle) ------------------- */
// Contrairement au rattrapage VAM (paginé, par lots, depuis le navigateur),
// strava-backfill-gap traite tout côté serveur en tâche de fond dès qu'on le
// déclenche (voir son commentaire) : un seul appel avec force_all:true
// suffit, la page n'a pas de retour de progression détaillé — seulement la
// confirmation que le traitement a démarré. Recharger la page après
// quelques minutes (le temps que le serveur traite l'historique) pour voir
// les nouvelles valeurs de facteur terrain.
async function runTerrainBackfill(){
  const btn = document.getElementById("btn-terrain-backfill");
  const statusEl = document.getElementById("terrain-backfill-status");
  if(!btn || !statusEl) return;
  const key = localStorage.getItem(COACH_KEY_STORAGE) || "";
  btn.disabled = true;
  statusEl.textContent = "Déclenchement…";
  try{
    const res = await fetch(STRAVA_BACKFILL_GAP_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json", "x-coach-key": key },
      body: JSON.stringify({ force_all: true }),
    });
    if(res.status === 401){ statusEl.textContent = "clé d'accès invalide"; return; }
    if(!res.ok){ statusEl.textContent = "erreur serveur (" + res.status + ")"; return; }
    statusEl.textContent = "lancé — traitement en arrière-plan côté serveur, ça peut prendre plusieurs minutes selon le nombre de séances. Rechargez la page dans un moment pour voir les nouvelles valeurs.";
  }catch(e){
    statusEl.textContent = "connexion impossible";
  }finally{
    btn.disabled = false;
  }
}

function athleteFromApi(a){
  return { id:a.id, name:a.name, sport:a.sport, maxHR: a.max_hr, colorIndex: a.color_index,
    stravaAthleteId: a.strava_athlete_id, heightCm: a.height_cm, weightKg: a.weight_kg!=null? Number(a.weight_kg): null,
    birthDate: a.birth_date, intensityZones: Array.isArray(a.intensity_zones)? a.intensity_zones : null,
    email: a.email || "", sex: a.sex || null, activityLevel: a.activity_level || null };
}
function athleteToApi(a){
  const row = { name:a.name, sport:a.sport, max_hr: a.maxHR!=null? a.maxHR : null, color_index: a.colorIndex||0,
    height_cm: a.heightCm!=null? a.heightCm : null, weight_kg: a.weightKg!=null? a.weightKg : null,
    birth_date: a.birthDate || null, intensity_zones: a.intensityZones || null,
    email: a.email || null, sex: a.sex || null, activity_level: a.activityLevel || null };
  if(a.id) row.id = a.id;
  return row;
}

function ageFromBirthDate(dateStr){
  if(!dateStr) return null;
  const b = new Date(dateStr + "T00:00:00");
  if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

// Icône "assiette plus ou moins remplie" — anneau de progression (33/66/100%)
// plutôt qu'une assiette dessinée, pour rester lisible en petite taille et
// cohérent avec les autres indicateurs circulaires de l'appli (ls-status-pill).
function nutritionPlateIconSvg(portion, size){
  const px = size || 30;
  const pct = portion===1? 0.34 : portion===2? 0.67 : 1.0;
  const r = 12, c = 2*Math.PI*r;
  const dash = c*pct;
  return `<svg width="${px}" height="${px}" viewBox="0 0 30 30" aria-hidden="true">
    <circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"></circle>
    <circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4"
      stroke-dasharray="${dash.toFixed(1)} ${(c-dash).toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 15 15)"></circle>
  </svg>`;
}

// Estimation calorique indicative d'un élément (rôle+type+portion), arrondie
// à la dizaine (cohérent avec la précision affichée ailleurs, ex. envFmtPct).
function nutritionItemKcal(catalog, type, portion){
  const list = NUTRITION_ITEMS[catalog];
  if(!list) return 0;
  const item = list.find(i=>i.value===type) || list.find(i=>i.value==="autre");
  if(!item) return 0;
  return Math.round((item.kcal * nutritionPortionMult(portion)) / 10) * 10;
}

// Total calorique indicatif d'un repas (somme des éléments présents dans entry.items).
function nutritionEntryKcal(entry){
  const structure = NUTRITION_MEAL_STRUCTURE[entry.mealType] || [];
  let total = 0;
  structure.forEach(({role, catalog})=>{
    const it = entry.items && entry.items[role];
    if(it && it.type) total += nutritionItemKcal(catalog, it.type, it.portion || 2);
  });
  return total;
}

// ---- Métabolisme de base : moyenne de 3 formules reconnues, ne nécessitant
// que poids/taille/âge/sexe (contrairement à Katch-McArdle, qui a besoin de
// la masse grasse, non suivie ici). ----
function bmrMifflinStJeor(sex, weightKg, heightCm, age){
  const base = 10*weightKg + 6.25*heightCm - 5*age;
  return sex === "femme" ? base - 161 : base + 5;
}
function bmrHarrisBenedictRevised(sex, weightKg, heightCm, age){
  return sex === "femme"
    ? 447.593 + 9.247*weightKg + 3.098*heightCm - 4.330*age
    : 88.362 + 13.397*weightKg + 4.799*heightCm - 5.677*age;
}
function bmrWhoFao(sex, weightKg, age){
  if(sex === "femme"){
    if(age < 30) return 14.7*weightKg + 496;
    if(age < 60) return 8.7*weightKg + 829;
    return 10.5*weightKg + 596;
  }
  if(age < 30) return 15.3*weightKg + 679;
  if(age < 60) return 11.6*weightKg + 879;
  return 13.5*weightKg + 487;
}
// Moyenne de Mifflin-St Jeor (1990), Harris-Benedict révisée (Roza & Shizgal
// 1984) et WHO/FAO (2001). null si sexe/poids/taille/âge manquent.
function bmrAverage(sex, weightKg, heightCm, age){
  if(!sex || !weightKg || !heightCm || age == null) return null;
  const a = bmrMifflinStJeor(sex, weightKg, heightCm, age);
  const b = bmrHarrisBenedictRevised(sex, weightKg, heightCm, age);
  const c = bmrWhoFao(sex, weightKg, age);
  return Math.round((a+b+c)/3);
}

// Coefficients PAL (Physical Activity Level) standards de la littérature —
// niveau d'activité de la VIE COURANTE (travail, déplacements, loisirs),
// volontairement HORS entraînement structuré : les calories de séance
// (Keytel ci-dessous) sont ajoutées en plus les jours avec entraînement
// importé, pour ne jamais compter le même effort deux fois.
const ACTIVITY_LEVEL_PAL = { non_actif:1.2, peu_actif:1.375, actif:1.55, tres_actif:1.725 };
const ACTIVITY_LEVEL_LABELS = { non_actif:"Non actif", peu_actif:"Peu actif", actif:"Actif", tres_actif:"Très actif" };
function activityLevelPal(level){ return ACTIVITY_LEVEL_PAL[level] ?? null; }
function activityLevelLabel(level){ return ACTIVITY_LEVEL_LABELS[level] || "—"; }

// Dépense calorique d'une séance à partir de la FC moyenne (Keytel et al.
// 2005, Journal of Sports Sciences — référence pour l'estimation de dépense
// énergétique par FC, formule distincte selon le sexe). Nécessite FC moyenne
// de la séance (sessions.avg_hr, fournie par Strava), poids, âge et sexe.
// Plafonné à 0 (la formule peut devenir négative à FC très basse, hors de sa
// plage de validité).
function sessionCaloriesKeytel(sex, avgHr, weightKg, ageYears, durationMin){
  if(!sex || avgHr == null || !weightKg || ageYears == null || !durationMin) return null;
  const kcalPerMin = sex === "femme"
    ? (-20.4022 + 0.4472*avgHr - 0.1263*weightKg + 0.074*ageYears) / 4.184
    : (-55.0969 + 0.6309*avgHr + 0.1988*weightKg + 0.2017*ageYears) / 4.184;
  return Math.round(Math.max(0, kcalPerMin) * durationMin);
}

// Dépense calorique totale d'un jour donné : métabolisme de base × PAL (vie
// courante) + calories des séances importées ce jour-là (Keytel, une par
// séance avec FC moyenne disponible). null si le profil est incomplet.
function dailyExpenditure(athlete, sessionsOfDay){
  const age = ageFromBirthDate(athlete.birthDate);
  const bmr = bmrAverage(athlete.sex, athlete.weightKg, athlete.heightCm, age);
  const pal = activityLevelPal(athlete.activityLevel);
  if(bmr == null || pal == null) return null;
  let total = Math.round(bmr * pal);
  let sessionsCounted = 0, sessionsMissingHr = 0;
  (sessionsOfDay||[]).forEach(s=>{
    const kcal = sessionCaloriesKeytel(athlete.sex, s.avgHr, athlete.weightKg, age, s.duration);
    if(kcal != null){ total += kcal; sessionsCounted++; }
    else if(s.duration) sessionsMissingHr++;
  });
  return { total, bmr, pal, sessionsCounted, sessionsMissingHr };
}

// Sévérité de l'écart apports/dépenses, en % de la dépense — mêmes paliers
// visuels (good/warning/serious/critical) que statusVar/statusInk ailleurs.
function nutritionBalanceSeverity(apports, depense){
  if(depense == null || depense === 0) return { key:"none", label:"—" };
  const ecart = apports - depense;
  const pct = Math.abs(ecart) / depense;
  const dir = ecart < -1 ? "déficit" : ecart > 1 ? "surplus" : "équilibre";
  if(pct < 0.08) return { key:"good", label:"Équilibré" };
  if(pct < 0.20) return { key:"warning", label:"Léger " + dir };
  if(pct < 0.35) return { key:"serious", label: dir.charAt(0).toUpperCase()+dir.slice(1)+" marqué" };
  return { key:"critical", label: dir.charAt(0).toUpperCase()+dir.slice(1)+" important" };
}
