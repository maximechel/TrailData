      label: lab, data: weeks.map(w=>w.zones[i]), backgroundColor: zoneColors[i], stack:"z", borderRadius:2, maxBarThickness:28
    }))},
    options: baseChartOptions({ scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
  });

  // Donut "zones de FC — historique complet" : indépendant de la période
  // choisie plus haut, filtrable par activité (sélecteur dans renderMain).
  const zonesTotalWrap = document.getElementById("zones-total-chart-wrap");
  // Le sélecteur d'activité rappelle renderCharts() seul (sans renderMain()),
  // donc si le tour précédent avait remplacé ce wrap par le message "aucune
  // donnée", il faut réinsérer le <canvas> avant de retenter — sinon
  // document.getElementById("chart-zones-total") renverrait null.
  if(zonesTotalWrap){
    zonesTotalWrap.innerHTML = '<canvas id="chart-zones-total"></canvas>';
    const zonesTotalSessions = zonesTotalActivityFilter === "all" ? sessions : sessions.filter(s=>s.type===zonesTotalActivityFilter);
    const zonesTotalMinutes = [0,0,0,0,0];
    zonesTotalSessions.forEach(s=> s.zones.forEach((m,i)=> zonesTotalMinutes[i]+=(m||0)));
    const zonesTotalSum = zonesTotalMinutes.reduce((a,b)=>a+b,0);
    if(zonesTotalSum > 0){
      charts.zonesTotal = new Chart(document.getElementById("chart-zones-total"), {
        type:"doughnut",
        data:{ labels: ZONE_LABELS, datasets:[{ data: zonesTotalMinutes, backgroundColor: zoneColors, borderColor: cssVar("--surface"), borderWidth:2 }] },
        options:{
          responsive:true, maintainAspectRatio:false, cutout:"62%",
          layout:{ padding:{ top:18, bottom:34, left:100, right:100 } },
          plugins:{
            legend:{ position:"top", labels:{ color: cssVar("--text-muted"), font:{family:"Manrope", size:11}, boxWidth:10, boxHeight:10, usePointStyle:true } },
            tooltip:{ backgroundColor: cssVar("--surface"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-secondary"),
              borderColor: cssVar("--border"), borderWidth:1, padding:10,
              callbacks:{ label: ctx => ` ${fmtHoursMinutes(ctx.parsed)} (${(ctx.parsed/zonesTotalSum*100).toFixed(2).replace(".",",")} %)` } },
            centerText:{ text: fmtHoursMinutes(zonesTotalSum) }
          }
        },
        plugins:[zoneDonutCenterTextPlugin, zoneDonutLeaderLabelsPlugin, zoneDonutLegendGapPlugin]
      });
    } else {
      zonesTotalWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune séance avec zones de FC renseignées pour cette activité.</div>';
    }
  }

  // Zones d'allure = contrainte liée à la vitesse de course. Les bornes (km/h)
  // sont calibrées pour la course à pied : un vélo ou une autre activité plus
  // rapide y atterrirait artificiellement dans les zones hautes (anaérobie)
  // sans que l'effort réel le justifie. On ne garde donc que Course à pied et
  // Trail, en réutilisant les mêmes semaines que les autres graphiques
  // (weeklyAggregates sur le sous-ensemble filtré, réaligné sur `weeks` pour
  // que les semaines sans course à pied affichent bien une barre à 0 plutôt
  // que d'être absentes ou décalées).
  const paceSessions = sessions.filter(s => s.type === "Course à pied" || s.type === "Trail");
  const paceWeeksRaw = weeklyAggregates(paceSessions, periodStartStr, periodEndStr);
  const paceByWeek = {};
  paceWeeksRaw.forEach(w => { paceByWeek[w.week] = w; });
  const hasPaceData = weeks.some(w => paceByWeek[w.week]?.hasPaceData);
  const paceWrap = document.getElementById("pace-chart-wrap");
  if(hasPaceData && paceWrap){
    const paceColors = PACE_ZONE_VARS.map(v=>cssVar(v));
    charts.pace = new Chart(document.getElementById("chart-pace-zones"), {
      type:"bar",
      data:{ labels: wkLabels, datasets: [0,1,2,3,4,5,6].map(i=>({
        label: paceZoneLabel(athlete, i), data: weeks.map(w=>paceByWeek[w.week]?.paceZones[i] || 0), backgroundColor: paceColors[i], stack:"p", borderRadius:2, maxBarThickness:28
      }))},
      options: baseChartOptions({ scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
    });
  } else if(paceWrap){
    paceWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment — nécessite des séances importées depuis Strava et une table d\'intensité complète (bouton « Table d\'intensité » ci-dessus).</div>';
  }

  const physioWrap = document.getElementById("physio-chart-wrap");
  // Une courbe par mois calendaire de la période choisie (plutôt qu'un simple
  // avant/après) : dégradé du plus ancien (terne) au plus récent (couleur
  // pleine de l'athlète), pour voir la progression aérobie se dessiner sur
  // toute la période plutôt qu'entre deux clichés.
  const physioMonths = monthsBetween(periodStart, periodEnd);
  const physioMonthData = physioMonths.map(m=>{
    const monthSessions = sessions.filter(s=>{
      if(s.date < periodStartStr || s.date > periodEndStr) return false;
      const d = new Date(s.date+"T00:00:00");
      return d.getFullYear() === m.year && d.getMonth() === m.month;
    });
    return { label: monthLabelFr(m.year, m.month), gapZ: gapZoneAverageOf(monthSessions) };
  }).filter(m => m.gapZ.some(v=>v!=null));
  const hasGapData = physioMonthData.length > 0;
  if(hasGapData && physioWrap){
    const mutedColor = cssVar("--text-muted");
    const n = physioMonthData.length;
    charts.physio = new Chart(document.getElementById("chart-physio"), {
      type:"line",
      data:{ labels: ZONE_LABELS, datasets: physioMonthData.map((m,i)=>{
        const t = n>1 ? i/(n-1) : 1;
        const lineColor = mixHexColors(mutedColor, color, t);
        return {
          label: m.label, data: m.gapZ, borderColor: lineColor, backgroundColor: lineColor,
          borderWidth: n>1 ? 1.5+1.5*t : 2, tension: 0.3, spanGaps: true,
          pointRadius: 3, pointHoverRadius: 5, fill: false
        };
      })},
      options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"km/h équivalent plat", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
    });
  } else if(physioWrap){
    physioWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment — nécessite des séances importées depuis Strava avec un historique de fréquence cardiaque.</div>';
  }

  const terrainWrap = document.getElementById("terrain-chart-wrap");
  // Périodes de comparaison choisies librement par le coach (voir les deux
  // sélecteurs de dates ajoutés sur cette carte), plutôt que dérivées
  // automatiquement de la période affichée plus haut.
  const terrainAStartDate = new Date(terrainCompareA.start+"T00:00:00");
  const terrainAEndDate = new Date(terrainCompareA.end+"T23:59:59");
  const terrainBStartDate = new Date(terrainCompareB.start+"T00:00:00");
  const terrainBEndDate = new Date(terrainCompareB.end+"T23:59:59");
  const gradePast = gapGradeAverageInRange(sessions, terrainAStartDate, terrainAEndDate);
  const gradeNow = gapGradeAverageInRange(sessions, terrainBStartDate, terrainBEndDate);
  const terrainLabelA = "Référence (" + fmtDateFr(terrainCompareA.start) + "–" + fmtDateFr(terrainCompareA.end) + ")";
  const terrainLabelB = "Récente (" + fmtDateFr(terrainCompareB.start) + "–" + fmtDateFr(terrainCompareB.end) + ")";
  const hasGradeData = gradeNow.some(v=>v!=null) || gradePast.some(v=>v!=null);
  if(hasGradeData && terrainWrap){
    charts.terrain = new Chart(document.getElementById("chart-terrain"), {
      type:"bar",
      data:{ labels: GRADE_BUCKET_LABELS, datasets:[
        { label: terrainLabelA, data: gradePast, backgroundColor: cssVar("--text-muted")+"66", borderRadius:4, maxBarThickness:36 },
        { label: terrainLabelB, data: gradeNow, backgroundColor: color, borderRadius:4, maxBarThickness:36 }
      ]},
      options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"km/h équivalent plat", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} },
        x:{ ticks:{ color:cssVar("--text-muted"), font:{size:10.5} } } } })
    });
  } else if(terrainWrap){
    terrainWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment sur ces deux périodes — nécessite des séances importées depuis Strava.</div>';
  }
}

              <td><input type="number" min="0" name="hrMin${i}" ${i>=5?"disabled":""} value="${z.hr_min!=null? z.hr_min:""}"></td>
              <td><input type="number" min="0" name="hrMax${i}" ${i>=5?"disabled":""} value="${z.hr_max!=null? z.hr_max:""}"></td>
            </tr>`).join("")}
          </tbody>
        </table>
        <div class="ls-intensity-note">Astuce : les zones Z1 à Z5 correspondent aux mêmes zones que le journal de séances (Échauffement → VO2max) — gardez les mêmes bornes FC pour rester cohérent.</div>
        <div class="ls-modal-actions">
          <button type="button" class="ls-btn ghost" id="modal-cancel">Annuler</button>
          <button type="submit" class="ls-btn primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>`;
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-overlay").addEventListener("click", e=>{ if(e.target.id==="modal-overlay") closeModal(); });
  document.getElementById("intensity-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const num = v => (v===null || v==="") ? null : +v;
    const newZones = zones.map((z,i)=>({
      name: (fd.get("name"+i) || z.name || "").toString().trim() || z.name,
      kmh_min: num(fd.get("kmhMin"+i)), kmh_max: num(fd.get("kmhMax"+i)),
      hr_min: i>=5? null : num(fd.get("hrMin"+i)), hr_max: i>=5? null : num(fd.get("hrMax"+i))
    }));
    const updated = Object.assign({}, athlete, { intensityZones: newZones });
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    try{
      await apiSaveAthlete(updated);
      closeModal();
      await refreshData();
    }catch(err){
      if(err.unauthorized){ closeModal(); showKeyGate("Clé d'accès expirée ou invalide, merci de la ressaisir."); return; }
      alert("Impossible d'enregistrer la table d'intensité : " + err.message);
      submitBtn.disabled = false;
    }
  });
}

const LOGO_ICON_URL = "logo-ruthene-icon.png";

let _pdfLibsPromise = null;
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error("Échec de chargement : " + src));
    document.head.appendChild(s);
  });
}
function ensurePdfLibs(){
  if(_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = (async ()=>{
    if(!window.html2canvas) await loadScript("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");
    if(!window.jspdf) await loadScript("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
  })();
  return _pdfLibsPromise;
}
function loadImage(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error("Logo introuvable : " + url));
    img.src = url;
  });
}

const PDF_PAGE_W = 210, PDF_PAGE_H = 297, PDF_MARGIN_X = 15, PDF_HEADER_H = 26, PDF_FOOTER_H = 32;
const PDF_CAPTURE_SCALE = 2; // doit rester cohérent avec le `scale` passé à html2canvas

function drawPdfHeader(pdf, iconImg, athleteName, periodLabel){
  const logoH = 15, logoW = logoH * (iconImg.width / iconImg.height);

  pdf.setFont("helvetica", "normal"); pdf.setFontSize(10); pdf.setTextColor(115, 115, 125);
  pdf.text(athleteName + " — " + periodLabel, PDF_PAGE_W - PDF_MARGIN_X, 19, { align: "right" });
  pdf.setDrawColor(222, 222, 228); pdf.setLineWidth(0.3);
  pdf.line(PDF_MARGIN_X, PDF_HEADER_H, PDF_PAGE_W - PDF_MARGIN_X, PDF_HEADER_H);
}

function drawPdfFooter(pdf, logoImg, pageNum, totalPages){
  const footTop = PDF_PAGE_H - PDF_FOOTER_H;
  pdf.setDrawColor(222, 222, 228); pdf.setLineWidth(0.3);
  pdf.line(PDF_MARGIN_X, footTop, PDF_PAGE_W - PDF_MARGIN_X, footTop);

  const logoW = 46, logoH = logoW * (logoImg.height / logoImg.width);
  const logoY = footTop + (PDF_FOOTER_H - logoH) / 2;
  pdf.addImage(logoImg, "PNG", PDF_MARGIN_X, logoY, logoW, logoH);

  const dividerX = PDF_MARGIN_X + logoW + 8;
  pdf.setDrawColor(215, 215, 220);
  pdf.line(dividerX, footTop + 6, dividerX, PDF_PAGE_H - 8);

  const textX = dividerX + 8;
  let ty = footTop + 11;
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(11); pdf.setTextColor(25, 25, 35);
  pdf.text(COACH_SIGNATURE.name, textX, ty); ty += 5;
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9.5); pdf.setTextColor(115, 115, 125);
  pdf.text(COACH_SIGNATURE.role, textX, ty); ty += 6;
  pdf.setFontSize(9.5); pdf.setTextColor(90, 90, 100);
  pdf.text(COACH_SIGNATURE.phone, textX, ty); ty += 5;
  pdf.text(COACH_SIGNATURE.email, textX, ty);

  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(150, 150, 158);
  pdf.text(pageNum + " / " + totalPages, PDF_PAGE_W - PDF_MARGIN_X, PDF_PAGE_H - 8, { align: "right" });
}

// Mesure, dans le DOM en cours (donc APRES le masquage .pdf-exporting), les
// blocs "insécables" du tableau de bord : chaque enfant direct de #main-panel
// (en-tête athlète, stats, insight...) et, séparément, chaque carte de
// #main-panel .ls-charts — pour ne jamais couper une carte au milieu lors
// de la pagination. Les blocs qui se chevauchent verticalement (deux cartes
// côte à côte sur la même ligne de la grille) sont fusionnés en un seul
// groupe, puisqu'on ne peut de toute façon pas les séparer dans une image
// déjà aplatie par html2canvas.
function measurePdfBreakUnits(main){
  const mainTop = main.getBoundingClientRect().top;
  const units = [];
  const pushIfVisible = (el)=>{
    if(!el || el.offsetParent === null) return; // display:none (masqué par .pdf-exporting, ou onglet inactif)
    const r = el.getBoundingClientRect();
    if(r.height <= 0) return;
    units.push({ top: r.top - mainTop, bottom: r.bottom - mainTop });
  };
  // Descend transparemment dans le panneau de l'onglet actif (.ls-tab-panel) —
  // seul l'onglet visible contribue des blocs ; l'onglet masqué est ignoré
  // entièrement (offsetParent null). Préserve le découpage fin par carte
  // existant à l'intérieur de .ls-charts.
  const walk = (children)=>{
    Array.from(children).forEach(child=>{
      if(child.classList && child.classList.contains("ls-charts")){
        Array.from(child.children).forEach(pushIfVisible);
      } else if(child.classList && child.classList.contains("ls-tab-panel")){
        if(child.offsetParent === null) return;
        walk(child.children);
      } else {
        pushIfVisible(child);
      }
    });
  };
  walk(main.children);
  units.sort((a,b)=> a.top - b.top);
  const rows = [];
  units.forEach(u=>{
    const last = rows[rows.length - 1];
    if(last && u.top < last.bottom - 0.5) last.bottom = Math.max(last.bottom, u.bottom);
    else rows.push({ top: u.top, bottom: u.bottom });
  });
  return rows;
}

// Découpe la hauteur totale du canvas en pages, en ne coupant jamais à
// l'intérieur d'un des blocs mesurés par measurePdfBreakUnits (sauf, en
// tout dernier recours, un bloc à lui seul plus haut qu'une page entière).
function paginateCanvas(canvasHeightPx, rowsPx, pageCapacityPx){
  const pages = [];
  let pageStart = 0, i = 0;
  while(i < rowsPx.length){
    let pageEnd = pageStart, usedAny = false;
    while(i < rowsPx.length){
      const row = rowsPx[i];
      const fits = (row.bottom - pageStart) <= pageCapacityPx;
      if(!fits && usedAny) break;
      pageEnd = Math.min(row.bottom, pageStart + pageCapacityPx);
      usedAny = true; i++;
      if(!fits) break; // bloc plus haut qu'une page : on le tronque, cas limite
    }
    pages.push({ start: pageStart, end: Math.min(pageEnd, canvasHeightPx) });
    pageStart = pageEnd;
  }
  if(pageStart < canvasHeightPx - 1) pages.push({ start: pageStart, end: canvasHeightPx });
  return pages;
}

async function exportPDF(){
  const athlete = state.athletes.find(a=>a.id===activeAthleteId);
  if(!athlete){ showToast("Sélectionnez un athlète avant d'exporter un PDF.", "--serious"); return; }
  const main = document.getElementById("main-panel");
  if(!main) return;

  const btn = document.getElementById("btn-export-pdf");
  const originalLabel = btn.textContent;
  btn.disabled = true; btn.textContent = "Génération…";

  try{
    await ensurePdfLibs();
    const [iconImg, logoImg] = await Promise.all([loadImage(LOGO_ICON_URL), loadImage(LOGO_FULL_URL)]);

    document.documentElement.classList.add("pdf-exporting");
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); // laisse le temps au reflow

    const breakRows = measurePdfBreakUnits(main); // mesuré avant capture, mêmes coordonnées CSS px que le DOM affiché
    const canvas = await window.html2canvas(main, { scale: PDF_CAPTURE_SCALE, backgroundColor: "#ffffff", useCORS: true });
    document.documentElement.classList.remove("pdf-exporting");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4" });

    const contentTop = PDF_HEADER_H + 6;
    const contentBottom = PDF_PAGE_H - PDF_FOOTER_H - 4;
    const contentW = PDF_PAGE_W - PDF_MARGIN_X * 2;
    const contentH = contentBottom - contentTop;
    const pxPerMm = canvas.width / contentW;
    const pageCapacityPx = contentH * pxPerMm;

    const rowsPx = breakRows.map(r => ({ top: r.top * PDF_CAPTURE_SCALE, bottom: r.bottom * PDF_CAPTURE_SCALE }));
    const pages = paginateCanvas(canvas.height, rowsPx, pageCapacityPx);
    const totalPages = pages.length;

    // "→" n'est pas dans l'encodage des polices standard de jsPDF (WinAnsi) —
    // il s'affichait comme un caractère cassé dans le PDF généré.
    const periodLabel = fmtDateFr(chartPeriod.start) + " au " + fmtDateFr(chartPeriod.end);

    pages.forEach((page, i)=>{
      const sliceH = Math.max(1, Math.round(page.end - page.start));
      const slice = document.createElement("canvas");
      slice.width = canvas.width; slice.height = sliceH;
      const sctx = slice.getContext("2d");
      sctx.fillStyle = "#ffffff"; sctx.fillRect(0, 0, slice.width, slice.height);
      sctx.drawImage(canvas, 0, page.start, canvas.width, sliceH, 0, 0, canvas.width, sliceH);

      if(i>0) pdf.addPage();
      drawPdfHeader(pdf, iconImg, athlete.name, periodLabel);
      pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", PDF_MARGIN_X, contentTop, contentW, sliceH / pxPerMm);
      drawPdfFooter(pdf, logoImg, i+1, totalPages);
    });

    pdf.save("DATAS-" + athlete.name.replace(/[^a-z0-9]+/gi,"-") + "-" + fmtDate(new Date()) + ".pdf");
  }catch(err){
    document.documentElement.classList.remove("pdf-exporting");
    console.error("Export PDF échoué", err);
    showToast("Échec de l'export PDF : " + (err.message || "erreur inconnue") + " (vérifiez la connexion internet pour le premier export, les librairies sont chargées depuis un CDN).", "--serious");
  }finally{
    btn.disabled = false; btn.textContent = originalLabel;
  }
}

const CSV_TEMPLATE = "date,type,duration,distance,dPlus,dMinus,z0,z1,z2,z3,z4,rpe\n2026-01-15,Course à pied,55,10.2,120,110,10,30,10,4,1,5\n";

function downloadCsvTemplate(){
  const blob = new Blob([CSV_TEMPLATE], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "loadscope-modele-import.csv";
  a.click();
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const cells = line.split(",");
    const row = {};
    header.forEach((h,i)=> row[h] = cells[i] !== undefined ? cells[i].trim() : "");
    return row;
  });
}

function importCSV(file, athleteId){
  const reader = new FileReader();
  reader.onload = async () => {
    let rows;
    try{ rows = parseCSV(reader.result); }
    catch(e){ alert("Import CSV impossible : vérifiez le format (voir le modèle à télécharger)."); return; }
    const toImport = rows.filter(r=>r.date);
    let count = 0, failed = 0;
    for(const r of toImport){
      const session = {
        athleteId,
        date: r.date, type: r.type || "Autre",
        duration: +r.duration||0, distance: +r.distance||0,
        dPlus: +r.dPlus||0, dMinus: +r.dMinus||0,
        zones: [0,1,2,3,4].map(i=>+r["z"+i]||0),
        rpe: r.rpe? +r.rpe : null, note:""
      };
      try{ await apiSaveSession(session); count++; }
      catch(err){
        failed++;
        if(err.unauthorized){ showKeyGate("Clé d'accès expirée ou invalide, merci de la ressaisir."); return; }
      }
    }
    await refreshData();
    alert(count + " séance(s) importée(s)." + (failed? " " + failed + " échec(s).":""));
  };
  reader.readAsText(file);
}

/* ---------------------------- boot & coach-key gate ---------------------------- */

function renderAll(){ renderAthleteList(); renderMain(); }

async function refreshData(){
  const keepAthlete = activeAthleteId;
  const data = await fetchData();
  state = { athletes: data.athletes.map(athleteFromApi), sessions: data.sessions.map(sessionFromApi),
    athleteTests: (data.athleteTests || []).map(athleteTestFromApi) };
  if(keepAthlete && state.athletes.some(a=>a.id===keepAthlete)) activeAthleteId = keepAthlete;
  else {
    const stored = localStorage.getItem(ACTIVE_ATHLETE_STORAGE);
    activeAthleteId = (stored && state.athletes.some(a=>a.id===stored)) ? stored : (state.athletes.length? state.athletes[0].id : null);
  }
  if(activeAthleteId) localStorage.setItem(ACTIVE_ATHLETE_STORAGE, activeAthleteId);
  renderAll();
}

async function boot(){
  const main = document.getElementById("main-panel");
  main.innerHTML = '<div class="ls-panel"><div class="ls-empty">Chargement des données…</div></div>';
  await refreshData();
}

function showKeyGate(errorText){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="ls-modal-overlay" id="gate-overlay">
    <div class="ls-modal">
      <h3>Clé d'accès coach</h3>
      <div class="ls-modal-sub">DATAS Trail running est relié à votre base de données. Entrez la clé d'accès coach pour continuer.</div>
      <form id="gate-form">
        <div class="ls-field"><label>Clé d'accès</label><input type="password" name="key" required autofocus autocomplete="off"></div>
        ${errorText? `<div class="ls-gate-error">${escapeHtml(errorText)}</div>` : ""}
        <div class="ls-gate-note">La clé n'est stockée que dans ce navigateur (jamais dans le dépôt GitHub). Elle vous a été communiquée séparément.</div>
        <div class="ls-modal-actions">
          <button type="submit" class="ls-btn primary">Continuer</button>
        </div>
      </form>
    </div>
  </div>`;
  document.getElementById("gate-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const key = (fd.get("key")||"").trim();
    if(!key) return;
    localStorage.setItem(COACH_KEY_STORAGE, key);
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = "Vérification…";
    try{
      await boot();
      hideKeyGate();
    }catch(err){
      if(err.unauthorized) showKeyGate("Clé invalide, réessayez.");
      else showKeyGate(err.message || "Erreur de connexion au serveur.");
    }
  });
}

function hideKeyGate(){
  const root = document.getElementById("modal-root");
  if(root.querySelector("#gate-overlay")) root.innerHTML = "";
}

async function ensureCoachKey(){
  const key = localStorage.getItem(COACH_KEY_STORAGE);
  if(key){
    try{ await boot(); return; }
    catch(err){
      if(err.unauthorized){ showKeyGate("Clé invalide, réessayez."); return; }
      // pas d'accès réseau ou erreur serveur : on affiche quand même la porte,
      // avec le message d'erreur, plutôt qu'un écran bloqué sans explication.
      showKeyGate(err.message || "Erreur de connexion au serveur.");
      return;
    }
  }
  showKeyGate();
}

function init(){
  applyTheme(currentThemeMode());

  document.getElementById("btn-theme").addEventListener("click", cycleTheme);
  document.getElementById("btn-add-athlete").addEventListener("click", ()=>openAthleteModal(null));
  document.getElementById("btn-export").addEventListener("click", exportJSON);
  document.getElementById("btn-export-pdf").addEventListener("click", exportPDF);
  document.getElementById("btn-download-template").addEventListener("click", downloadCsvTemplate);

    if(e.target.files[0] && activeAthleteId) importCSV(e.target.files[0], activeAthleteId);

    e.target.value="";
  });

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(currentThemeMode()==="system") renderActiveTabCharts(); });

  handleStravaRedirectParam();
  ensureCoachKey();
}

init();
