// Onglet Nutrition (lecture seule côté coach — seul l'athlète saisit, voir
// client.html) : journal alimentaire jour par jour sur la période choisie,
// avec apports estimés (méthode de l'assiette) comparés à la dépense
// calorique estimée du jour (métabolisme de base × activité + calories de
// séance si entraînement importé). Voir le bloc "Nutrition" plus haut pour
// le détail des formules.
function nutritionMealSummaryLine(entry){
  const structure = NUTRITION_MEAL_STRUCTURE[entry.mealType] || [];
  const parts = [];
  structure.forEach(({role, label, catalog})=>{
    const it = entry.items && entry.items[role];
    if(!it || !it.type) return;
    const list = NUTRITION_ITEMS[catalog] || [];
    const found = list.find(i=>i.value===it.type);
    const itemLabel = found ? found.label : it.type;
    parts.push(`${itemLabel} (${nutritionPortionLabel(it.portion||2).toLowerCase()})`);
  });
  return parts.length ? parts.join(", ") : "—";
}
function renderNutritionTabHtml(athlete, sessions, nutritionEntries){
  const profileComplete = !!(athlete.sex && athlete.activityLevel && athlete.weightKg && athlete.heightCm && athlete.birthDate);
  const period = nutritionPeriod;
  const entriesInPeriod = nutritionEntries.filter(n=> n.date >= period.start && n.date <= period.end);
  const sessionsInPeriod = sessions.filter(s=> s.date >= period.start && s.date <= period.end);

  const dates = Array.from(new Set([...entriesInPeriod.map(n=>n.date), ...sessionsInPeriod.map(s=>s.date)])).sort((a,b)=> a<b?1:-1);

  const dayRows = dates.map(date=>{
    const dayEntries = entriesInPeriod.filter(n=>n.date===date).sort((a,b)=>{
      const order = { petit_dejeuner:0, collation_matin:1, dejeuner:2, collation:3, diner:4 };
      return (order[a.mealType]??9) - (order[b.mealType]??9);
    });
    const daySessions = sessionsInPeriod.filter(s=>s.date===date);
    const apports = dayEntries.reduce((sum,e)=> sum + nutritionEntryKcal(e), 0);
    const dep = profileComplete ? dailyExpenditure(athlete, daySessions) : null;
    const sev = dep ? nutritionBalanceSeverity(apports, dep.total) : { key:"none", label:"—" };
    const mealsLine = dayEntries.map(e=> `<div><strong>${nutritionMealLabel(e.mealType)}</strong> — ${nutritionMealSummaryLine(e)}</div>`).join("");
    return `<tr>
      <td>${fmtDateFr(date)}</td>
      <td style="font-size:11.5px;line-height:1.6;">${mealsLine || "—"}</td>
      <td>${dayEntries.length ? apports + " kcal" : "—"}</td>
      <td>${dep ? dep.total + " kcal" + (dep.sessionsMissingHr ? ` <span class="ls-legend-note" style="display:inline;">(${dep.sessionsMissingHr} séance${dep.sessionsMissingHr>1?"s":""} sans FC ignorée${dep.sessionsMissingHr>1?"s":""})</span>` : "") : "—"}</td>
      <td>${dep && dayEntries.length ? `<span class="ls-status-pill" style="background:var(${statusVar(sev.key)});color:${statusInk(sev.key)}">${sev.label}</span>` : "—"}</td>
    </tr>`;
  }).join("");

  const daysWithBoth = dates.filter(date=>{
    const hasEntry = entriesInPeriod.some(n=>n.date===date);
    return hasEntry && profileComplete;
  });
  const avgApports = daysWithBoth.length ? Math.round(daysWithBoth.reduce((sum,date)=> sum + entriesInPeriod.filter(n=>n.date===date).reduce((s,e)=>s+nutritionEntryKcal(e),0), 0) / daysWithBoth.length) : null;
  const avgDepense = daysWithBoth.length ? Math.round(daysWithBoth.reduce((sum,date)=>{
    const dep = dailyExpenditure(athlete, sessionsInPeriod.filter(s=>s.date===date));
    return sum + (dep ? dep.total : 0);
  }, 0) / daysWithBoth.length) : null;

  const profileWarning = !profileComplete ? `
    <div class="ls-panel" style="margin-bottom:16px;">
      <div class="ls-empty">Profil incomplet pour estimer la dépense calorique : renseigne sexe, niveau d'activité, taille, poids et date de naissance dans la fiche de l'athlète (bouton "Modifier" en haut de page). Le journal alimentaire reste visible ci-dessous.</div>
    </div>` : "";

  // Métabolisme de base (BMR) : propriété du profil de l'athlète, pas de la
  // période affichée — moyenne des 3 formules (voir bmrAverage), sans le
  // facteur d'activité quotidienne (PAL) ni les calories de séance, qui
  // s'ajoutent ensuite dans dailyExpenditure pour obtenir la dépense totale.
  const bmrAge = profileComplete ? ageFromBirthDate(athlete.birthDate) : null;
  const bmr = profileComplete ? bmrAverage(athlete.sex, athlete.weightKg, athlete.heightCm, bmrAge) : null;

  return `
    <div class="ls-chart-sub" style="margin-bottom:14px;">Journal alimentaire simplifié saisi par l'athlète depuis son espace (méthode de l'assiette : entrée/plat/dessert pour déjeuner et dîner, structure allégée pour petit-déjeuner et collations), comparé à une estimation indicative de la dépense calorique du jour (métabolisme de base moyenné sur 3 formules + activité quotidienne + calories de séance par FC les jours d'entraînement importé). Comparaison indicative, pas un comptage calorique précis. Calories par aliment basées sur la table CIQUAL (Anses), pour des portions standards.</div>
    ${profileWarning}
    <div class="ls-stat-grid" style="margin-bottom:18px;">
      <div class="ls-stat"><div class="ls-stat-label">Métabolisme de base</div><div class="ls-stat-value">${bmr!=null? bmr : "—"}${bmr!=null?"<small>kcal/j</small>":""}</div></div>
      <div class="ls-stat"><div class="ls-stat-label">Jours avec repas (période)</div><div class="ls-stat-value">${new Set(entriesInPeriod.map(n=>n.date)).size}</div></div>
      <div class="ls-stat"><div class="ls-stat-label">Apports moyens / jour</div><div class="ls-stat-value">${avgApports!=null? avgApports : "—"}${avgApports!=null?"<small>kcal</small>":""}</div></div>
      <div class="ls-stat"><div class="ls-stat-label">Dépense moyenne / jour</div><div class="ls-stat-value">${avgDepense!=null? avgDepense : "—"}${avgDepense!=null?"<small>kcal</small>":""}</div></div>
      <div class="ls-stat"><div class="ls-stat-label">Écart moyen</div><div class="ls-stat-value">${avgApports!=null && avgDepense!=null ? (avgApports-avgDepense>0?"+":"")+(avgApports-avgDepense) : "—"}${avgApports!=null && avgDepense!=null?"<small>kcal</small>":""}</div></div>
    </div>
    ${profileComplete ? `
    <div class="ls-chart-card" style="margin-bottom:18px;">
      <h3>Apports vs dépense — jour par jour</h3>
      <div class="ls-chart-sub">Comparaison quotidienne sur la période sélectionnée ci-dessous. Une journée sans repas saisi n'affiche pas de barre "Apports" (pas de donnée saisie, pas un 0 kcal).</div>
      <div class="ls-chart-wrap tall"><canvas id="chart-nutrition-compare"></canvas></div>
      <div class="ls-sante-legend-row">
        <div class="ls-sante-legend-item"><span class="ls-sante-legend-swatch" style="background:var(--cat-2);height:9px;border-radius:2px;"></span>Apports</div>
        <div class="ls-sante-legend-item"><span class="ls-sante-legend-swatch" style="background:var(--cat-1);height:9px;border-radius:2px;"></span>Dépense</div>
      </div>
    </div>` : ""}
    <div class="ls-period-bar">
      <div class="ls-field">
        <label>Période — début</label>
        <input type="date" id="nutrition-period-start" value="${period.start}" max="${period.end}">
      </div>
      <div class="ls-period-arrow">→</div>
      <div class="ls-field">
        <label>Période — fin</label>
        <input type="date" id="nutrition-period-end" value="${period.end}" min="${period.start}">
      </div>
      <button class="ls-btn small ghost" type="button" id="btn-nutrition-period-reset">Réinitialiser (2 semaines)</button>
      <div class="ls-period-note">Par défaut les 2 dernières semaines (repas quotidiens, contrairement aux séances) — élargissez pour voir plus loin dans l'historique.</div>
    </div>
    ${dates.length === 0
      ? '<div class="ls-panel"><div class="ls-empty">Aucun repas saisi sur cette période.</div></div>'
      : `<div class="ls-table-card">
      <div class="ls-table-head"><h3>Journal (${dates.length} jour${dates.length>1?"s":""})</h3></div>
      <div class="ls-table-scroll">
        <table class="ls-log">
          <thead><tr><th>Date</th><th>Repas</th><th>Apports</th><th>Dépense</th><th>Écart</th></tr></thead>
          <tbody>${dayRows}</tbody>
        </table>
      </div>
    </div>`}
  `;
}

// Graphique "Apports vs dépense — jour par jour" de l'onglet Nutrition (vue
// coach) : une barre par jour sur toute la période choisie dans le sélecteur
// juste en dessous (voir renderNutritionTabHtml). Ne s'affiche que si le
// canvas existe (profil complet — sinon le bandeau d'avertissement remplace
// la carte, voir profileWarning) et si Chart.js est chargé.
function renderNutritionChart(athlete, sessions, nutritionEntries){
  if(typeof Chart === "undefined") return;
  const canvas = document.getElementById("chart-nutrition-compare");
  if(!canvas) return;
  const period = ensureNutritionPeriod();
  const dates = dateRangeDays(period.start, period.end);
  const labels = dates.map(fmtDayMonth);
  // null (pas 0) un jour sans repas saisi, pour ne pas afficher une barre
  // "Apports" à zéro qui laisserait croire à un jeûne plutôt qu'à une absence
  // de saisie — Chart.js n'affiche simplement pas de barre sur un null.
  const apportsVals = dates.map(date=>{
    const dayEntries = nutritionEntries.filter(n=>n.date===date);
    return dayEntries.length ? dayEntries.reduce((sum,e)=> sum + nutritionEntryKcal(e), 0) : null;
  });
  const depenseVals = dates.map(date=>{
    const dep = dailyExpenditure(athlete, sessions.filter(s=>s.date===date));
    return dep ? dep.total : null;
  });
  charts.nutritionCompare = new Chart(canvas, {
    type: "bar",
    data: { labels, datasets: [
      { label:"Apports", data: apportsVals, backgroundColor: cssVar("--cat-2"), borderRadius:3, maxBarThickness:22 },
      { label:"Dépense", data: depenseVals, backgroundColor: cssVar("--cat-1"), borderRadius:3, maxBarThickness:22 }
    ]},
    options: baseChartOptions({
      plugins:{ legend:{ display:false } },
      scales:{ y:{ title:{display:true, text:"kcal / jour", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } }
    })
  });
}

// Sous-onglet "Vue athlète" (prise en main) : reproduit l'écran que voit
// l'athlète depuis son espace personnel (voir client.html, structure et
// classes CSS identiques — cartes repas avec icônes de portion), mais sur
// les VRAIES données de l'athlète actuellement sélectionné dans la barre
// latérale, avec écriture réelle (ajout/modification/suppression) via
// apiSaveNutritionEntry / apiDeleteNutritionEntry (voir endpoint
// nutrition-entries de app-api, qui écrit avec le rôle de service — hors
// RLS, comme le reste des écritures coach). Permet au coach de tester le
// journal ou de saisir un repas à la place de l'athlète ; les entrées
// enregistrées ici sont indiscernables de celles saisies par l'athlète
// lui-même depuis client.html (même table, pas de champ "saisi par").
function renderNutritionAthleteLiveHtml(athlete, sessions, nutritionEntries){
  if(!nutritionLiveDate) nutritionLiveDate = fmtDate(new Date());
  const date = nutritionLiveDate;
  const dayEntries = nutritionEntries.filter(n=>n.date===date).sort((a,b)=>{
    const order = { petit_dejeuner:0, collation_matin:1, dejeuner:2, collation:3, diner:4 };
    return (order[a.mealType]??9) - (order[b.mealType]??9);
  });
  const daySessions = sessions.filter(s=>s.date===date);
  const apports = dayEntries.reduce((sum,e)=> sum + nutritionEntryKcal(e), 0);
  const profileComplete = !!(athlete.sex && athlete.activityLevel && athlete.weightKg && athlete.heightCm && athlete.birthDate);
  const dep = profileComplete ? dailyExpenditure(athlete, daySessions) : null;
  const sev = dep ? nutritionBalanceSeverity(apports, dep.total) : { key:"none", label:"—" };

  const mealCards = dayEntries.map(e=>`
    <div class="ls-nutrition-card">
      <div class="ls-nutrition-card-head">
        <strong>${nutritionMealLabel(e.mealType)}</strong>
        <div>
          <button type="button" class="ls-btn small ghost" data-edit-nutrition="${e.id}">Modifier</button>
          <button type="button" class="ls-btn small ghost" data-del-nutrition="${e.id}">Supprimer</button>
        </div>
      </div>
      <div class="ls-nutrition-card-items">
        ${(NUTRITION_MEAL_STRUCTURE[e.mealType]||[]).map(({role,label,catalog})=>{
          const it = e.items && e.items[role];
          if(!it || !it.type) return "";
          const found = (NUTRITION_ITEMS[catalog]||[]).find(i=>i.value===it.type);
          return `<div class="ls-nutrition-item-row">${nutritionPlateIconSvg(it.portion||2,24)}<span>${escapeHtml(label)} — ${escapeHtml(found?found.label:it.type)} (${nutritionPortionLabel(it.portion||2).toLowerCase()})</span></div>`;
        }).join("")}
      </div>
    </div>`).join("");

  return `
    <div class="ls-chart-sub" style="margin-bottom:14px;">Prise en main : ajoute, modifie ou supprime les repas de ${escapeHtml(athlete.name)} directement depuis le dashboard, exactement comme depuis son espace personnel — les entrées enregistrées ici sont ses vraies données (mêmes que dans la "Vue coach").</div>
    ${!profileComplete ? `<div class="ls-panel" style="margin-bottom:16px;"><div class="ls-empty">Profil incomplet pour estimer la dépense calorique (sexe, niveau d'activité, taille, poids, date de naissance requis). Le journal reste utilisable en attendant.</div></div>` : ""}
    <div class="ls-field" style="max-width:220px;margin-bottom:16px;">
      <label>Date</label>
      <input type="date" id="nutrition-live-date-picker" value="${date}" max="${fmtDate(new Date())}">
    </div>
    <div class="ls-stat-grid" style="margin-bottom:18px;">
      <div class="ls-stat"><div class="ls-stat-label">Apports du jour</div><div class="ls-stat-value">${dayEntries.length? apports : "—"}${dayEntries.length?"<small>kcal</small>":""}</div></div>
      <div class="ls-stat"><div class="ls-stat-label">Dépense estimée</div><div class="ls-stat-value">${dep? dep.total : "—"}${dep?"<small>kcal</small>":""}</div></div>
      <div class="ls-stat"><div class="ls-stat-label">Écart</div><div class="ls-stat-value">${dep && dayEntries.length ? `<span class="ls-status-pill" style="background:var(${statusVar(sev.key)});color:${statusInk(sev.key)}">${sev.label}</span>` : "—"}</div></div>
    </div>
    <div class="ls-table-head" style="margin-bottom:10px;">
      <h3>Repas du ${fmtDateFr(date)}</h3>
      <button type="button" class="ls-btn small primary" id="btn-add-nutrition-live">+ Ajouter un repas</button>
    </div>
    ${dayEntries.length? mealCards : '<div class="ls-panel"><div class="ls-empty">Aucun repas enregistré pour cette date.</div></div>'}
  `;
}

// ---- Modal d'ajout/modification de repas (sous-onglet "Vue athlète",
// prise en main) — même principe que le modal équivalent côté client.html
// (nutritionDraft, structure par rôle selon NUTRITION_MEAL_STRUCTURE), mais
// enregistre via apiSaveNutritionEntry (clé coach) plutôt qu'en écriture
// directe Supabase (RLS athlète). ----
function nutritionDefaultItems(mealType){
  const structure = NUTRITION_MEAL_STRUCTURE[mealType] || [];
  const items = {};
  structure.forEach(({role})=>{ items[role] = { type:"", portion:2 }; });
  return items;
}

function nutritionModalFieldsHtml(){
  const structure = NUTRITION_MEAL_STRUCTURE[nutritionDraft.mealType] || [];
  return structure.map(({role, label, catalog})=>{
    const current = nutritionDraft.items[role] || { type:"", portion:2 };
    const options = (NUTRITION_ITEMS[catalog]||[]).map(i=>`<option value="${i.value}" ${current.type===i.value?"selected":""}>${escapeHtml(i.label)}</option>`).join("");
    const portionBtns = NUTRITION_PORTIONS.map(p=>`
      <button type="button" class="ls-portion-btn ${current.portion===p.value?"active":""}" data-nutrition-role="${role}" data-portion-value="${p.value}" title="${p.label}">
        ${nutritionPlateIconSvg(p.value, 28)}
        <span>${p.label}</span>
      </button>`).join("");
    return `
      <div class="ls-field">
        <label>${escapeHtml(label)}</label>
        <select data-nutrition-role="${role}" class="nutrition-item-select">
          <option value="">— non consommé —</option>
          ${options}
        </select>
        <div class="ls-portion-row">${portionBtns}</div>
      </div>`;
  }).join("");
}

function wireNutritionFieldListeners(){
  document.querySelectorAll(".nutrition-item-select").forEach(sel=>{
    sel.addEventListener("change", e=>{
      const role = e.target.getAttribute("data-nutrition-role");
      if(!nutritionDraft.items[role]) nutritionDraft.items[role] = { type:"", portion:2 };
      nutritionDraft.items[role].type = e.target.value;
    });
  });
  document.querySelectorAll(".ls-portion-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const role = btn.getAttribute("data-nutrition-role");
      const val = +btn.getAttribute("data-portion-value");
      if(!nutritionDraft.items[role]) nutritionDraft.items[role] = { type:"", portion:2 };
      nutritionDraft.items[role].portion = val;
      const fields = document.getElementById("nutrition-modal-fields");
      if(fields){ fields.innerHTML = nutritionModalFieldsHtml(); wireNutritionFieldListeners(); }
    });
  });
}

function renderNutritionEntryModal(){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="ls-modal-overlay" id="modal-overlay">
    <div class="ls-modal wide">
      <h3>${nutritionDraft.id? "Modifier le repas":"Ajouter un repas"}</h3>
      <div class="ls-modal-sub">Choisis ce que l'athlète a mangé pour chaque élément, et la taille de la portion (petite / moyenne / grande). Laisse un élément sur "non consommé" s'il ne l'a pas pris.</div>
      <div class="ls-field-row">
        <div class="ls-field"><label>Date</label><input type="date" id="nutrition-draft-date" value="${nutritionDraft.date}" max="${fmtDate(new Date())}"></div>
        <div class="ls-field">
          <label>Repas</label>
          <select id="nutrition-draft-mealtype">
            ${NUTRITION_MEAL_TYPES.map(m=>`<option value="${m.value}" ${nutritionDraft.mealType===m.value?"selected":""}>${m.label}</option>`).join("")}
          </select>
        </div>
      </div>
      <div id="nutrition-modal-fields">${nutritionModalFieldsHtml()}</div>
      <div class="ls-modal-actions">
        <button type="button" class="ls-btn ghost" id="modal-cancel">Annuler</button>
        <button type="button" class="ls-btn primary" id="btn-nutrition-save">${nutritionDraft.id? "Enregistrer":"Ajouter"}</button>
      </div>
    </div>
  </div>`;
  document.getElementById("modal-cancel").addEventListener("click", ()=>{ nutritionDraft=null; closeModal(); });
  document.getElementById("modal-overlay").addEventListener("click", e=>{ if(e.target.id==="modal-overlay"){ nutritionDraft=null; closeModal(); } });
  document.getElementById("nutrition-draft-date").addEventListener("change", e=>{ nutritionDraft.date = e.target.value; });
  document.getElementById("nutrition-draft-mealtype").addEventListener("change", e=>{
    nutritionDraft.mealType = e.target.value;
    nutritionDraft.items = nutritionDefaultItems(e.target.value);
    document.getElementById("nutrition-modal-fields").innerHTML = nutritionModalFieldsHtml();
    wireNutritionFieldListeners();
  });
  wireNutritionFieldListeners();
  document.getElementById("btn-nutrition-save").addEventListener("click", saveNutritionDraft);
}

function openNutritionEntryModal(athleteId, existing, defaultDate){
  nutritionDraft = existing
    ? { id: existing.id, athleteId, date: existing.date, mealType: existing.mealType, items: JSON.parse(JSON.stringify(existing.items||{})) }
    : { id: null, athleteId, date: defaultDate || fmtDate(new Date()), mealType: "dejeuner", items: nutritionDefaultItems("dejeuner") };
  renderNutritionEntryModal();
}

async function saveNutritionDraft(){
  // Ne garde que les éléments réellement renseignés (type non vide).
  const items = {};
  Object.entries(nutritionDraft.items).forEach(([role, it])=>{ if(it && it.type) items[role] = { type: it.type, portion: it.portion||2 }; });

function buildInsight(sessions, lastACWR, cls){
  if(sessions.length < 5) return "Historique encore limité : ajoutez des séances pour obtenir une lecture fiable de la charge (l'ACWR se stabilise après environ 4 semaines de données).";
  if(cls.key === "none" || lastACWR == null) return "Pas encore assez d'historique pour calculer un ACWR fiable.";
  const { acute } = acwrSeries(sessions);
  const trend = acute.length >= 8 ? acute[acute.length-1] - acute[acute.length-8] : 0;
  const trendPct = acute[acute.length-8] > 0 ? (trend/acute[acute.length-8]*100) : 0;
  const trendTxt = trendPct > 15 ? `en hausse de ${trendPct.toFixed(0)}% sur 7 jours` : trendPct < -15 ? `en baisse de ${Math.abs(trendPct).toFixed(0)}% sur 7 jours` : "stable sur 7 jours";
  const msgs = {
    critical: `ACWR à ${lastACWR.toFixed(2)}, risque élevé. Charge ${trendTxt} — une hausse aussi rapide est associée à un risque accru de blessure. Envisager une semaine de décharge.`,
    serious: `ACWR à ${lastACWR.toFixed(2)}, zone de prudence. Charge ${trendTxt}. Surveiller la récupération avant d'augmenter encore le volume.`,
    good: `ACWR à ${lastACWR.toFixed(2)}, zone optimale. Charge ${trendTxt} — la progression actuelle est cohérente.`,
    warning: `ACWR à ${lastACWR.toFixed(2)}, sous la zone optimale. Charge ${trendTxt} — une reprise progressive limitera le risque lors du retour à un volume plus élevé.`,
    none: "Pas encore assez d'historique pour calculer un ACWR fiable."
  };
  return msgs[cls.key] || msgs.none;
}

// Plugins du donut "zones de FC — historique complet" : le temps total au
// centre, et une étiquette par zone avec sa ligne de rappel à l'extérieur —
// Chart.js ne fournit ni l'un ni l'autre nativement pour un doughnut.
// Bandes de fond colorées derrière la courbe TSB (voir classifyTSB) --
// reproduit le principe du graphique "Forme" de Suunto : la zone de lecture
// (perdre la forme/récupérer, équilibre, productif, trop intense) apparaît
// en fond plutôt qu'en légende seule. beforeDatasetsDraw : après le calcul
// des échelles/axes, avant le tracé de la courbe elle-même (donc en fond).
const tsbZoneBandsPlugin = {
  id: "tsbZoneBands",
  beforeDatasetsDraw(chart){
    if(chart.config.type !== "line" || chart.canvas.id !== "chart-tsb") return;
    const { ctx, chartArea, scales } = chart;
    const y = scales.y;
    if(!chartArea || !y) return;
    const bands = [
      { from: 15, to: y.max, key: "warning" },
      { from: -10, to: 15, key: "good" },
      { from: -30, to: -10, key: "serious" },
      { from: y.min, to: -30, key: "critical" },
    ];
    ctx.save();
    bands.forEach(b=>{
      const top = y.getPixelForValue(Math.min(b.to, y.max));
      const bottom = y.getPixelForValue(Math.max(b.from, y.min));
      if(bottom <= top) return;
      ctx.fillStyle = cssVar(statusVar(b.key)) + "1f";
      ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
    });
    ctx.restore();
  }
};
const zoneDonutCenterTextPlugin = {
  id: "zoneDonutCenterText",
  afterDraw(chart){
    const text = chart.options.plugins?.centerText?.text;
    if(!text || chart.config.type !== "doughnut") return;
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.font = "700 19px Manrope, sans-serif";
    ctx.fillStyle = cssVar("--text-primary");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, (chartArea.left+chartArea.right)/2, (chartArea.top+chartArea.bottom)/2);
    ctx.restore();
  }
};
const zoneDonutLegendGapPlugin = {
  id: "zoneDonutLegendGap",
  // afterFit(legend) n'existe pas comme hook de plugin global dans Chart.js v4
  // (les hooks de plugin reçoivent (chart, args, options), jamais l'objet
  // legend directement) — donc ce hook n'était jamais appelé, d'où l'absence
  // totale d'effet. La technique fiable : surcharger legend.fit() elle-même,
  // depuis afterInit (chart.legend est déjà créé à ce stade).
  afterInit(chart){
    if(chart.config.type !== "doughnut") return;
    const legend = chart.legend;
    if(!legend || legend.__zoneDonutGapPatched) return;
    legend.__zoneDonutGapPatched = true;
    const originalFit = legend.fit;
    legend.fit = function(){
      originalFit.call(this);
      this.height += 26;
    };
  }
};
const zoneDonutLeaderLabelsPlugin = {
  id: "zoneDonutLeaderLabels",
  afterDraw(chart){
    if(chart.config.type !== "doughnut") return;
    const meta = chart.getDatasetMeta(0);
    if(!meta || !meta.data.length) return;
    const values = chart.data.datasets[0].data;
    const total = values.reduce((a,b)=>a+(b||0),0);
    if(total <= 0) return;
    const { ctx } = chart;

    // Position "idéale" de chaque étiquette (avant anti-chevauchement),
    // regroupée par côté gauche/droite du donut -- deux petites tranches
    // voisines (ex : Zone 4 et Zone 5 toutes deux faibles) donnent sinon des
    // étiquettes quasiment à la même hauteur, qui se superposent. Voir
    // resolveOverlaps ci-dessous.
    const LABEL_MIN_GAP = 18; // écart vertical minimal entre deux étiquettes empilées
    const leftLabels = [], rightLabels = [];
    meta.data.forEach((arc, i)=>{
      const value = values[i];
      if(!value) return;
      const pct = value/total*100;
      const angle = (arc.startAngle + arc.endAngle)/2;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const cx = arc.x, cy = arc.y, rOuter = arc.outerRadius;
      const x1 = cx + cos*rOuter, y1 = cy + sin*rOuter;
      const x2 = cx + cos*(rOuter+18), y2 = cy + sin*(rOuter+18);
      const side = cos >= -0.001 ? 1 : -1;
      (side>0 ? rightLabels : leftLabels).push({ i, pct, x1, y1, x2, y: y2, side });
    });

    // Écarte les étiquettes qui se chevaucheraient verticalement, côté par
    // côté : une passe du haut vers le bas (repousse chaque étiquette sous
    // la précédente), puis du bas vers le haut (rattrape le cas où la
    // première passe a fait déborder la dernière étiquette) -- technique
    // standard pour les libellés externes de donut/camembert.
    function resolveOverlaps(labels){
      labels.sort((a,b)=>a.y-b.y);
      for(let k=1;k<labels.length;k++){
        if(labels[k].y < labels[k-1].y + LABEL_MIN_GAP) labels[k].y = labels[k-1].y + LABEL_MIN_GAP;
      }
      for(let k=labels.length-2;k>=0;k--){
        if(labels[k].y > labels[k+1].y - LABEL_MIN_GAP) labels[k].y = labels[k+1].y - LABEL_MIN_GAP;
      }
    }
    resolveOverlaps(leftLabels);
    resolveOverlaps(rightLabels);

    ctx.save();
    ctx.font = "600 11.5px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.strokeStyle = cssVar("--axis");
    ctx.fillStyle = cssVar("--text-secondary");
    ctx.lineWidth = 1;
    leftLabels.concat(rightLabels).forEach(({ i, pct, x1, y1, x2, y, side })=>{
      const x3 = x2 + side*12, y3 = y;
      ctx.beginPath();
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y); ctx.lineTo(x3,y3);
      ctx.stroke();
      ctx.textAlign = side>0 ? "left" : "right";
      ctx.textBaseline = "middle";
      const pctTxt = pct.toFixed(2).replace(".",",");
      ctx.fillText(`Zone ${i+1} (${pctTxt} %)`, x3 + side*4, y3);
    });
    ctx.restore();
  }
};

// Contexte commun aux graphiques "temporels" partagés entre les onglets
// Athlète (Efficacité physiologique), Volume & Charge (Charge d'entraînement,
// Volume, Dénivelé, Zones de FC, Zones d'allure) et État de forme (Forme /
// Fatigue, ACWR) : charge quotidienne, séries ACWR/CTL/ATL, période
// sélectionnée (chartPeriod, partagée entre les trois onglets) et agrégats
// hebdomadaires. Calculé une fois par onglet actif pour éviter de dupliquer
// cette logique dans les trois fonctions de rendu de graphiques ci-dessous
// (anciennement une seule fonction renderChartsInner, avant la scission de
// l'onglet Entraînement en trois onglets).
function trainingChartContext(athlete){
  const sessions = state.sessions.filter(s=>s.athleteId===athlete.id);
  const { dates, acute, chronic, acwr, ctl, atl, tsb } = acwrSeries(sessions);
  const daily = dailySeries(sessions);
  const dailyVals = dates.map(d=>daily[d]||0);
  const color = athleteColor(athlete);

  ensureChartPeriod();
  const periodStartStr = chartPeriod.start, periodEndStr = chartPeriod.end;
  const periodStart = new Date(periodStartStr+"T00:00:00");
  const periodEnd = new Date(periodEndStr+"T00:00:00");

  // Slice les séries journalières (Charge / ACWR / CTL / ATL) sur la période
  // choisie plutôt que sur une fenêtre glissante fixe.
  let si = dates.findIndex(d=> d >= periodStartStr);
  if(si === -1) si = dates.length;
  let ei = dates.length - 1;
  while(ei >= 0 && dates[ei] > periodEndStr) ei--;
  const sl = arr => (si <= ei) ? arr.slice(si, ei+1) : [];
  const labels = sl(dates).map(d=> fmtDayMonth(d));

  const weeks = weeklyAggregates(sessions, periodStartStr, periodEndStr);
  const wkLabels = weeks.map(w=> fmtDayMonth(w.week));

  return { sessions, dates, acute, chronic, acwr, ctl, atl, tsb, daily, dailyVals, color,
    periodStartStr, periodEndStr, periodStart, periodEnd, sl, labels, weeks, wkLabels };
}

  const dated = stravaSessions.filter(s=>!isNaN(new Date(s.date+"T00:00:00")));
  if(dated.length === 0){
    wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune séance Strava pour le moment.</div>';
    return;
  }
  const allDates = dated.map(s=>new Date(s.date+"T00:00:00"));
  const months = monthsBetween(new Date(Math.min.apply(null, allDates)), new Date(Math.max.apply(null, allDates)));
  const climb = vamMonthlyAverage(stravaSessions, months, "vamClimbProfile", 15);
  const descent = vamMonthlyAverage(stravaSessions, months, "vamDescentProfile", 10);
  if(!climb.some(v=>v!=null) && !descent.some(v=>v!=null)){
    wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Pas encore assez de séances Strava avec profil VAM pour ce graphique.</div>';
    return;
  }
  // Réinsère un <canvas> propre : un rendu précédent (aucune donnée, ou lib
  // absente) peut avoir remplacé ce wrap par un message texte.
  wrap.innerHTML = '<canvas id="chart-twin-vam"></canvas>';
  const ctx = document.getElementById("chart-twin-vam").getContext("2d");
  // Dégradé vertical sous chaque courbe (aspect plus moderne que le simple
  // trait) — createLinearGradient a besoin de la hauteur réelle du canvas,
  // recalculée à chaque (re)rendu du graphique.
  const chartFill = (colorVar, topAlpha) => {
    const g = ctx.createLinearGradient(0, 0, 0, ctx.canvas.clientHeight || 220);
    g.addColorStop(0, hexToRgba(cssVar(colorVar), topAlpha));
    g.addColorStop(1, hexToRgba(cssVar(colorVar), 0));
    return g;
  };
  charts.twinVam = new Chart(ctx, {
    type:"line",
    data:{ labels: months.map(m=>monthLabelFr(m.year, m.month)), datasets:[
      { label:"Montée", data: climb.map(v=>v!=null?Math.round(v):null), borderColor: cssVar("--cat-2"), backgroundColor: chartFill("--cat-2", .28),
        borderWidth:3, pointRadius:3, pointBackgroundColor: cssVar("--surface"), pointBorderColor: cssVar("--cat-2"), pointBorderWidth:2,
        pointHoverRadius:6, fill:true, tension:.3, spanGaps:true },
      { label:"Descente", data: descent.map(v=>v!=null?Math.round(v):null), borderColor: cssVar("--cat-1"), backgroundColor: chartFill("--cat-1", .22),
        borderWidth:3, pointRadius:3, pointBackgroundColor: cssVar("--surface"), pointBorderColor: cssVar("--cat-1"), pointBorderWidth:2,
        pointHoverRadius:6, fill:true, tension:.3, spanGaps:true }
    ]},
    options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"VAM (m/h)", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
  });
}

// Point d'entrée unique pour (re)construire les graphiques de l'onglet actif
// (athlète, volume & charge, état de forme, rapport environnemental, jumeau
// numérique ou nutrition) — utilisé au premier rendu, lors d'un changement de
// thème et lors du basculement d'onglet, pour éviter de dupliquer cette
// logique de dispatch à plusieurs endroits.
function renderActiveTabCharts(){
  if(!state) return;
  const athlete = state.athletes.find(a=>a.id===activeAthleteId);
  if(!athlete){ destroyCharts(); return; }
  if(activeTab === "athlete"){
    renderAthleteCharts(athlete);
  } else if(activeTab === "volume-charge"){
    renderVolumeChargeCharts(athlete);
  } else if(activeTab === "etat-forme"){
    // Deux groupes de graphiques indépendants dans cet onglet fusionné :
    // ACWR/Forme-Fatigue (ex-onglet Entraînement) et Hooper/corrélation
    // (ex-onglet Santé) — renderEtatFormeTrainingCharts fait déjà son propre
    // destroyCharts() avant de construire les deux siens, donc
    // renderSanteCharts (qui n'en fait pas) peut s'ajouter juste après sans
    // effacer ce qui vient d'être construit.
    renderEtatFormeTrainingCharts(athlete);
    const athleteSessions = state.sessions.filter(s=>s.athleteId===athlete.id);
    renderSanteCharts(athlete, athleteSessions);
  } else if(activeTab === "env"){
    destroyCharts();
    const envSessions = state.sessions.filter(s=>s.athleteId===athlete.id && s.source==="strava");
    renderEnvChart(athlete, envSessions);
  } else if(activeTab === "twin"){
    destroyCharts();
    const stravaSessions = state.sessions.filter(s=>s.athleteId===athlete.id && s.source==="strava");
    renderTwinVamChart(stravaSessions);
  } else if(activeTab === "nutrition"){
    destroyCharts();
    if(nutritionView === "coach"){
      const athleteSessions = state.sessions.filter(s=>s.athleteId===athlete.id);
      const athleteNutritionEntries = (state.nutritionEntries||[]).filter(n=>n.athleteId===athlete.id);
      renderNutritionChart(athlete, athleteSessions, athleteNutritionEntries);
    }
  } else {
    destroyCharts();
  }
}

function renderAthleteChartsInner(athlete){
  const common = trainingChartContext(athlete);
  const { sessions, color, periodStart, periodEnd, periodStartStr, periodEndStr } = common;

  const twinRadarWrap = document.getElementById("twin-radar-chart-wrap");
  const twinRadarNote = document.getElementById("twin-radar-note");
  const athleteTestsForRadar = (state.athleteTests||[]).filter(t=>t.athleteId===athlete.id);
  const twinRadarSeries = SIM_PARAMS.map(p=> simParamSeries(sessions, athleteTestsForRadar, p.key));
  const twinRadarCurrent = twinRadarSeries.map(s=> s.length ? s[s.length-1].value : null);
  const twinRadarScores = twinRadarSeries.map((s,i)=> twinRadarScoreFromSeries(s, twinRadarCurrent[i]));
  const hasAnyTwinScore = twinRadarScores.some(v=>v!=null);
  if(hasAnyTwinScore && twinRadarWrap){
    const missing = SIM_PARAMS.filter((p,i)=>twinRadarScores[i]==null).map(p=>p.label);
    twinRadarNote.textContent = missing.length
      ? `Historique encore insuffisant pour : ${missing.join(", ")} — ces axes s'affichent à 0 en attendant plus de données.`
      : "";
    charts.twinRadar = new Chart(document.getElementById("chart-twin-radar"), {
      type:"radar",
      data:{ labels: SIM_PARAMS.map(p=>p.label), datasets:[
        { label:"Actuel", data: twinRadarScores.map(v=>v??0), borderColor: color, backgroundColor: color+"33", borderWidth:2, pointRadius:3, pointBackgroundColor: color }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false },
          tooltip:{ backgroundColor: cssVar("--surface"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-secondary"),
            borderColor: cssVar("--border"), borderWidth:1, padding:10,
            callbacks:{ label: ctx => ` ${simFormatValue(SIM_PARAMS[ctx.dataIndex].key, twinRadarCurrent[ctx.dataIndex])} · ${twinRadarScores[ctx.dataIndex]??0}/10` } } },
        scales:{ r:{ min:0, max:10, ticks:{ display:false, stepSize:2 }, grid:{ color: cssVar("--grid") }, angleLines:{ color: cssVar("--grid") },
          pointLabels:{ color: cssVar("--text-secondary"), font:{family:"Manrope", size:11.5, weight:600} } } }
      }
    });
  } else if(twinRadarWrap){
    twinRadarWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment — nécessite au moins deux tests de terrain ou séances Strava par paramètre pour calculer un score.</div>';
    if(twinRadarNote) twinRadarNote.textContent = "";
  }

  const physioWrap = document.getElementById("physio-chart-wrap");
  // Une courbe par mois calendaire de la période choisie (plutôt qu'un simple
  // avant/après) : dégradé du plus ancien (terne) au plus récent (couleur
  // pleine de l'athlète), pour voir la progression aérobie se dessiner sur
  // toute la période plutôt qu'entre deux clichés.
  const physioMonths = monthsBetween(periodStart, periodEnd);
  const physioMonthData = physioMonths.map(m=>{
    const monthSessions = sessions.filter(s=>{
      if(s.date < periodStartStr || s.date > periodEndStr) return false;
      const d = new Date(s.date+"T00:00:00");
      return d.getFullYear() === m.year && d.getMonth() === m.month;
    });
    return { label: monthLabelFr(m.year, m.month), gapZ: gapZoneAverageOf(monthSessions) };
  }).filter(m => m.gapZ.some(v=>v!=null));
  const hasGapData = physioMonthData.length > 0;
  if(hasGapData && physioWrap){
    const mutedColor = cssVar("--text-muted");
    const n = physioMonthData.length;
    charts.physio = new Chart(document.getElementById("chart-physio"), {
      type:"line",
      data:{ labels: ZONE_LABELS, datasets: physioMonthData.map((m,i)=>{
        const t = n>1 ? i/(n-1) : 1;
        const lineColor = mixHexColors(mutedColor, color, t);
        return {
          label: m.label, data: m.gapZ, borderColor: lineColor, backgroundColor: lineColor,
          borderWidth: n>1 ? 1.5+1.5*t : 2, tension: 0.3, spanGaps: true,
          pointRadius: 3, pointHoverRadius: 5, fill: false
        };
      })},
      options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"km/h équivalent plat", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
    });
  } else if(physioWrap){
    physioWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment — nécessite des séances importées depuis Strava avec un historique de fréquence cardiaque.</div>';
  }

  const terrainWrap = document.getElementById("terrain-chart-wrap");
  // Périodes de comparaison choisies librement par le coach (voir les deux
  // sélecteurs de dates ajoutés sur cette carte), plutôt que dérivées
  // automatiquement de la période affichée plus haut.
  const terrainAStartDate = new Date(terrainCompareA.start+"T00:00:00");
  const terrainAEndDate = new Date(terrainCompareA.end+"T23:59:59");
  const terrainBStartDate = new Date(terrainCompareB.start+"T00:00:00");
  const terrainBEndDate = new Date(terrainCompareB.end+"T23:59:59");
  const gradePast = gapGradeAverageInRange(sessions, terrainAStartDate, terrainAEndDate);
  const gradeNow = gapGradeAverageInRange(sessions, terrainBStartDate, terrainBEndDate);
  const terrainLabelA = "Référence (" + fmtDateFr(terrainCompareA.start) + "–" + fmtDateFr(terrainCompareA.end) + ")";
  const terrainLabelB = "Récente (" + fmtDateFr(terrainCompareB.start) + "–" + fmtDateFr(terrainCompareB.end) + ")";
  const hasGradeData = gradeNow.some(v=>v!=null) || gradePast.some(v=>v!=null);
  if(hasGradeData && terrainWrap){
    charts.terrain = new Chart(document.getElementById("chart-terrain"), {
      type:"bar",
      data:{ labels: GRADE_BUCKET_LABELS, datasets:[
        { label: terrainLabelA, data: gradePast, backgroundColor: cssVar("--text-muted")+"66", borderRadius:4, maxBarThickness:36 },
        { label: terrainLabelB, data: gradeNow, backgroundColor: color, borderRadius:4, maxBarThickness:36 }
      ]},
      options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"km/h équivalent plat", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} },
        x:{ ticks:{ color:cssVar("--text-muted"), font:{size:10.5} } } } })
    });
  } else if(terrainWrap){
    terrainWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment sur ces deux périodes — nécessite des séances importées depuis Strava.</div>';
  }
}

function renderVolumeChargeChartsInner(athlete){
  const common = trainingChartContext(athlete);
  const { sessions, dailyVals, acute, chronic, color, labels, sl, periodStartStr, periodEndStr, periodStart, periodEnd, weeks, wkLabels } = common;

  charts.load = new Chart(document.getElementById("chart-load"), {
    type:"bar",
    data:{ labels, datasets:[
      { type:"bar", label:"Charge quotidienne", data: sl(dailyVals), backgroundColor: color+"55", borderRadius:3, order:3 },
      { type:"line", label:"Aiguë (7j)", data: sl(acute), borderColor: cssVar("--serious"), backgroundColor:"transparent", tension:.3, pointRadius:0, borderWidth:2, order:1 },
      { type:"line", label:"Chronique (28j)", data: sl(chronic), borderColor: cssVar("--text-primary"), backgroundColor:"transparent", tension:.3, pointRadius:0, borderWidth:2, borderDash:[4,3], order:2 }
    ]},
    options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"u.a. / jour", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
  });

  // Volume et Dénivelé passent en agrégation mensuelle plutôt
  // qu'hebdomadaire (demande du coach du 2026-09-23) — une barre par mois
  // calendaire touché par la période, la première et la dernière pouvant
  // être partielles si la période ne commence/finit pas en début/fin de
  // mois (voir l'encadré "Période exacte" affiché sur le graphique dans ce
  // cas, calculé dans renderMain).
  const months = monthsBetween(periodStart, periodEnd);
  const moLabels = months.map(m => monthLabelFrShort(m.year, m.month));

  // Kilométrage mensuel empilé par type d'activité — une barre par mois,
  // un segment de couleur par catégorie ; la légende (cliquable) permet de
  // masquer une catégorie, et le survol détaille chaque segment.
  const volByMonth = monthlyKmByCategory(sessions, periodStartStr, periodEndStr);
  charts.volume = new Chart(document.getElementById("chart-volume"), {
    type:"bar",
    data:{ labels: moLabels, datasets: VOLUME_CATEGORIES.map(c=>({
      label: c.label,
      data: months.map(m=> +((volByMonth[m.year+"-"+m.month]?.[c.key]||0).toFixed(1))),
      backgroundColor: cssVar(c.colorVar), stack:"vol", borderRadius:2, maxBarThickness:26
    }))},
    options: baseChartOptions({ scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
  });

  // Le dénivelé n'a de sens que pour la course à pied et le vélo — musculation,
  // ski et le reste sont écartés du graphique (demande du coach). D+ et D-
  // fusionnés dans un seul graphique (au lieu de deux côte à côte) pour
  // épurer la page : D+ au-dessus de l'axe, D- en dessous (valeurs
  // négatives), même teinte de catégorie pour les deux, D- en version
  // atténuée puisque la position par rapport à l'axe suffit à les distinguer.
  const ELEVATION_CATEGORIES = VOLUME_CATEGORIES.filter(c => c.key==="course" || c.key==="velo");
  const elevByMonth = monthlyElevationByCategory(sessions, periodStartStr, periodEndStr);
  const elevDatasets = ELEVATION_CATEGORIES.flatMap(c => ([
    { label:`${c.label} (D+)`, data: months.map(m => Math.round(elevByMonth[m.year+"-"+m.month]?.[c.key]?.dPlus || 0)), backgroundColor: cssVar(c.colorVar), stack:"elev", borderRadius:2, maxBarThickness:26 },
    { label:`${c.label} (D-)`, data: months.map(m => -Math.round(elevByMonth[m.year+"-"+m.month]?.[c.key]?.dMinus || 0)), backgroundColor: cssVar(c.colorVar)+"66", stack:"elev", borderRadius:2, maxBarThickness:26 }
  ]));
  charts.elevation = new Chart(document.getElementById("chart-elevation"), {
    type:"bar",
    data:{ labels: moLabels, datasets: elevDatasets },
    options: baseChartOptions({
      plugins:{ legend:{ labels:{ color: cssVar("--text-muted"), font:{family:"Manrope", size:11}, boxWidth:10, boxHeight:10, usePointStyle:true } },
        tooltip:{ backgroundColor: cssVar("--surface"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-secondary"),
          borderColor: cssVar("--border"), borderWidth:1, padding:10, titleFont:{family:"Manrope", weight:700}, bodyFont:{family:"IBM Plex Mono"},
          callbacks:{ label: ctx => ` ${ctx.dataset.label} : ${Math.abs(ctx.parsed.y)} m` } } },
      scales:{ x:{ stacked:true, grid:{display:false} },
        y:{ stacked:true, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted"), callback:v=>Math.abs(v)}, title:{display:true, text:"D+ (m) / D- (m)", color:cssVar("--text-muted"), font:{size:10}} } }
    })
  });

  const zoneColors = [cssVar("--z1"),cssVar("--z2"),cssVar("--z3"),cssVar("--z4"),cssVar("--z5")];
  charts.zones = new Chart(document.getElementById("chart-zones"), {
    type:"bar",
    data:{ labels: wkLabels, datasets: ZONE_LABELS.map((lab,i)=>({
      label: lab, data: weeks.map(w=>w.zones[i]), backgroundColor: zoneColors[i], stack:"z", borderRadius:2, maxBarThickness:28
    }))},
    options: baseChartOptions({ scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
  });

  // Donut "zones de FC — historique complet" : indépendant de la période
  // choisie plus haut, filtrable par activité (sélecteur dans renderMain).
  const zonesTotalWrap = document.getElementById("zones-total-chart-wrap");
  // Le sélecteur d'activité rappelle renderVolumeChargeCharts() seul (sans
  // renderMain()), donc si le tour précédent avait remplacé ce wrap par le
  // message "aucune donnée", il faut réinsérer le <canvas> avant de
  // retenter — sinon document.getElementById("chart-zones-total") renverrait
  // null.
  if(zonesTotalWrap){
    zonesTotalWrap.innerHTML = '<canvas id="chart-zones-total"></canvas>';
    const zonesTotalSessions = zonesTotalActivityFilter === "all" ? sessions : sessions.filter(s=>s.type===zonesTotalActivityFilter);
    const zonesTotalMinutes = [0,0,0,0,0];
    zonesTotalSessions.forEach(s=> s.zones.forEach((m,i)=> zonesTotalMinutes[i]+=(m||0)));
    const zonesTotalSum = zonesTotalMinutes.reduce((a,b)=>a+b,0);
    if(zonesTotalSum > 0){
      charts.zonesTotal = new Chart(document.getElementById("chart-zones-total"), {
        type:"doughnut",
        data:{ labels: ZONE_LABELS, datasets:[{ data: zonesTotalMinutes, backgroundColor: zoneColors, borderColor: cssVar("--surface"), borderWidth:2 }] },
        options:{
          responsive:true, maintainAspectRatio:false, cutout:"62%",
          layout:{ padding:{ top:18, bottom:34, left:100, right:100 } },
          plugins:{
            legend:{ position:"top", labels:{ color: cssVar("--text-muted"), font:{family:"Manrope", size:11}, boxWidth:10, boxHeight:10, usePointStyle:true } },
            tooltip:{ backgroundColor: cssVar("--surface"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-secondary"),
              borderColor: cssVar("--border"), borderWidth:1, padding:10,
              callbacks:{ label: ctx => ` ${fmtHoursMinutes(ctx.parsed)} (${(ctx.parsed/zonesTotalSum*100).toFixed(2).replace(".",",")} %)` } },
            centerText:{ text: fmtHoursMinutes(zonesTotalSum) }
          }
        },
        plugins:[zoneDonutCenterTextPlugin, zoneDonutLeaderLabelsPlugin, zoneDonutLegendGapPlugin]
      });
    } else {
      zonesTotalWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune séance avec zones de FC renseignées pour cette activité.</div>';
    }
  }

  // Zones d'allure = contrainte liée à la vitesse de course. Les bornes (km/h)
  // sont calibrées pour la course à pied : un vélo ou une autre activité plus
  // rapide y atterrirait artificiellement dans les zones hautes (anaérobie)
  // sans que l'effort réel le justifie. On ne garde donc que Course à pied et
  // Trail, en réutilisant les mêmes semaines que les autres graphiques
  // (weeklyAggregates sur le sous-ensemble filtré, réaligné sur `weeks` pour
  // que les semaines sans course à pied affichent bien une barre à 0 plutôt
  // que d'être absentes ou décalées).
  const paceSessions = sessions.filter(s => s.type === "Course à pied" || s.type === "Trail");
  const paceWeeksRaw = weeklyAggregates(paceSessions, periodStartStr, periodEndStr);
  const paceByWeek = {};
  paceWeeksRaw.forEach(w => { paceByWeek[w.week] = w; });
  const hasPaceData = weeks.some(w => paceByWeek[w.week]?.hasPaceData);
  const paceWrap = document.getElementById("pace-chart-wrap");
  if(hasPaceData && paceWrap){
    const paceColors = PACE_ZONE_VARS.map(v=>cssVar(v));
    charts.pace = new Chart(document.getElementById("chart-pace-zones"), {
      type:"bar",
      data:{ labels: wkLabels, datasets: [0,1,2,3,4,5,6].map(i=>({
        label: paceZoneLabel(athlete, i), data: weeks.map(w=>paceByWeek[w.week]?.paceZones[i] || 0), backgroundColor: paceColors[i], stack:"p", borderRadius:2, maxBarThickness:28
      }))},
      options: baseChartOptions({ scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
    });
  } else if(paceWrap){
    paceWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment — nécessite des séances importées depuis Strava et une table d\'intensité complète (bouton « Table d\'intensité » ci-dessus).</div>';
  }
}

function openSessionModal(athleteId, sessionId){
  const existing = sessionId ? state.sessions.find(s=>s.id===sessionId) : null;
  const root = document.getElementById("modal-root");

// Génère un PDF "DATAS" du tableau de bord affiché : capture le contenu
// (#main-panel, sans les contrôles interactifs) en image via html2canvas,
// la découpe en pages A4, et dessine en vrai texte vectoriel (jsPDF, donc
// net à l'impression) un en-tête (logo + titre + athlète/période) et un
// bas de page signature (grand logo + coordonnées + numéro de page) sur
// chaque page — comme le bandeau de signature du cabinet.

const COACH_SIGNATURE = {
  name: "Maxime Chelda",
  role: "Préparateur physique",
  phone: "06 32 19 57 79",
  email: "maxime@ruthene-coachin.fr"
};
// Logo complet (bandeau signature, en bas de page — grand format) et
// pictogramme seul (en-tête — petit format, plus lisible en compact).
const LOGO_FULL_URL = "logo-ruthene-coachin.png";
const LOGO_ICON_URL = "logo-ruthene-icon.png";
const PDF_TITLE = "DATAS — Bilan d'entraînement";

let _pdfLibsPromise = null;
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error("Échec de chargement : " + src));
    document.head.appendChild(s);
  });
}
function ensurePdfLibs(){
  if(_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = (async ()=>{
    if(!window.html2canvas) await loadScript("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");
    if(!window.jspdf) await loadScript("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
  })();
  return _pdfLibsPromise;
}
function loadImage(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error("Logo introuvable : " + url));
    img.src = url;
  });
}

const PDF_PAGE_W = 210, PDF_PAGE_H = 297, PDF_MARGIN_X = 15, PDF_HEADER_H = 26, PDF_FOOTER_H = 32;
const PDF_CAPTURE_SCALE = 2; // doit rester cohérent avec le `scale` passé à html2canvas

function drawPdfHeader(pdf, iconImg, athleteName, periodLabel){
  const logoH = 15, logoW = logoH * (iconImg.width / iconImg.height);
  pdf.addImage(iconImg, "PNG", PDF_MARGIN_X, 6, logoW, logoH);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(14); pdf.setTextColor(25, 25, 35);
  pdf.text(PDF_TITLE, PDF_PAGE_W - PDF_MARGIN_X, 13, { align: "right" });
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(10); pdf.setTextColor(115, 115, 125);
  pdf.text(athleteName + " — " + periodLabel, PDF_PAGE_W - PDF_MARGIN_X, 19, { align: "right" });
  pdf.setDrawColor(222, 222, 228); pdf.setLineWidth(0.3);
  pdf.line(PDF_MARGIN_X, PDF_HEADER_H, PDF_PAGE_W - PDF_MARGIN_X, PDF_HEADER_H);
}

function drawPdfFooter(pdf, logoImg, pageNum, totalPages){
  const footTop = PDF_PAGE_H - PDF_FOOTER_H;
  pdf.setDrawColor(222, 222, 228); pdf.setLineWidth(0.3);
  pdf.line(PDF_MARGIN_X, footTop, PDF_PAGE_W - PDF_MARGIN_X, footTop);

  const logoW = 46, logoH = logoW * (logoImg.height / logoImg.width);
  const logoY = footTop + (PDF_FOOTER_H - logoH) / 2;
  pdf.addImage(logoImg, "PNG", PDF_MARGIN_X, logoY, logoW, logoH);

  const dividerX = PDF_MARGIN_X + logoW + 8;
  pdf.setDrawColor(215, 215, 220);
  pdf.line(dividerX, footTop + 6, dividerX, PDF_PAGE_H - 8);

  const textX = dividerX + 8;
  let ty = footTop + 11;
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(11); pdf.setTextColor(25, 25, 35);
  pdf.text(COACH_SIGNATURE.name, textX, ty); ty += 5;
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9.5); pdf.setTextColor(115, 115, 125);
  pdf.text(COACH_SIGNATURE.role, textX, ty); ty += 6;
  pdf.setFontSize(9.5); pdf.setTextColor(90, 90, 100);
  pdf.text(COACH_SIGNATURE.phone, textX, ty); ty += 5;
  pdf.text(COACH_SIGNATURE.email, textX, ty);

  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(150, 150, 158);
  pdf.text(pageNum + " / " + totalPages, PDF_PAGE_W - PDF_MARGIN_X, PDF_PAGE_H - 8, { align: "right" });
}

// Mesure, dans le DOM en cours (donc APRES le masquage .pdf-exporting), les
// blocs "insécables" du tableau de bord : chaque enfant direct de #main-panel
// (en-tête athlète, stats, insight...) et, séparément, chaque carte de
// #main-panel .ls-charts — pour ne jamais couper une carte au milieu lors
// de la pagination. Les blocs qui se chevauchent verticalement (deux cartes
// côte à côte sur la même ligne de la grille) sont fusionnés en un seul
// groupe, puisqu'on ne peut de toute façon pas les séparer dans une image
// déjà aplatie par html2canvas.
function measurePdfBreakUnits(main){
  const mainTop = main.getBoundingClientRect().top;
  const units = [];
  const pushIfVisible = (el)=>{
    if(!el || el.offsetParent === null) return; // display:none (masqué par .pdf-exporting, ou onglet inactif)
    const r = el.getBoundingClientRect();
    if(r.height <= 0) return;
    units.push({ top: r.top - mainTop, bottom: r.bottom - mainTop });
  };
  // Descend transparemment dans le panneau de l'onglet actif (.ls-tab-panel) —
  // seul l'onglet visible contribue des blocs ; l'onglet masqué est ignoré
  // entièrement (offsetParent null). Préserve le découpage fin par carte
  // existant à l'intérieur de .ls-charts.
  const walk = (children)=>{
    Array.from(children).forEach(child=>{
      if(child.classList && child.classList.contains("ls-charts")){
        Array.from(child.children).forEach(pushIfVisible);
      } else if(child.classList && child.classList.contains("ls-tab-panel")){
        if(child.offsetParent === null) return;
        walk(child.children);
      } else {
        pushIfVisible(child);
      }
    });
  };
  walk(main.children);
  units.sort((a,b)=> a.top - b.top);
  const rows = [];
  units.forEach(u=>{
    const last = rows[rows.length - 1];
    if(last && u.top < last.bottom - 0.5) last.bottom = Math.max(last.bottom, u.bottom);
    else rows.push({ top: u.top, bottom: u.bottom });
  });
  return rows;
}

// Découpe la hauteur totale du canvas en pages, en ne coupant jamais à
// l'intérieur d'un des blocs mesurés par measurePdfBreakUnits (sauf, en
// tout dernier recours, un bloc à lui seul plus haut qu'une page entière).
function paginateCanvas(canvasHeightPx, rowsPx, pageCapacityPx){
  const pages = [];
  let pageStart = 0, i = 0;
  while(i < rowsPx.length){
    let pageEnd = pageStart, usedAny = false;
    while(i < rowsPx.length){
      const row = rowsPx[i];
      const fits = (row.bottom - pageStart) <= pageCapacityPx;
      if(!fits && usedAny) break;
      pageEnd = Math.min(row.bottom, pageStart + pageCapacityPx);
      usedAny = true; i++;
      if(!fits) break; // bloc plus haut qu'une page : on le tronque, cas limite
    }
    pages.push({ start: pageStart, end: Math.min(pageEnd, canvasHeightPx) });
    pageStart = pageEnd;
  }
  if(pageStart < canvasHeightPx - 1) pages.push({ start: pageStart, end: canvasHeightPx });
  return pages;
}

async function exportPDF(){
  if(activeView === "leads"){ showToast("L'export PDF n'est pas disponible sur la vue « Demandes de rapport ».", "--serious"); return; }
  const athlete = state.athletes.find(a=>a.id===activeAthleteId);
  if(!athlete){ showToast("Sélectionnez un athlète avant d'exporter un PDF.", "--serious"); return; }
  const main = document.getElementById("main-panel");
  if(!main) return;

  const btn = document.getElementById("btn-export-pdf");
  const originalLabel = btn.textContent;
  btn.disabled = true; btn.textContent = "Génération…";

  try{
    await ensurePdfLibs();
    const [iconImg, logoImg] = await Promise.all([loadImage(LOGO_ICON_URL), loadImage(LOGO_FULL_URL)]);

    document.documentElement.classList.add("pdf-exporting");
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); // laisse le temps au reflow

    const breakRows = measurePdfBreakUnits(main); // mesuré avant capture, mêmes coordonnées CSS px que le DOM affiché
    const canvas = await window.html2canvas(main, { scale: PDF_CAPTURE_SCALE, backgroundColor: "#ffffff", useCORS: true });
    document.documentElement.classList.remove("pdf-exporting");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4" });

    const contentTop = PDF_HEADER_H + 6;
    const contentBottom = PDF_PAGE_H - PDF_FOOTER_H - 4;
    const contentW = PDF_PAGE_W - PDF_MARGIN_X * 2;
    const contentH = contentBottom - contentTop;
    const pxPerMm = canvas.width / contentW;
    const pageCapacityPx = contentH * pxPerMm;

    const rowsPx = breakRows.map(r => ({ top: r.top * PDF_CAPTURE_SCALE, bottom: r.bottom * PDF_CAPTURE_SCALE }));
    const pages = paginateCanvas(canvas.height, rowsPx, pageCapacityPx);
    const totalPages = pages.length;

    // "→" n'est pas dans l'encodage des polices standard de jsPDF (WinAnsi) —
    // il s'affichait comme un caractère cassé dans le PDF généré.
    const periodLabel = fmtDateFr(chartPeriod.start) + " au " + fmtDateFr(chartPeriod.end);

    pages.forEach((page, i)=>{
      const sliceH = Math.max(1, Math.round(page.end - page.start));
      const slice = document.createElement("canvas");
      slice.width = canvas.width; slice.height = sliceH;
      const sctx = slice.getContext("2d");
      sctx.fillStyle = "#ffffff"; sctx.fillRect(0, 0, slice.width, slice.height);
      sctx.drawImage(canvas, 0, page.start, canvas.width, sliceH, 0, 0, canvas.width, sliceH);

      if(i>0) pdf.addPage();
      drawPdfHeader(pdf, iconImg, athlete.name, periodLabel);
      pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", PDF_MARGIN_X, contentTop, contentW, sliceH / pxPerMm);
      drawPdfFooter(pdf, logoImg, i+1, totalPages);
    });

    pdf.save("DATAS-" + athlete.name.replace(/[^a-z0-9]+/gi,"-") + "-" + fmtDate(new Date()) + ".pdf");
  }catch(err){
    document.documentElement.classList.remove("pdf-exporting");
    console.error("Export PDF échoué", err);
    showToast("Échec de l'export PDF : " + (err.message || "erreur inconnue") + " (vérifiez la connexion internet pour le premier export, les librairies sont chargées depuis un CDN).", "--serious");
  }finally{
    btn.disabled = false; btn.textContent = originalLabel;
  }
}

const CSV_TEMPLATE = "date,type,duration,distance,dPlus,dMinus,z0,z1,z2,z3,z4,rpe\n2026-01-15,Course à pied,55,10.2,120,110,10,30,10,4,1,5\n";

function downloadCsvTemplate(){
  const blob = new Blob([CSV_TEMPLATE], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "loadscope-modele-import.csv";
  a.click();
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const cells = line.split(",");
    const row = {};
    header.forEach((h,i)=> row[h] = cells[i] !== undefined ? cells[i].trim() : "");
    return row;
  });
}

function importCSV(file, athleteId){
  const reader = new FileReader();
  reader.onload = async () => {
    let rows;
    try{ rows = parseCSV(reader.result); }
    catch(e){ alert("Import CSV impossible : vérifiez le format (voir le modèle à télécharger)."); return; }
    const toImport = rows.filter(r=>r.date);
    let count = 0, failed = 0;
    for(const r of toImport){
      const session = {
        athleteId,
        date: r.date, type: r.type || "Autre",
        duration: +r.duration||0, distance: +r.distance||0,
        dPlus: +r.dPlus||0, dMinus: +r.dMinus||0,
        zones: [0,1,2,3,4].map(i=>+r["z"+i]||0),
        rpe: r.rpe? +r.rpe : null, note:""
      };
      try{ await apiSaveSession(session); count++; }
      catch(err){
        failed++;
        if(err.unauthorized){ showKeyGate("Clé d'accès expirée ou invalide, merci de la ressaisir."); return; }
      }
    }
    await refreshData();
    alert(count + " séance(s) importée(s)." + (failed? " " + failed + " échec(s).":""));
  };
  reader.readAsText(file);
}

/* ---------------------------- boot & coach-key gate ---------------------------- */

function renderAll(){ renderAthleteList(); renderMain(); }

async function refreshData(){
  const keepAthlete = activeAthleteId;
  const data = await fetchData();
  state = { athletes: data.athletes.map(athleteFromApi), sessions: data.sessions.map(sessionFromApi),
    athleteTests: (data.athleteTests || []).map(athleteTestFromApi),
    reportLeads: (data.reportLeads || []).map(reportLeadFromApi),
    hooperResponses: (data.hooperResponses || []).map(hooperResponseFromApi),
    injuryReports: (data.injuryReports || []).map(injuryReportFromApi),
    nutritionEntries: (data.nutritionEntries || []).map(nutritionEntryFromApi) };
  if(keepAthlete && state.athletes.some(a=>a.id===keepAthlete)) activeAthleteId = keepAthlete;
  else {
    const stored = localStorage.getItem(ACTIVE_ATHLETE_STORAGE);
    activeAthleteId = (stored && state.athletes.some(a=>a.id===stored)) ? stored : (state.athletes.length? state.athletes[0].id : null);
  }
  if(activeAthleteId) localStorage.setItem(ACTIVE_ATHLETE_STORAGE, activeAthleteId);
  renderAll();
}

async function boot(){
  const main = document.getElementById("main-panel");
  main.innerHTML = '<div class="ls-panel"><div class="ls-empty">Chargement des données…</div></div>';
  await refreshData();
}

function showKeyGate(errorText){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="ls-modal-overlay" id="gate-overlay">
    <div class="ls-modal">
      <h3>Clé d'accès coach</h3>
      <div class="ls-modal-sub">DATAS Trail running est relié à votre base de données. Entrez la clé d'accès coach pour continuer.</div>
      <form id="gate-form">
        <div class="ls-field"><label>Clé d'accès</label><input type="password" name="key" required autofocus autocomplete="off"></div>
        ${errorText? `<div class="ls-gate-error">${escapeHtml(errorText)}</div>` : ""}
        <div class="ls-gate-note">La clé n'est stockée que dans ce navigateur (jamais dans le dépôt GitHub). Elle vous a été communiquée séparément.</div>
        <div class="ls-modal-actions">
          <button type="submit" class="ls-btn primary">Continuer</button>
        </div>
      </form>
    </div>
  </div>`;
  document.getElementById("gate-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const key = (fd.get("key")||"").trim();
    if(!key) return;
    localStorage.setItem(COACH_KEY_STORAGE, key);
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = "Vérification…";
    try{
      await boot();
      hideKeyGate();
    }catch(err){
      if(err.unauthorized) showKeyGate("Clé invalide, réessayez.");
      else showKeyGate(err.message || "Erreur de connexion au serveur.");
    }
  });
}

function hideKeyGate(){
  const root = document.getElementById("modal-root");
  if(root.querySelector("#gate-overlay")) root.innerHTML = "";
}

async function ensureCoachKey(){
  const key = localStorage.getItem(COACH_KEY_STORAGE);
  if(key){
    try{ await boot(); return; }
    catch(err){
      if(err.unauthorized){ showKeyGate("Clé invalide, réessayez."); return; }
      // pas d'accès réseau ou erreur serveur : on affiche quand même la porte,
      // avec le message d'erreur, plutôt qu'un écran bloqué sans explication.
      showKeyGate(err.message || "Erreur de connexion au serveur.");
      return;
    }
  }
  showKeyGate();
}

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(currentThemeMode()==="system") renderActiveTabCharts(); });

  handleStravaRedirectParam();
  ensureCoachKey();
}

init();
