<title>DATAS Trail running</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --accent-ink:#ffffff;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-ink:#ffffff; --warning-ink:#2b1c00; --serious-ink:#341000; --critical-ink:#ffffff;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
    --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
    --z1:#5598e7; --z2:#1baf7a; --z3:#eda100; --z4:#eb6834; --z5:#d03b3b; --z6:#4a3aa7; --z7:#e87ba4;
    --font-ui:'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
      --accent:#3987e5;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
      --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
      --z6:#9085e9; --z7:#d55181;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --accent:#3987e5;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
    --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
    --z6:#9085e9; --z7:#d55181;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);}
  .ls-app{max-width:1320px;margin:0 auto;padding:20px 24px 64px;}

  /* ---------- header ---------- */
  .ls-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 4px 20px;flex-wrap:wrap;}
  .ls-brand{display:flex;align-items:baseline;gap:10px;}
  .ls-brand h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0;}
  .ls-brand span{color:var(--text-muted);font-size:13px;}
  .ls-header-actions{display:flex;align-items:center;gap:8px;}
  .ls-btn{font-family:var(--font-ui);font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-primary);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .ls-btn:hover{background:var(--surface-2);}
  .ls-btn.primary{background:var(--accent);color:#fff;border-color:transparent;}
  .ls-btn.primary:hover{filter:brightness(1.08);}
  .ls-btn.ghost{background:transparent;}
  .ls-btn.small{padding:5px 10px;font-size:12px;}
  .ls-tabbar{display:flex;gap:18px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .ls-tab-btn{font-family:var(--font-ui);font-size:13px;font-weight:700;background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 2px;color:var(--text-muted);cursor:pointer;}
  .ls-tab-btn:hover{color:var(--text-primary);}
  .ls-tab-btn.active{color:var(--text-primary);border-bottom-color:var(--accent);}
  input[type=file].ls-hidden{display:none;}

  /* ---------- layout ---------- */
  .ls-layout{display:grid;grid-template-columns:272px 1fr;gap:20px;align-items:start;}
  @media (max-width: 880px){ .ls-layout{grid-template-columns:1fr;} }

  /* ---------- sidebar ---------- */
  .ls-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .ls-panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 10px;font-weight:700;}
  .ls-athlete-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .ls-athlete-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;cursor:pointer;text-align:left;width:100%;font-family:var(--font-ui);}
  .ls-athlete-card:hover{background:var(--surface-2);}
  .ls-athlete-card.active{background:var(--surface-2);border-color:var(--border);}
  .ls-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .ls-athlete-meta{flex:1;min-width:0;}
  .ls-athlete-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ls-athlete-sub{font-size:11.5px;color:var(--text-muted);}
  .ls-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;font-family:var(--font-mono);flex:none;}
  .ls-side-divider{height:1px;background:var(--border);margin:14px 0;}
  .ls-side-actions{display:flex;flex-direction:column;gap:6px;}

  /* ---------- main ---------- */
  .ls-empty{padding:60px 20px;text-align:center;color:var(--text-muted);}
  .ls-athlete-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .ls-athlete-title{display:flex;align-items:center;gap:12px;}
  .ls-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:16px;flex:none;}
  .ls-athlete-title h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.01em;}
  .ls-athlete-title .ls-athlete-sub{font-size:12.5px;margin-top:2px;}
  .ls-title-actions{display:flex;gap:6px;}

  .ls-stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width: 1100px){ .ls-stat-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width: 620px){ .ls-stat-grid{grid-template-columns:repeat(2,1fr);} }
  .ls-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .ls-stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px;}
  .ls-stat-value{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
  .ls-stat-value small{font-family:var(--font-ui);font-size:11px;color:var(--text-muted);font-weight:600;margin-left:2px;}
  .ls-status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;font-family:var(--font-mono);}

  .ls-insight{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-bottom:18px;
    border-left:4px solid var(--accent);background:var(--surface);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
  .ls-insight b{font-weight:700;}
  .ls-insight p{margin:0;font-size:13px;line-height:1.5;color:var(--text-secondary);}

  .ls-period-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;border-radius:12px;padding:12px 14px;margin-bottom:18px;
    background:var(--surface);border:1px solid var(--border);}
  .ls-period-bar .ls-field{margin:0;width:150px;}
  .ls-period-bar .ls-field label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em;}
  .ls-period-bar .ls-period-arrow{color:var(--text-muted);font-size:14px;padding-bottom:9px;}
  .ls-period-note{flex:1 1 240px;font-size:11.5px;color:var(--text-muted);line-height:1.5;padding-bottom:2px;}

  .ls-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media (max-width: 980px){ .ls-charts{grid-template-columns:1fr;} }
  .ls-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 8px;}
  .ls-chart-card.full{grid-column:1 / -1;}
  .ls-chart-card h3{font-size:13px;font-weight:700;margin:0 0 2px;}
  .ls-chart-card .ls-chart-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
  .ls-chart-wrap{position:relative;height:220px;}
  .ls-chart-wrap.tall{height:260px;}
  .ls-chart-wrap.radar{height:340px;max-width:440px;margin:0 auto;}
  .ls-chart-wrap.donut{height:400px;max-width:760px;margin:0 auto;}
  .ls-subchart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width: 760px){ .ls-subchart-grid{grid-template-columns:1fr;} }
  .ls-subchart-label{font-size:11.5px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
  .ls-matrix-note{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;text-align:center;}

  .ls-table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .ls-table-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .ls-table-head h3{font-size:13px;font-weight:700;margin:0;}
  .ls-table-scroll{overflow-x:auto;max-height:360px;overflow-y:auto;border-radius:10px;}
  table.ls-log{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
  table.ls-log th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--grid);font-weight:700;}
  table.ls-log td{padding:8px 10px;border-bottom:1px solid var(--grid);color:var(--text-secondary);white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.ls-log td.ls-num{font-family:var(--font-mono);}
  table.ls-log tr:last-child td{border-bottom:none;}
  .ls-row-actions{display:flex;gap:4px;}
  .ls-icon-btn{border:none;background:transparent;color:var(--text-muted);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:12px;}
  .ls-icon-btn:hover{background:var(--surface-2);color:var(--text-primary);}
  .ls-legend-note{font-size:11px;color:var(--text-muted);margin-top:8px;}

  /* ---------- modal ---------- */
  .ls-modal-overlay{position:fixed;inset:0;background:rgba(11,11,11,0.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .ls-modal{background:var(--surface);border-radius:16px;border:1px solid var(--border);max-width:520px;width:100%;
    max-height:88vh;overflow-y:auto;padding:22px;}
  .ls-modal h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .ls-modal .ls-modal-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
  .ls-field{margin-bottom:12px;}
  .ls-field label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:5px;}
  .ls-field input, .ls-field select{width:100%;font-family:var(--font-ui);font-size:13.5px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--border);background:var(--bg);color:var(--text-primary);}
  .ls-field input:focus, .ls-field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .ls-field input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:none;background:none;height:auto;margin:6px 0 2px;}
  .ls-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ls-field-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .ls-field-row5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .ls-zone-check{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono);}
  .ls-zone-check.warn{color:var(--serious);}
  .ls-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .ls-footer{margin-top:28px;text-align:center;font-size:11.5px;color:var(--text-muted);}
  .ls-footer a{color:var(--text-secondary);}
  [hidden]{display:none!important;}

  /* ---------- export PDF ---------- */
  /* Pendant la capture html2canvas, on masque les contrôles interactifs du
     tableau de bord (boutons d'action, barre de période, sélecteur de filtre)
     : ces éléments n'ont pas leur place dans un rapport figé, et la période
     est de toute façon réaffichée en texte dans l'en-tête du PDF. */
  .pdf-exporting .ls-title-actions,
  .pdf-exporting .ls-period-bar,
  .pdf-exporting .pdf-hide{ display:none!important; }
  .ls-btn[disabled]{opacity:.6;cursor:default;pointer-events:none;}

  /* ---------- toast / banner ---------- */
  .ls-toast{display:flex;align-items:flex-start;gap:10px;border-radius:12px;padding:11px 14px;margin-bottom:16px;
    border:1px solid var(--border);background:var(--surface);border-left:4px solid var(--accent);font-size:13px;color:var(--text-secondary);}
  .ls-toast button{margin-left:auto;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:13px;padding:0 2px;flex:none;}

  /* ---------- strava ---------- */
  .ls-btn.strava{background:#fc4c02;color:#fff;border-color:transparent;}
  .ls-btn.strava:hover{filter:brightness(1.06);}
  .ls-strava-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;
    background:var(--good);color:var(--good-ink);font-family:var(--font-mono);}
  .ls-source-tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;font-family:var(--font-mono);}
  .ls-source-tag.manual{background:var(--surface-2);color:var(--text-muted);}
  .ls-source-tag.strava{background:#fc4c0222;color:#fc4c02;}

  /* ---------- key gate ---------- */
  .ls-gate-note{font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.5;}
  .ls-gate-error{font-size:12px;color:var(--critical);margin-top:8px;}

  /* ---------- intensity table ---------- */
  .ls-modal.wide{max-width:920px;}
  table.ls-intensity{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  table.ls-intensity col.ls-intensity-col-name{width:34%;}
  table.ls-intensity th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
    padding:6px 8px;font-weight:700;}
  table.ls-intensity td{padding:4px 6px;}
  table.ls-intensity tr.ls-intensity-row td{padding-top:6px;padding-bottom:6px;}
  table.ls-intensity .ls-intensity-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;flex:none;}
  table.ls-intensity .ls-intensity-name{display:flex;align-items:center;}
  table.ls-intensity input{width:100%;font-family:var(--font-mono);font-size:12.5px;padding:6px 7px;border-radius:7px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-primary);box-sizing:border-box;}
  table.ls-intensity input[type=text]{font-family:var(--font-ui);font-size:12px;min-width:0;}
  table.ls-intensity input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .ls-intensity-note{font-size:11.5px;color:var(--text-muted);margin-top:10px;line-height:1.5;}
  @media (max-width:640px){
    .ls-modal.wide{max-width:96vw;}
    table.ls-intensity{table-layout:auto;}
    .ls-modal .ls-modal-body-scroll{overflow-x:auto;}
  }
</style>

<div class="ls-app">
  <header class="ls-header">
    <div class="ls-brand">
      <h1>DATAS Trail running</h1>
      <span>Charge d'entraînement, lisible.</span>
    </div>
    <div class="ls-header-actions">
      <button class="ls-btn ghost small" id="btn-theme" type="button">Thème : Automatique</button>
      <button class="ls-btn" id="btn-export" type="button">Exporter (JSON)</button>
      <button class="ls-btn" id="btn-export-pdf" type="button">Exporter en PDF</button>
      <button class="ls-btn primary" id="btn-add-athlete" type="button">+ Athlète</button>
    </div>
  </header>

  <div id="toast-root"></div>

  <div class="ls-layout">
    <aside class="ls-panel">
      <h2>Athlètes</h2>
      <div class="ls-athlete-list" id="athlete-list"></div>
      <div class="ls-side-divider"></div>
      <div class="ls-side-actions">
        <label class="ls-btn small" for="input-csv" style="justify-content:center;">Importer un CSV de séances</label>
        <input class="ls-hidden" type="file" id="input-csv" accept=".csv,text/csv">
        <button class="ls-btn small" id="btn-download-template" type="button">Télécharger le modèle CSV</button>
      </div>
    </aside>

    <main id="main-panel"></main>
  </div>

  <div class="ls-footer">Données synchronisées sur le serveur DATAS Trail running (Supabase) — partagées entre vos appareils. Pensez tout de même à exporter une sauvegarde JSON de temps en temps.</div>
</div>

<div id="modal-root"></div>

<script src="chart.umd.min.js"></script>
<script>
"use strict";
/* =========================================================================
   DATAS Trail running — suivi de charge d'entraînement (TRIMP / charge aiguë-chronique / ACWR)
   Application autonome, sans backend. Données persistées en localStorage.
   ========================================================================= */

const CAT_HUES = ["--cat-1","--cat-2","--cat-3","--cat-4","--cat-5","--cat-6","--cat-7","--cat-8"];
const SPORTS = ["Course à pied","Trail","Cyclisme","Musculation","Triathlon","Natation","Ski de fond","Autre"];

// Catégories affichées empilées sur le graphique "Volume hebdomadaire" —
// regroupe les types de séance en 5 familles ; tout ce qui n'est pas
// Vélo/Course/Musculation/Ski tombe dans "Autres" (Triathlon, Natation, Autre...).
const VOLUME_CATEGORIES = [
  { key:"velo", label:"Vélo", colorVar:"--cat-1" },
  { key:"course", label:"Course à pied", colorVar:"--cat-2" },
  { key:"muscu", label:"Musculation", colorVar:"--cat-3" },
  { key:"ski", label:"Ski", colorVar:"--cat-4" },
  { key:"autres", label:"Autres", colorVar:"--text-muted" }
];
function volumeCategoryOf(type){
  if(type === "Cyclisme") return "velo";
  if(type === "Course à pied" || type === "Trail") return "course";
  if(type === "Musculation") return "muscu";
  if(type === "Ski de fond") return "ski";
  return "autres";
}
const ZONE_LABELS = ["Z1 · Échauffement","Z2 · Endurance fondamentale","Z3 · Tempo","Z4 · Seuil 2","Z5 · VO2max"];
const GRADE_BUCKET_LABELS = ["Descente forte (>12%)","Descente modérée (4-12%)","Plat / roulant (±4%)","Montée modérée (4-10%)","Montée soutenue (10-18%)","Montée forte (>18%)"];
const MATRIX_BRANCHES = ["Endurance","Montée","Descente","Vitesse","Résilience","Physiologie"];
const MATRIX_WINDOW_WEEKS = 6;
const PACE_ZONE_VARS = ["--z1","--z2","--z3","--z4","--z5","--z6","--z7"];

// Technicité du terrain, saisie manuellement par le coach pour chaque séance
// (montée / descente / plat), utilisée pour corriger le GAP par tranche de
// pente : un coefficient qui « crédite » le coureur de la difficulté
// supplémentaire d'un terrain technique, en plus de la pente elle-même.
// Coefficients calibrés dans la fourchette validée par la littérature sur le
// coût énergétique selon le type de terrain (Soule & Goldman 1972, facteur de
// terrain η de 1,0 à 2,1 ; Voloshina et al., jusqu'à +27% de coût sur terrain
// irrégulier à plat) — resserrée ici car un sentier de trail reste en général
// plus roulant qu'un marécage ou du sable. Ajustables si l'usage le suggère.
const TECHNICITY_LEVELS = [
  { value:"route", label:"Route" },
  { value:"roulant", label:"Roulant" },
  { value:"normal", label:"Normal" },
  { value:"technique", label:"Technique" },
  { value:"tres_technique", label:"Très technique" },
];
const TECHNICITY_COEFFICIENTS = { route:1.00, roulant:1.10, normal:1.20, technique:1.35, tres_technique:1.60 };
function technicityCoef(value){ return TECHNICITY_COEFFICIENTS[value] || 1.00; }
function technicityLabel(value){ const l = TECHNICITY_LEVELS.find(t=>t.value===value); return l ? l.label : "Roulant"; }
// Les 4 tests de terrain du jumeau numérique (voir table athlete_tests).
const ATHLETE_TEST_TYPES_META = [
  { value:"force_membre_inf", label:"Force max membre inférieur (plateforme de force)" },
  { value:"vma", label:"VMA (test de terrain)" },
  { value:"seuil1", label:"Seuil 1 — aérobie" },
  { value:"seuil2", label:"Seuil 2 — anaérobie" },
];
// Table d'intensité par défaut (7 zones) : le coach saisit lui-même les bornes
// km/h et FC pour chaque athlète — rien n'est calculé automatiquement. Z6/Z7
// (efforts anaérobies courts) n'ont pas de bornes FC : la fréquence cardiaque
// n'a pas le temps de représenter l'effort réel sur ces intensités.
function defaultIntensityZones(){
  return [
    { name:"Échauffement", kmh_min:null, kmh_max:null, hr_min:null, hr_max:null },
    { name:"Endurance fondamentale (Seuil 1)", kmh_min:null, kmh_max:null, hr_min:null, hr_max:null },

  if(!dateStr) return null;
  const b = new Date(dateStr + "T00:00:00");
  if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();

// Va chercher chez Strava les séances plus anciennes que l'import automatique
// initial (strava-callback, côté serveur, ne remonte qu'un premier lot à la
// connexion — voir son commentaire). Appelle la même fonction serveur que le
// coach peut aussi déclencher en ligne de commande (strava-import-history) :
// reprenable et idempotente (upsert sur strava_activity_id), donc on peut
// relancer plusieurs lots d'affilée sans risque de doublons. Strava limite
// les appels API à 100 toutes les 15 minutes, PARTAGÉS entre tous les
// athlètes connectés à l'appli — un historique profond peut donc nécessiter
// plusieurs lots ; la fonction serveur le signale (rate_limited) plutôt que
// d'échouer, et on relance automatiquement tant qu'elle répond juste "pas
// encore fini" (done:false) sans être bridée par Strava.
async function importStravaHistory(athleteId, btn){
  const key = localStorage.getItem(COACH_KEY_STORAGE) || "";
  const originalLabel = btn ? btn.textContent : "";
  if(btn) btn.disabled = true;
  let totalImported = 0, totalSkipped = 0, round = 0;
  try{
    while(true){
      round++;
      if(btn) btn.textContent = round===1 ? "Import en cours…" : `Import en cours (lot ${round})…`;
      let res;
      try{
        res = await fetch(STRAVA_IMPORT_HISTORY_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json", "x-coach-key": key },
          body: JSON.stringify({ athlete_id: athleteId }),
        });
      }catch(e){
        throw new Error("Connexion au serveur impossible. Vérifiez votre connexion internet.");
      }
      if(res.status === 401){
        localStorage.removeItem(COACH_KEY_STORAGE);
        const err = new Error("Clé d'accès invalide ou expirée.");
        err.unauthorized = true;
        throw err;
      }
      let data = null;
      try{ data = await res.json(); }catch(e){ /* réponse non-JSON */ }
      if(!res.ok){
        throw new Error((data && data.error) || ("Erreur serveur (" + res.status + ")"));
      }
      totalImported += (data && data.imported) || 0;
      totalSkipped += (data && data.skipped) || 0;
      if(data && data.done){
        showToast("Historique Strava importé : " + totalImported + " séance(s)" + (totalSkipped ? ", " + totalSkipped + " ignorée(s)" : "") + ".", "--good");
        break;
      }
      if(data && data.rate_limited){
        showToast("Limite Strava atteinte pour l'instant (" + totalImported + " séance(s) importée(s) jusque-là) — recliquez dans ~15 minutes pour continuer.", "--warning");
        break;
      }
      await new Promise(r=>setTimeout(r, 500));
    }
  }catch(err){
    if(err.unauthorized) showKeyGate("Clé invalide, réessayez.");
    else showToast("Import impossible : " + err.message, "--critical");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

function handleStravaRedirectParam(){
  const url = new URL(window.location.href);
  const flag = url.searchParams.get("strava");
  if(!flag) return;
  url.searchParams.delete("strava");
  history.replaceState({}, "", url.pathname + (url.search? url.search : "") + url.hash);
  const messages = {
    connected: { css:"--good", text:"Compte Strava connecté. Les dernières séances (30 jours) sont en cours d'import — actualisez dans quelques instants si elles n'apparaissent pas encore." },
    denied: { css:"--warning", text:"Connexion Strava annulée : l'autorisation n'a pas été accordée." },

    error: { css:"--critical", text:"Une erreur est survenue lors de la connexion à Strava. Réessayez." }
  };
  const m = messages[flag];
  if(m) showToast(m.text, m.css);

/* ---------------------------- domain calculations ---------------------------- */

function trimp(session){
  const z = session.zones;
  return z[0]*1 + z[1]*2 + z[2]*3 + z[3]*4 + z[4]*5;
}

function dailySeries(sessions){
  // returns { "YYYY-MM-DD": trimpTotal }
  const map = {};
  sessions.forEach(s => { map[s.date] = (map[s.date]||0) + trimp(s); });
  return map;
}

function dateRangeDays(startISO, endISO){
  const out = [];
  let d = new Date(startISO);
  const end = new Date(endISO);
  while(d <= end){ out.push(fmtDate(d)); d.setDate(d.getDate()+1); }
  return out;
}

function rollingAvg(orderedDates, map, index, window){
  let sum = 0, n = 0;
  for(let k = index; k > index - window && k >= 0; k--){
    sum += map[orderedDates[k]] || 0; n++;
  }
  return n ? sum / window : 0;
}

function acwrSeries(sessions){
  if(sessions.length === 0) return { dates:[], acute:[], chronic:[], acwr:[] };
  const map = dailySeries(sessions);
  const sorted = sessions.map(s=>s.date).sort();
  const start = sorted[0];
  const end = fmtDate(new Date());
  const dates = dateRangeDays(start, end);
  const acute = [], chronic = [], acwr = [];
  dates.forEach((d, i) => {
    const a = rollingAvg(dates, map, i, 7);
    const c = rollingAvg(dates, map, i, 28);
    acute.push(a); chronic.push(c);
    // Sous 14 jours d'historique, le ratio est trop instable pour être affiché.
    acwr.push(c > 0.5 && i >= 13 ? a/c : null);
  });
  return { dates, acute, chronic, acwr };
}

function classifyACWR(v){
  if(v == null || !isFinite(v)) return { key:"none", label:"Pas assez d'historique", css:"--text-muted" };
  if(v < 0.8) return { key:"warning", label:"Sous-charge" };
  if(v <= 1.3) return { key:"good", label:"Zone optimale" };
  if(v <= 1.5) return { key:"serious", label:"Prudence" };
  return { key:"critical", label:"Risque élevé" };
}

function isoMonday(dateStr){
  const d = new Date(dateStr);
  const day = (d.getDay() + 6) % 7; // 0 = monday
  d.setDate(d.getDate() - day);
  return fmtDate(d);
}

// Agrège les séances par semaine (lundi au dimanche) sur la période
// [startISO, endISO] (bornes incluses).
function weeklyAggregates(sessions, startISO, endISO){
  const byWeek = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const wk = isoMonday(s.date);
    if(!byWeek[wk]) byWeek[wk] = { week: wk, km:0, dPlus:0, dMinus:0, zones:[0,0,0,0,0], paceZones:[0,0,0,0,0,0,0], hasPaceData:false, count:0 };
    const b = byWeek[wk];
    b.km += s.distance; b.dPlus += s.dPlus; b.dMinus += s.dMinus; b.count++;
    s.zones.forEach((m,i)=> b.zones[i]+=m);
    if(Array.isArray(s.paceZones)){ b.hasPaceData = true; s.paceZones.forEach((m,i)=> b.paceZones[i]+=m); }
  });
  return Object.values(byWeek).sort((a,b)=> a.week < b.week ? -1 : 1);
}

// Comme weeklyAggregates, mais retourne le kilométrage par semaine ET par
// catégorie (VOLUME_CATEGORIES) — sert au graphique Volume empilé.
function weeklyKmByCategory(sessions, startISO, endISO){
  const byWeek = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const wk = isoMonday(s.date);
    if(!byWeek[wk]) byWeek[wk] = {};
    const cat = volumeCategoryOf(s.type);
    byWeek[wk][cat] = (byWeek[wk][cat]||0) + s.distance;
  });
  return byWeek;
}

// Comme weeklyKmByCategory, mais pour le dénivelé positif/négatif — sert au
// graphique Dénivelé empilé par activité.
function weeklyElevationByCategory(sessions, startISO, endISO){
  const byWeek = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const wk = isoMonday(s.date);
    if(!byWeek[wk]) byWeek[wk] = {};
    const cat = volumeCategoryOf(s.type);
    if(!byWeek[wk][cat]) byWeek[wk][cat] = { dPlus:0, dMinus:0 };
    byWeek[wk][cat].dPlus += (s.dPlus||0);
    byWeek[wk][cat].dMinus += (s.dMinus||0);
  });
  return byWeek;
}

// Vitesse ajustée à la pente (GAP) moyenne par zone de FC, sur une fenêtre de
// `weeks` semaines se terminant à `endDate` — moyenne des séances Strava ayant
// une valeur pour cette zone (null si aucune séance de la fenêtre n'en a).
function gapZoneAverage(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  const sums = [0,0,0,0,0], counts = [0,0,0,0,0];
  sessions.forEach(s=>{
    if(!Array.isArray(s.gapByHrZone)) return;
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    s.gapByHrZone.forEach((v,i)=>{ if(v!=null){ sums[i]+=v; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}

// Vitesse de pointe : moyenne, sur une fenêtre glissante de `weeks` semaines
// se terminant à endDate, du meilleur segment de 30 secondes soutenues de
// chaque séance, restreint au terrain plat/roulant (gapPeak30s, calculé côté
// serveur depuis les flux Strava bruts, pente entre -4% et +4% — voir
// strava-webhook). Contrairement à gapZoneAverage, cette valeur est
// indépendante de la FC : elle ne rate pas les accélérations courtes
// (fractionnés, relances techniques) que la fréquence cardiaque, plus lente
// à réagir, ne voit pas toujours à temps. Se limiter au plat évite aussi de
// dépendre du modèle de coût énergétique sur pentes fortes et de la prise de
// risque propre à la descente (une séance sans segment plat de 30s ne
// contribue simplement pas, plutôt que d'afficher une valeur trompeuse).
function peakGapAverage(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  let sum = 0, count = 0;
  sessions.forEach(s=>{
    if(s.gapPeak30s == null) return;
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    sum += s.gapPeak30s; count++;
  });
  return count > 0 ? Math.round((sum/count)*10)/10 : null;
}

/* ---------------------------- Rapport environnemental (réplique Enduraw) ---------------------------- */
// Facteurs déjà calculés côté serveur (strava-webhook / strava-backfill-gap :
// chaleur WBGT, altitude, vent — voir commentaires de colonnes sur
// public.sessions) et stockés par séance Strava. Cette section ne fait que
// les résumer et les afficher ; aucun calcul environnemental côté client.

// Sévérité du facteur combiné, mêmes clés que classifyACWR (réutilise les
// mêmes couleurs --good/--warning/--serious/--critical déjà définies pour
// l'ACWR, pour rester cohérent visuellement dans toute l'appli).
function envSeverity(f){
  if(f == null) return { key:"none", label:"—" };
  if(f < 0.08) return { key:"good", label:"Faible" };
  if(f < 0.18) return { key:"warning", label:"Modéré" };
  if(f < 0.30) return { key:"serious", label:"Marqué" };
  return { key:"critical", label:"Fort" };
}

// Facteur de ralentissement lié à la technicité du terrain — pondère les
// coefficients de technicité saisis par le coach (montée/descente/plat, voir
// TECHNICITY_COEFFICIENTS) par le temps réellement passé dans chaque tranche
// de pente (envGradeTimeShares, calculé côté serveur depuis les flux Strava,
// mêmes tranches que gapByGrade — voir gapGradeAverageInRange pour le même
// principe de pondération). Calculé ici plutôt que stocké en base : contrairement
// à la météo (figée à l'import), la technicité peut être modifiée après coup
// en éditant la séance, donc ce facteur doit toujours refléter sa valeur
// actuelle. Sessions sans technicité saisie (défaut "roulant", coefficient
// 1.00 partout) donnent un facteur terrain de 0 — dégradation neutre plutôt
// qu'une correction inventée.
function envTerrainFactor(s){
  if(!Array.isArray(s.envGradeTimeShares)) return null;
  const cDescent = technicityCoef(s.technicityDescent);
  const cFlat = technicityCoef(s.technicityFlat);
  const cClimb = technicityCoef(s.technicityClimb);
  const bucketCoef = [cDescent, cDescent, cFlat, cClimb, cClimb, cClimb];
  const weighted = s.envGradeTimeShares.reduce((sum, share, i) => sum + share*bucketCoef[i], 0);
  return weighted - 1;
}

// Facteur combiné météo + terrain (mêmes formules que côté serveur pour la
// météo : produit des (1+facteur) moins 1), avec le facteur terrain calculé
// dynamiquement ci-dessus. Se rabat sur le facteur météo seul si le terrain
// n'a pas pu être calculé (flux insuffisants).
function envCombinedWithTerrain(s){
  if(s.envCombinedFactor == null) return null;
  const terrain = envTerrainFactor(s);
  if(terrain == null) return s.envCombinedFactor;
  return (1+s.envCombinedFactor)*(1+terrain) - 1;
}
function envAdjustedDurationWithTerrain(s){
  if(s.duration == null) return s.envAdjustedDuration;
  const combined = envCombinedWithTerrain(s);
  if(combined == null) return s.envAdjustedDuration;
  return s.duration/(1+combined);
}

// Résumé du rapport environnemental sur une fenêtre glissante de `weeks`
// semaines se terminant à `endDate` — uniquement les séances Strava pour
// lesquelles le calcul a abouti (flux GPS + météo historique disponibles).
// count = 0 si aucune séance éligible sur la période (renvoie alors un objet
// minimal, à tester avant de lire les autres champs).
function envSummaryFor(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  const eligible = sessions.filter(s=>{
    if(s.envCombinedFactor == null) return false;
    const d = new Date(s.date+"T00:00:00");
    return !isNaN(d) && d >= start && d <= endDate;
  });
  if(eligible.length === 0) return { count:0 };
  const avg = arr => arr.reduce((a,b)=>a+b,0) / arr.length;
  const combined = eligible.map(envCombinedWithTerrain);
  return {
    count: eligible.length,
    avgTemp: avg(eligible.map(s=>s.envTempC)),
    avgCombined: avg(combined),
    markedCount: combined.filter(v=>v >= 0.18).length,
  };
}

function envFmtPct(f){ return f==null ? "—" : (f>=0?"+":"") + Math.round(f*100) + "%"; }
function envFmtNum(v, unit, digits){ return v==null ? "—" : v.toFixed(digits!=null?digits:0) + unit; }

function envRowHtml(s){
  const combined = envCombinedWithTerrain(s);
  const adjustedDuration = envAdjustedDurationWithTerrain(s);
  const sev = envSeverity(combined);
  return `<tr>
    <td>${fmtDateFr(s.date)}</td>
    <td>${escapeHtml(s.type)}</td>
    <td>${fmtHoursMinutes(s.duration)}</td>
    <td>${adjustedDuration!=null ? fmtHoursMinutes(adjustedDuration) : "—"}</td>
    <td>${envFmtNum(s.envTempC,"°C",1)}</td>
    <td>${envFmtNum(s.envHumidityPct,"%",0)}</td>
    <td>${envFmtNum(s.envMeanAltitudeM,"m",0)}</td>
    <td>${envFmtNum(s.envWindMs,"m/s",1)}</td>
    <td>${envFmtPct(s.envHeatFactor)}</td>
    <td>${envFmtPct(s.envAltitudeFactor)}</td>
    <td>${envFmtPct(s.envWindFactor)}</td>
    <td>${envFmtPct(envTerrainFactor(s))}</td>
    <td><span class="ls-status-pill" style="background:var(${statusVar(sev.key)});color:${statusInk(sev.key)}">${envFmtPct(combined)}</span></td>
  </tr>`;
}

// Même moyenne GAP par zone de FC que gapZoneAverage, mais sur un sous-
// ensemble de séances déjà filtré (ex : un mois calendaire) plutôt que sur
// une fenêtre glissante — sert au graphique "Efficacité physiologique", qui
// trace une courbe par mois plutôt qu'un simple avant/après.
function gapZoneAverageOf(sessionsSubset){
  const sums = [0,0,0,0,0], counts = [0,0,0,0,0];
  sessionsSubset.forEach(s=>{
    if(!Array.isArray(s.gapByHrZone)) return;
    s.gapByHrZone.forEach((v,i)=>{ if(v!=null){ sums[i]+=v; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}

// Liste des mois calendaires (année + mois 0-indexé) couverts par
// [periodStart, periodEnd], bornes incluses.
function monthsBetween(periodStart, periodEnd){
  const months = [];
  const cur = new Date(periodStart.getFullYear(), periodStart.getMonth(), 1);
  const last = new Date(periodEnd.getFullYear(), periodEnd.getMonth(), 1);
  while(cur <= last){
    months.push({ year: cur.getFullYear(), month: cur.getMonth() });
    cur.setMonth(cur.getMonth() + 1);
  }
  return months;
}
function monthLabelFr(year, month){
  const label = new Date(year, month, 1).toLocaleDateString("fr-FR", { month:"long", year:"numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

// Interpole entre deux couleurs hexadécimales (t=0 -> hexA, t=1 -> hexB) —
// sert au dégradé chronologique des courbes du graphique "Efficacité
// physiologique" (mois ancien = terne, mois récent = couleur pleine).
function hexToRgb(hex){
  hex = hex.replace("#","");
  if(hex.length === 3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex, 16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function mixHexColors(hexA, hexB, t){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const mix = a.map((v,i)=> Math.round(v + (b[i]-v)*t));
  return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
}

// Même principe que gapZoneAverage, mais par tranche de pente (6 tranches)
// plutôt que par zone de FC — sert au graphe "Profil terrain".
// Les 6 tranches de gapByGrade sont, dans l'ordre : descente forte, descente
// modérée, plat, montée modérée, montée soutenue, montée forte (voir
// GRADE_BUCKET_LABELS). On corrige chaque tranche par le coefficient de
// technicité que le coach a saisi pour cette séance (montée / descente / plat
// séparément) avant de moyenner entre séances — un terrain technique fait
// naturellement baisser le GAP brut à effort égal, ce coefficient « rend » au
// coureur la difficulté supplémentaire du terrain, en plus de la pente.
function gapGradeAverage(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  return gapGradeAverageInRange(sessions, start, endDate);
}

// Même calcul que gapGradeAverage, mais sur un intervalle [startDate,endDate]
// explicite plutôt qu'une fenêtre glissante de N semaines — sert au
// graphique "Profil terrain", dont les deux périodes de comparaison sont
// choisies librement par le coach plutôt que dérivées automatiquement de la
// période affichée plus haut.
function gapGradeAverageInRange(sessions, startDate, endDate){
  const sums = [0,0,0,0,0,0], counts = [0,0,0,0,0,0];
  sessions.forEach(s=>{
    if(!Array.isArray(s.gapByGrade)) return;
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < startDate || d > endDate) return;
    const cDescent = technicityCoef(s.technicityDescent);
    const cFlat = technicityCoef(s.technicityFlat);
    const cClimb = technicityCoef(s.technicityClimb);
    const bucketCoef = [cDescent, cDescent, cFlat, cClimb, cClimb, cClimb];
    s.gapByGrade.forEach((v,i)=>{ if(v!=null){ sums[i]+=v*bucketCoef[i]; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}

/* ---------------------------- Runner Matrix : scores 0-100 ---------------------------- */
//
// Chaque branche est une métrique déjà calculée ailleurs dans l'app (charge
// chronique, GAP par zone de FC, GAP par tranche de pente, stabilité de
// l'ACWR), ramenée à une note 0-100 par rapport au propre historique de
// l'athlète : 0 = la valeur la plus basse jamais observée sur une fenêtre
// glissante de 6 semaines, 100 = la plus haute. Pas de barème absolu, pas de
// comparaison à d'autres coureurs — uniquement la progression de l'athlète
// face à lui-même.
//
//  Endurance   → charge chronique (28j) : capacité aérobie accumulée.
//  Montée      → GAP moyen sur les tranches de pente ascendantes (4-10 / 10-18 / >18%).
//  Descente    → GAP moyen sur les tranches de pente descendantes (>12% / 4-12%).
//  Vitesse     → meilleur segment de 30 secondes soutenues sur terrain plat/roulant
//                (pente entre -4% et +4%, même tranche que Profil terrain),
//                indépendant de la FC : capte les accélérations courtes et
//                techniques (fractionnés) que la fréquence cardiaque, trop lente à
//                réagir, ne voit pas toujours à temps — sans le biais du modèle de
//                coût énergétique sur pentes fortes ni la prise de risque en descente.
//  Résilience  → % du temps passé en zone ACWR "optimale"/"prudence" (0.8-1.5) sur 12 semaines,
//                plutôt qu'en sous-charge ou en risque élevé.
//  Physiologie → GAP moyen toutes zones de FC confondues : efficacité aérobie globale.

function seriesValueAt(dates, arr, endDate){
  const endStr = fmtDate(endDate);
  let idx = -1;
  for(let i=0;i<dates.length;i++){ if(dates[i] <= endStr) idx = i; else break; }
  return idx >= 0 ? arr[idx] : null;
}

function avgIgnoreNull(arr){
  const v = arr.filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}

// % des jours de la fenêtre passés avec un ACWR en zone "optimale" ou "prudence"
// (0.8-1.5) plutôt qu'en sous-charge ou en risque élevé — un entraînement stable,
// sans à-coups dangereux, plutôt qu'une charge qui alterne excès et sous-régime.
function resilienceRatioAt(dates, acwr, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  let total = 0, safe = 0;
  dates.forEach((dStr, i) => {
    const d = new Date(dStr+"T00:00:00");
    if(d < start || d > endDate) return;
    const v = acwr[i];
    if(v == null) return;
    total++;
    if(v >= 0.8 && v < 1.5) safe++;
  });
  return total > 0 ? Math.round((safe/total)*1000)/10 : null;
}

// Fenêtre (en semaines) utilisée pour moyenner les métriques autour de
// chaque date comparée, dérivée de la longueur de la période choisie par le
// coach : jusqu'à MATRIX_WINDOW_WEEKS (6), mais jamais plus de la moitié de
// la période (pour que les deux fenêtres — début et fin de période — ne se
// chevauchent pas sur une période courte).
function periodWeeksBetween(startDate, endDate){
  return Math.max(1, Math.round((endDate - startDate) / (7*86400000)));
}
function comparisonWindowWeeksFor(startDate, endDate){
  return Math.max(1, Math.min(MATRIX_WINDOW_WEEKS, Math.floor(periodWeeksBetween(startDate, endDate)/2)));
}

// Valeur brute de chacune des 6 branches à une date donnée (fenêtre de
// `windowWeeks` semaines se terminant à endDate), dans l'ordre MATRIX_BRANCHES.
function matrixRawValuesAt(sessions, dates, chronic, acwr, endDate, windowWeeks){
  windowWeeks = windowWeeks || MATRIX_WINDOW_WEEKS;
  const gapZ = gapZoneAverage(sessions, endDate, windowWeeks);
  const gapG = gapGradeAverage(sessions, endDate, windowWeeks);
  return [
    seriesValueAt(dates, chronic, endDate),                    // Endurance
    avgIgnoreNull([gapG[3], gapG[4], gapG[5]]),                 // Montée
    avgIgnoreNull([gapG[0], gapG[1]]),                          // Descente
    peakGapAverage(sessions, endDate, windowWeeks),             // Vitesse
    resilienceRatioAt(dates, acwr, endDate, windowWeeks*2),     // Résilience
    avgIgnoreNull(gapZ),                                        // Physiologie
  ];
}

// Historique hebdomadaire (une valeur par semaine sur toute l'histoire de
// l'athlète) de chacune des 6 branches — sert de référentiel min/max pour
// noter 0-100. Coûteux (une passe par semaine d'historique) mais l'échelle
// reste petite pour un coach individuel.
function buildMatrixHistories(sessions, dates, chronic, acwr, windowWeeks){
  if(!sessions.length) return MATRIX_BRANCHES.map(()=>[]);
  const firstDate = new Date(sessions.map(s=>s.date).sort()[0]+"T00:00:00");
  const today = new Date();
  const histories = MATRIX_BRANCHES.map(()=>[]);
  for(let d = new Date(firstDate); d <= today; d.setDate(d.getDate()+7)){
    const values = matrixRawValuesAt(sessions, dates, chronic, acwr, new Date(d), windowWeeks);
    values.forEach((v,i)=>{ if(v!=null) histories[i].push(v); });
  }
  return histories;
}

function scoreFromHistory(history, value){
  if(value == null || history.length < 6) return null;
  const min = Math.min(...history), max = Math.max(...history);
  if(max - min < 1e-9) return 50;
  return Math.round(Math.max(0, Math.min(100, (value-min)/(max-min)*100)));
}

function matrixScoresAt(sessions, dates, chronic, acwr, endDate, histories, windowWeeks){
  const raw = matrixRawValuesAt(sessions, dates, chronic, acwr, endDate, windowWeeks);
  return raw.map((v,i)=> scoreFromHistory(histories[i], v));
}

function sum7(sessions){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6);
  const cutoffStr = fmtDate(cutoff);
  return sessions.filter(s=>s.date >= cutoffStr).reduce((acc,s)=>{
    acc.km += s.distance; acc.dPlus += s.dPlus; acc.dMinus += s.dMinus; return acc;
  }, {km:0, dPlus:0, dMinus:0});
}

/* ---------------------------- Jumeau numérique : agrégation des 7 paramètres ---------------------------- */
//
// 1. Force max membre inférieur (N)  -> dernier test_type='force_membre_inf', valueDroite+valueGauche
// 2. VMA (km/h)                      -> dernier test_type='vma', value
// 3. Seuil 1 / aérobie (km/h)        -> dernier test_type='seuil1', value
// 4. Seuil 2 / anaérobie (km/h)      -> dernier test_type='seuil2', value
// 5. Montée  -> profil VAM (m/h) par zone FC (5) x tranche de pente montante
//    (3 : 4-10/10-18/>18%), calculé côté serveur (vamClimbProfile, 15 valeurs,
//    index = zone*3+tranche) et simplement moyenné ici entre séances de la
//    fenêtre, case par case (même principe que gapZoneAverage).
// 6. Descente -> même chose, profil VAM descente (10 valeurs, zone*2+tranche).
// 7. Volume -> moyenne hebdomadaire glissante sur 6 mois, en km et en heures.

// Dernier test en date d'un type donné pour un athlète (ou null si aucun).
function latestAthleteTest(athleteId, testType){
  const tests = (state.athleteTests || []).filter(t=>t.athleteId===athleteId && t.testType===testType);
  if(!tests.length) return null;
  return tests.reduce((latest,t)=> (!latest || t.date > latest.date) ? t : latest, null);
}

// Force max membre inférieur (N) = somme droite + gauche du dernier test,
// ou null si l'un des deux membres n'a pas été saisi.
function latestForceMax(athleteId){
  const t = latestAthleteTest(athleteId, "force_membre_inf");
  if(!t || t.valueDroite==null || t.valueGauche==null) return null;
  return { value: Math.round((t.valueDroite + t.valueGauche)*10)/10, date: t.date, valueDroite:t.valueDroite, valueGauche:t.valueGauche };
}
// VMA / Seuil 1 / Seuil 2 (km/h) du dernier test, ou null.
function latestSpeedTest(athleteId, testType){
  const t = latestAthleteTest(athleteId, testType);
  if(!t || t.value==null) return null;
  return { value: t.value, date: t.date };
}

// Moyenne, entre séances Strava de la fenêtre, d'un profil VAM plat (climb:
// 15 cases zone*3+tranche, descent: 10 cases zone*2+tranche) déjà moyenné par
// séance côté serveur — même principe que gapZoneAverage : une séance sans
// donnée pour une case donnée ne contribue simplement pas à cette case.
function vamProfileAverage(sessions, endDate, weeks, field, cellCount){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  const sums = new Array(cellCount).fill(0), counts = new Array(cellCount).fill(0);
  sessions.forEach(s=>{
    const profile = s[field];
    if(!Array.isArray(profile)) return;
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    profile.forEach((v,i)=>{ if(v!=null){ sums[i]+=v; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}
function vamClimbProfileAverage(sessions, endDate, weeks){
  return vamProfileAverage(sessions, endDate, weeks, "vamClimbProfile", 15);
}
function vamDescentProfileAverage(sessions, endDate, weeks){
  return vamProfileAverage(sessions, endDate, weeks, "vamDescentProfile", 10);
}
// Lecture d'une case du profil VAM montée/descente par zone de FC (0-4) et
// tranche de pente (climb: 0=modérée/1=soutenue/2=forte, descent:
// 0=forte/1=modérée) -- voir hrZoneIndex/climbBucketIndex/descentBucketIndex
// côté serveur (strava-webhook) pour les bornes exactes.
function vamProfileCell(profile, zoneIdx, bucketIdx, bucketsPerZone){
  if(!Array.isArray(profile)) return null;
  return profile[zoneIdx*bucketsPerZone + bucketIdx] ?? null;
}

// Types de séance retenus pour le Volume du jumeau numérique, selon les
// cases CAP / Vélo cochées par le coach (twinVolumeIncludeRun/Bike ci-dessus).
function twinVolumeSessionTypes(){
  const types = [];
  if(twinVolumeIncludeRun) types.push("Course à pied", "Trail");
  if(twinVolumeIncludeBike) types.push("Cyclisme");
  return types;
}
function isTwinVolumeSession(s){
  return twinVolumeSessionTypes().includes(s.type);
}

// Volume hebdomadaire moyen (km et heures), moyenne glissante sur 6 mois
// (26 semaines) se terminant à endDate -- somme des séances de la fenêtre
// divisée par le nombre de semaines, pas seulement des semaines avec séance.
const VOLUME_WINDOW_WEEKS = 26;
function volumeWeeklyAverage(sessions, endDate){
  const start = new Date(endDate); start.setDate(start.getDate() - VOLUME_WINDOW_WEEKS*7);
  let km = 0, minutes = 0;
  sessions.forEach(s=>{
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    km += s.distance || 0; minutes += s.duration || 0;
  });
  return { km: Math.round((km/VOLUME_WINDOW_WEEKS)*10)/10, hours: Math.round((minutes/60/VOLUME_WINDOW_WEEKS)*10)/10 };
}

// Les 7 paramètres du jumeau numérique pour un athlète, à une date de
// référence donnée (par défaut aujourd'hui) -- rassemble les 4 tests de
// terrain (dernière valeur) et les 3 paramètres calculés depuis Strava.
function digitalTwinParams(athleteId, sessions, endDate){
  endDate = endDate || new Date();
  const stravaSessions = sessions.filter(s=>s.athleteId===athleteId && s.source==="strava");
  const volumeSessions = stravaSessions.concat(sessions.filter(s=>s.athleteId===athleteId && s.source!=="strava")).filter(isTwinVolumeSession);
  return {
    forceMax: latestForceMax(athleteId),
    vma: latestSpeedTest(athleteId, "vma"),
    seuil1: latestSpeedTest(athleteId, "seuil1"),
    seuil2: latestSpeedTest(athleteId, "seuil2"),
    vamClimbProfile: vamClimbProfileAverage(stravaSessions, endDate, MATRIX_WINDOW_WEEKS),
    vamDescentProfile: vamDescentProfileAverage(stravaSessions, endDate, MATRIX_WINDOW_WEEKS),
    volume: volumeWeeklyAverage(volumeSessions, endDate),
  };
}

/* ---------------------------- Simulateur : moteur de régression par paires ---------------------------- */
//
// Objectif : déplacer 1-2 des 7 paramètres du jumeau numérique et estimer
// l'effet sur les autres, à partir de l'historique propre de l'athlète (pas
// de formule physiologique générique). Deux catégories de paramètres :
//  - "physio" (Force, VMA, Seuil1, Seuil2) : un point par test de terrain,
//    donc toujours rare, même avec beaucoup d'historique d'entraînement.
//  - "perf"/"charge" (Montée, Descente, Volume) : dérivés des séances Strava
//    par fenêtres glissantes, donc denses et de plus en plus fiables avec le
//    temps.
// En dessous du seuil minimum d'observations appariées, on affiche un repère
// qualitatif par paire de catégories plutôt qu'un chiffre non fiable.

const SIM_PARAMS = [
  { key:"force", label:"Force max membre inférieur", category:"physio" },
  { key:"vma", label:"VMA", category:"physio" },
  { key:"seuil1", label:"Seuil 1 (aérobie)", category:"physio" },
  { key:"seuil2", label:"Seuil 2 (anaérobie)", category:"physio" },
  { key:"volume", label:"Volume hebdo", category:"charge" },
  { key:"montee", label:"Montée (VAM moy.)", category:"perf" },
  { key:"descente", label:"Descente (VAM moy.)", category:"perf" },
];
const SIM_SNAPSHOT_WINDOW_WEEKS = 8;   // fenêtre glissante pour les instantanés Volume/Montée/Descente
const SIM_SNAPSHOT_STEP_WEEKS = 2;     // pas entre deux instantanés successifs
const SIM_MAX_GAP_DAYS = 21;           // écart temporel max pour apparier deux observations
const SIM_MIN_PAIRS = 4;               // nombre minimum de paires pour afficher une tendance chiffrée

function simParamSeriesFromTests(athleteTests, testType, extractValue){
  return athleteTests.filter(t=>t.testType===testType)
    .map(t=>({ date:new Date(t.date+"T00:00:00"), value:extractValue(t) }))
    .filter(p=> p.value!=null && !isNaN(p.date))
    .sort((a,b)=>a.date-b.date);
}
// Instantané du volume hebdo (km, non arrondi) sur une fenêtre de `weeks`
// semaines se terminant à `endDate` -- même principe que volumeWeeklyAverage,
// mais paramétrable en largeur de fenêtre pour le moteur de régression, et
// renvoie null (au lieu de 0) quand la fenêtre est vide.
function simVolumeSnapshotKm(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  let km = 0, count = 0;
  sessions.forEach(s=>{
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    km += s.distance || 0; count++;
  });
  return count>0 ? km/weeks : null;
}
// Moyenne des cases renseignées d'un profil VAM (climb/descent) -- réduit le
// profil 2D à une seule valeur pour les besoins du simulateur (l'onglet
// principal continue d'afficher le détail par zone de FC × pente).
function simAggregateVamProfile(profile){
  if(!Array.isArray(profile)) return null;
  const vals = profile.filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
// Série temporelle d'un paramètre pour un athlète : un point par test pour
// les paramètres physio, des instantanés glissants tous les
// SIM_SNAPSHOT_STEP_WEEKS pour Volume/Montée/Descente.
function simParamSeries(sessions, athleteTests, key){
  if(key==="force") return simParamSeriesFromTests(athleteTests, "force_membre_inf", t=> (t.valueDroite!=null && t.valueGauche!=null) ? t.valueDroite+t.valueGauche : null);
  if(key==="vma") return simParamSeriesFromTests(athleteTests, "vma", t=>t.value);
  if(key==="seuil1") return simParamSeriesFromTests(athleteTests, "seuil1", t=>t.value);
  if(key==="seuil2") return simParamSeriesFromTests(athleteTests, "seuil2", t=>t.value);
  const stravaSessions = sessions.filter(s=>s.source==="strava");
  const dates = stravaSessions.map(s=>new Date(s.date+"T00:00:00")).filter(d=>!isNaN(d));
  if(!dates.length) return [];
  const rangeStart = new Date(Math.min.apply(null, dates)); rangeStart.setDate(rangeStart.getDate() + SIM_SNAPSHOT_WINDOW_WEEKS*7);
  const rangeEnd = new Date(Math.max.apply(null, dates));
  if(rangeStart > rangeEnd) return [];
  const out = [];
  let d = new Date(rangeStart);
  while(d <= rangeEnd){
    let value = null;
    if(key==="volume") value = simVolumeSnapshotKm(sessions.filter(isTwinVolumeSession), d, SIM_SNAPSHOT_WINDOW_WEEKS);
    else if(key==="montee") value = simAggregateVamProfile(vamProfileAverage(stravaSessions, d, SIM_SNAPSHOT_WINDOW_WEEKS, "vamClimbProfile", 15));
    else if(key==="descente") value = simAggregateVamProfile(vamProfileAverage(stravaSessions, d, SIM_SNAPSHOT_WINDOW_WEEKS, "vamDescentProfile", 10));
    if(value!=null) out.push({ date:new Date(d), value });
    d.setDate(d.getDate() + SIM_SNAPSHOT_STEP_WEEKS*7);
  }
  return out;
}
// Apparie deux séries temporelles par proximité de date (plus proche voisin,
// à moins de SIM_MAX_GAP_DAYS) -- donne une liste de paires [x,y] utilisables
// pour une régression linéaire.
function simPairObservations(seriesA, seriesB, maxGapDays){
  const pairs = [];
  seriesA.forEach(a=>{
    let best = null, bestDiff = Infinity;
    seriesB.forEach(b=>{
      const diff = Math.abs(a.date - b.date);
      if(diff < bestDiff){ bestDiff = diff; best = b; }
    });
    if(best && bestDiff <= maxGapDays*86400000) pairs.push([a.value, best.value]);
  });
  return pairs;
}
// Régression linéaire simple (moindres carrés) -- renvoie null si trop peu de
// paires ou si le paramètre déplacé n'a pas varié dans l'historique.
function simLinearRegression(pairs){
  const n = pairs.length;
  if(n < SIM_MIN_PAIRS) return null;
  let sumX=0, sumY=0, sumXY=0, sumXX=0;
  pairs.forEach(([x,y])=>{ sumX+=x; sumY+=y; sumXY+=x*y; sumXX+=x*x; });
  const denom = n*sumXX - sumX*sumX;
  if(Math.abs(denom) < 1e-9) return null;
  const slope = (n*sumXY - sumX*sumY) / denom;
  const intercept = (sumY - slope*sumX) / n;
  return { slope, intercept, n };
}
// Repères qualitatifs par paire de catégories, utilisés en dessous du seuil
// minimum d'observations -- volontairement génériques (principes
// d'entraînement établis), jamais un chiffre inventé à partir de trop peu de
// tests.
const SIM_CATEGORY_NOTES = {
  "physio|physio": "Les qualités physiologiques évoluent souvent de façon liée, mais pas forcément dans les mêmes proportions — un gain isolé sur l'une ne garantit pas un gain équivalent sur les autres.",
  "perf|physio": "La vitesse ascensionnelle/descendante dépend aussi de la technique et de l'expérience du terrain, pas seulement des qualités physiologiques mesurées au test.",
  "charge|physio": "Une progression physiologique permet en général d'absorber un volume plus élevé, mais augmenter le volume avant qu'elle soit confirmée par un nouveau test expose à un risque de surcharge.",
  "perf|perf": "Montée et descente sollicitent des qualités différentes (aérobie/puissance vs excentrique/technique) — une progression sur l'une ne présage pas d'une progression équivalente sur l'autre.",
  "charge|perf": "Un volume plus élevé favorise en général la progression des allures de montée/descente à moyen terme, à condition de rester dans la fourchette sûre indiquée ci-dessus.",
};
function simCategoryNote(catA, catB){
  const key = [catA, catB].sort().join("|");
  return SIM_CATEGORY_NOTES[key] || "Pas assez de recul pour formuler un repère fiable.";
}
function simFormatValue(key, value){
  if(value==null || !isFinite(value)) return "—";
  if(key==="force") return value.toFixed(0)+" N";
  if(key==="vma" || key==="seuil1" || key==="seuil2") return value.toFixed(1)+" km/h";
  if(key==="volume") return value.toFixed(1)+" km/sem.";
  if(key==="montee" || key==="descente") return value.toFixed(0)+" m/h";
  return String(value);
}
// Pour chaque paramètre non déplacé, prédit sa valeur (moyenne des
// prédictions si deux paramètres sont déplacés) via la régression sur
// l'historique de l'athlète, ou bascule sur un repère qualitatif si trop peu
// d'observations.
function simComputeEffects(seriesCache, currentValues, movedKeys, movedValues){
  const results = [];
  SIM_PARAMS.filter(p=> !movedKeys.includes(p.key)).forEach(target=>{
    const predictions = [];
    movedKeys.forEach((movedKey, i)=>{
      const pairs = simPairObservations(seriesCache[movedKey], seriesCache[target.key], SIM_MAX_GAP_DAYS);
      const reg = simLinearRegression(pairs);
      if(reg) predictions.push({ predictedValue: reg.intercept + reg.slope*movedValues[i], n: reg.n });
    });
    if(predictions.length){
      const avgPredicted = predictions.reduce((a,p)=>a+p.predictedValue,0) / predictions.length;
      const minN = Math.min.apply(null, predictions.map(p=>p.n));
      results.push({ key:target.key, label:target.label, mode:"quantified", predictedValue:avgPredicted, currentValue:currentValues[target.key], n:minN });
    } else {
      const notes = Array.from(new Set(movedKeys.map(mk=>{
        const moved = SIM_PARAMS.find(p=>p.key===mk);
        return simCategoryNote(moved.category, target.category);
      })));
      results.push({ key:target.key, label:target.label, mode:"qualitative", currentValue:currentValues[target.key], notes });
    }
  });
  return results;
}
// Fourchette de volume hebdo sûre : règle des 10% sur le volume moyen actuel
// (même base que twin.volume), recoupée avec l'ACWR déjà calculé pour
// l'onglet Entraînement (charge TRIMP acute/chronique) pour signaler un
// contexte de risque -- pas une double contrainte, juste un repère de
// prudence supplémentaire.
function simVolumeSafeRange(athleteSessions){
  const current = volumeWeeklyAverage(athleteSessions.filter(isTwinVolumeSession), new Date());
  if(!current.km) return null;
  const { acute, chronic } = acuteChronicLatest(athleteSessions);
  const acwrNow = chronic > 0.5 ? acute/chronic : null;
  const cls = classifyACWR(acwrNow);
  return {
    lowKm: current.km*0.9, highKm: current.km*1.1,
    lowH: current.hours*0.9, highH: current.hours*1.1,
    currentKm: current.km, currentH: current.hours,
    acwrKey: cls.key, acwrLabel: cls.label,
  };
}
function simVolumeRangeHtml(range){
  if(!range) return "";
  const riskNote = (range.acwrKey==="critical" || range.acwrKey==="serious")
    ? ` Attention : la charge actuelle de l'athlète est déjà en zone « ${escapeHtml(range.acwrLabel)} » (ACWR) — privilégier le bas de cette fourchette.`
    : "";
  return `<div class="ls-panel" style="margin-bottom:14px;">
    <div class="ls-stat-label" style="margin-bottom:4px;">Fourchette de volume hebdo sûre (règle des 10%)</div>
    <div class="ls-stat-value">${range.lowKm.toFixed(1)}–${range.highKm.toFixed(1)}<small>km/sem.</small></div>
    <div class="ls-chart-sub" style="margin-top:4px;">soit environ ${range.lowH.toFixed(1)}–${range.highH.toFixed(1)} h/sem. Actuel : ${range.currentKm.toFixed(1)} km/sem.${riskNote}</div>
  </div>`;
}
function simResultsHtml(effects){
  if(!effects.length) return '<div class="ls-empty">Choisissez au moins un paramètre à faire varier.</div>';
  return `<div class="ls-stat-grid">` + effects.map(e=>{
    if(e.mode==="quantified"){
      return `<div class="ls-stat"><div class="ls-stat-label">${escapeHtml(e.label)}</div>
        <div class="ls-stat-value">${simFormatValue(e.key, e.predictedValue)}</div>
        <small>actuel : ${simFormatValue(e.key, e.currentValue)} · tendance sur ${e.n} observations</small></div>`;
    }
    return `<div class="ls-stat" style="grid-column:1 / -1;"><div class="ls-stat-label">${escapeHtml(e.label)}</div>
      <div class="ls-chart-sub" style="margin-top:4px;">${e.notes.map(n=>escapeHtml(n)).join(" ")}</div></div>`;
  }).join("") + `</div>`;
}

function currentThemeMode(){

function applyTheme(mode){
  const root = document.documentElement;
  if(mode === "light") root.setAttribute("data-theme","light");
  else if(mode === "dark") root.setAttribute("data-theme","dark");
  else root.removeAttribute("data-theme");
  localStorage.setItem("loadscope-theme", mode);
  const labels = { system:"Automatique", light:"Clair", dark:"Sombre" };
  const btn = document.getElementById("btn-theme");
  if(btn) btn.textContent = "Thème : " + labels[mode];
  renderActiveTabCharts();
}
function cycleTheme(){
  const order = ["system","light","dark"];
  const next = order[(order.indexOf(currentThemeMode())+1) % order.length];
  applyTheme(next);
}
function cssVar(name){

function isDarkNow(){
  const mode = currentThemeMode();
  if(mode === "dark") return true;

    if(key2 !== "none" && key2 !== key1){ movedKeys.push(key2); movedValues.push(Number(simSlider2.value)); }
    const label1 = document.getElementById("sim-value-1");
    if(label1) label1.textContent = simFormatValue(key1, Number(simSlider1.value));
    const label2 = document.getElementById("sim-value-2");
    if(label2) label2.textContent = (key2!=="none") ? simFormatValue(key2, Number(simSlider2.value)) : "";
    const effects = simComputeEffects(simSeriesCache, simCurrentValues, movedKeys, movedValues);
    const out = document.getElementById("sim-results");
    if(out) out.innerHTML = simResultsHtml(effects);
  }
  if(simSel1 && simSlider1){
    simSel1.addEventListener("change", e=>{ simSetupSlider(e.target.value, simSlider1, document.getElementById("sim-value-1")); twinSimUpdate(); });
    simSlider1.addEventListener("input", twinSimUpdate);
  }
  if(simSel2 && simSlider2){
    simSel2.addEventListener("change", e=>{
      if(e.target.value !== "none") simSetupSlider(e.target.value, simSlider2, document.getElementById("sim-value-2"));
      else { simSlider2.disabled = true; const lbl2 = document.getElementById("sim-value-2"); if(lbl2) lbl2.textContent = ""; }
      twinSimUpdate();
    });
    simSlider2.addEventListener("input", twinSimUpdate);
  }
  twinSimUpdate();

  renderActiveTabCharts();
}

function acuteChronicLatest(sessions){

function buildInsight(sessions, lastACWR, cls){
  if(sessions.length < 5) return "Historique encore limité : ajoutez des séances pour obtenir une lecture fiable de la charge (l'ACWR se stabilise après environ 4 semaines de données).";
  if(cls.key === "none" || lastACWR == null) return "Pas encore assez d'historique pour calculer un ACWR fiable.";
  const { acute } = acwrSeries(sessions);
  const trend = acute.length >= 8 ? acute[acute.length-1] - acute[acute.length-8] : 0;
  const trendPct = acute[acute.length-8] > 0 ? (trend/acute[acute.length-8]*100) : 0;
  const trendTxt = trendPct > 15 ? `en hausse de ${trendPct.toFixed(0)}% sur 7 jours` : trendPct < -15 ? `en baisse de ${Math.abs(trendPct).toFixed(0)}% sur 7 jours` : "stable sur 7 jours";
  const msgs = {
    critical: `ACWR à ${lastACWR.toFixed(2)}, risque élevé. Charge ${trendTxt} — une hausse aussi rapide est associée à un risque accru de blessure. Envisager une semaine de décharge.`,
    serious: `ACWR à ${lastACWR.toFixed(2)}, zone de prudence. Charge ${trendTxt}. Surveiller la récupération avant d'augmenter encore le volume.`,
    good: `ACWR à ${lastACWR.toFixed(2)}, zone optimale. Charge ${trendTxt} — la progression actuelle est cohérente.`,
    warning: `ACWR à ${lastACWR.toFixed(2)}, sous la zone optimale. Charge ${trendTxt} — une reprise progressive limitera le risque lors du retour à un volume plus élevé.`,
    none: "Pas encore assez d'historique pour calculer un ACWR fiable."
  };
  return msgs[cls.key] || msgs.none;
}

// Plugins du donut "zones de FC — historique complet" : le temps total au
// centre, et une étiquette par zone avec sa ligne de rappel à l'extérieur —
// Chart.js ne fournit ni l'un ni l'autre nativement pour un doughnut.
const zoneDonutCenterTextPlugin = {
  id: "zoneDonutCenterText",
  afterDraw(chart){
    const text = chart.options.plugins?.centerText?.text;
    if(!text || chart.config.type !== "doughnut") return;
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.font = "700 19px Manrope, sans-serif";
    ctx.fillStyle = cssVar("--text-primary");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, (chartArea.left+chartArea.right)/2, (chartArea.top+chartArea.bottom)/2);
    ctx.restore();
  }
};
const zoneDonutLegendGapPlugin = {
  id: "zoneDonutLegendGap",
  // afterFit(legend) n'existe pas comme hook de plugin global dans Chart.js v4
  // (les hooks de plugin reçoivent (chart, args, options), jamais l'objet
  // legend directement) — donc ce hook n'était jamais appelé, d'où l'absence
  // totale d'effet. La technique fiable : surcharger legend.fit() elle-même,
  // depuis afterInit (chart.legend est déjà créé à ce stade).
  afterInit(chart){
    if(chart.config.type !== "doughnut") return;
    const legend = chart.legend;
    if(!legend || legend.__zoneDonutGapPatched) return;
    legend.__zoneDonutGapPatched = true;
    const originalFit = legend.fit;
    legend.fit = function(){
      originalFit.call(this);
      this.height += 26;
    };
  }
};
const zoneDonutLeaderLabelsPlugin = {
  id: "zoneDonutLeaderLabels",
  afterDraw(chart){
    if(chart.config.type !== "doughnut") return;
    const meta = chart.getDatasetMeta(0);
    if(!meta || !meta.data.length) return;
    const values = chart.data.datasets[0].data;
    const total = values.reduce((a,b)=>a+(b||0),0);
    if(total <= 0) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = "600 11.5px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.strokeStyle = cssVar("--axis");
    ctx.fillStyle = cssVar("--text-secondary");
    ctx.lineWidth = 1;
    meta.data.forEach((arc, i)=>{
      const value = values[i];
      if(!value) return;
      const pct = value/total*100;
      const angle = (arc.startAngle + arc.endAngle)/2;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const cx = arc.x, cy = arc.y, rOuter = arc.outerRadius;
      const x1 = cx + cos*rOuter, y1 = cy + sin*rOuter;
      const x2 = cx + cos*(rOuter+18), y2 = cy + sin*(rOuter+18);
      const side = cos >= -0.001 ? 1 : -1;
      const x3 = x2 + side*12, y3 = y2;
      ctx.beginPath();
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
      ctx.stroke();
      ctx.textAlign = side>0 ? "left" : "right";
      ctx.textBaseline = "middle";
      const pctTxt = pct.toFixed(2).replace(".",",");
      ctx.fillText(`Zone ${i+1} (${pctTxt} %)`, x3 + side*4, y3);
    });
    ctx.restore();
  }
};

function renderActiveTabCharts(){
  if(!state) return;
  const athlete = state.athletes.find(a=>a.id===activeAthleteId);
  if(!athlete){ destroyCharts(); return; }
  if(activeTab === "training"){
    renderCharts();

    destroyCharts();
    const envSessions = state.sessions.filter(s=>s.athleteId===athlete.id && s.source==="strava");

  } else {
    destroyCharts();
  }

function renderChartsInner(athlete){
  const sessions = state.sessions.filter(s=>s.athleteId===athlete.id);
  const { dates, acute, chronic, acwr } = acwrSeries(sessions);
  const daily = dailySeries(sessions);
  const dailyVals = dates.map(d=>daily[d]||0);
  const color = athleteColor(athlete);

  ensureChartPeriod();
  const periodStartStr = chartPeriod.start, periodEndStr = chartPeriod.end;
  const periodStart = new Date(periodStartStr+"T00:00:00");
  const periodEnd = new Date(periodEndStr+"T00:00:00");
  const oldLabel = fmtDateFr(periodStart), newLabel = fmtDateFr(periodEnd);

  // Slice les séries journalières (Charge / ACWR) sur la période choisie
  // plutôt que sur une fenêtre glissante fixe.
  let si = dates.findIndex(d=> d >= periodStartStr);
  if(si === -1) si = dates.length;
  let ei = dates.length - 1;
  while(ei >= 0 && dates[ei] > periodEndStr) ei--;
  const sl = arr => (si <= ei) ? arr.slice(si, ei+1) : [];
  const labels = sl(dates).map(d=> fmtDayMonth(d));

  const matrixWrap = document.getElementById("matrix-chart-wrap");
  const matrixNote = document.getElementById("matrix-note");
  const cmpWindowWeeks = comparisonWindowWeeksFor(periodStart, periodEnd);
  const histories = buildMatrixHistories(sessions, dates, chronic, acwr, cmpWindowWeeks);
  const scoresNow = matrixScoresAt(sessions, dates, chronic, acwr, periodEnd, histories, cmpWindowWeeks);
  const scoresPast = matrixScoresAt(sessions, dates, chronic, acwr, periodStart, histories, cmpWindowWeeks);
  const hasAnyScore = scoresNow.some(v=>v!=null);
  if(hasAnyScore && matrixWrap){
    const missing = MATRIX_BRANCHES.filter((_,i)=>scoresNow[i]==null);
    matrixNote.textContent = missing.length
      ? `Historique encore insuffisant pour : ${missing.join(", ")} — ces branches s'affichent à 0 en attendant plus de séances Strava.`
      : "";
    charts.matrix = new Chart(document.getElementById("chart-matrix"), {
      type:"radar",
      data:{ labels: MATRIX_BRANCHES, datasets:[
        { label: oldLabel, data: scoresPast.map(v=>v??0), borderColor: cssVar("--text-muted"), backgroundColor: cssVar("--text-muted")+"22", borderWidth:2, borderDash:[4,3], pointRadius:2, pointBackgroundColor: cssVar("--text-muted") },
        { label: newLabel, data: scoresNow.map(v=>v??0), borderColor: color, backgroundColor: color+"33", borderWidth:2, pointRadius:3, pointBackgroundColor: color }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color: cssVar("--text-muted"), font:{family:"Manrope", size:11}, boxWidth:10, boxHeight:10, usePointStyle:true } },
          tooltip:{ backgroundColor: cssVar("--surface"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-secondary"),
            borderColor: cssVar("--border"), borderWidth:1, padding:10 } },
        scales:{ r:{ min:0, max:100, ticks:{ display:false, stepSize:25 }, grid:{ color: cssVar("--grid") }, angleLines:{ color: cssVar("--grid") },
          pointLabels:{ color: cssVar("--text-secondary"), font:{family:"Manrope", size:11.5, weight:600} } } }
      }
    });
  } else if(matrixWrap){
    matrixWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">Aucune donnée pour le moment — nécessite un historique de séances (idéalement importées depuis Strava) pour calculer les 6 branches.</div>';
    if(matrixNote) matrixNote.textContent = "";
  }

  charts.load = new Chart(document.getElementById("chart-load"), {
    type:"bar",
    data:{ labels, datasets:[
      { type:"bar", label:"Charge quotidienne", data: sl(dailyVals), backgroundColor: color+"55", borderRadius:3, order:3 },
      { type:"line", label:"Aiguë (7j)", data: sl(acute), borderColor: cssVar("--serious"), backgroundColor:"transparent", tension:.3, pointRadius:0, borderWidth:2, order:1 },
      { type:"line", label:"Chronique (28j)", data: sl(chronic), borderColor: cssVar("--text-primary"), backgroundColor:"transparent", tension:.3, pointRadius:0, borderWidth:2, borderDash:[4,3], order:2 }
    ]},
    options: baseChartOptions({ scales:{ y:{ title:{display:true,text:"u.a. / jour", color:cssVar("--text-muted"), font:{size:10}}, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } } })
  });

  const acwrColors = sl(acwr).map(v => v==null? cssVar("--text-muted") : cssVar(statusVar(classifyACWR(v).key)));
  charts.acwr = new Chart(document.getElementById("chart-acwr"), {
    type:"line",
    data:{ labels, datasets:[
      { label:"ACWR", data: sl(acwr), borderColor: cssVar("--accent"), backgroundColor:"transparent", borderWidth:2, pointRadius:2,
        pointBackgroundColor: acwrColors, spanGaps:true,
        segment:{ borderColor: ctx => {
          const v = ctx.p1.parsed.y; if(v==null) return cssVar("--text-muted");
          return cssVar(statusVar(classifyACWR(v).key));
        }}
      }
    ]},
    options: baseChartOptions({
      plugins:{ legend:{display:false} },
      scales:{ y:{ suggestedMin:0, suggestedMax:2, grid:{color:cssVar("--grid")}, ticks:{color:cssVar("--text-muted")} } }
    })
  });

  const weeks = weeklyAggregates(sessions, periodStartStr, periodEndStr);
  const wkLabels = weeks.map(w=> fmtDayMonth(w.week));

  // Kilométrage hebdomadaire empilé par type d'activité — une barre par
  // semaine, un segment de couleur par catégorie ; la légende (cliquable)
  // permet de masquer une catégorie, et le survol détaille chaque segment.
  const volByWeek = weeklyKmByCategory(sessions, periodStartStr, periodEndStr);
  charts.volume = new Chart(document.getElementById("chart-volume"), {
    type:"bar",
    data:{ labels: wkLabels, datasets: VOLUME_CATEGORIES.map(c=>({
      label: c.label,

  });

  // Le dénivelé n'a de sens que pour la course à pied et le vélo — musculation,
  // ski et le reste sont écartés du graphique (demande du coach).
  const ELEVATION_CATEGORIES = VOLUME_CATEGORIES.filter(c => c.key==="course" || c.key==="velo");
  const elevByWeek = weeklyElevationByCategory(sessions, periodStartStr, periodEndStr);

  charts.elevationMinus = new Chart(document.getElementById("chart-elevation-minus"), {
    type:"bar",
    data:{ labels: wkLabels, datasets: elevDatasets("dMinus") },
    options: elevOptions
  });

  const zoneColors = [cssVar("--z1"),cssVar("--z2"),cssVar("--z3"),cssVar("--z4"),cssVar("--z5")];
  charts.zones = new Chart(document.getElementById("chart-zones"), {
    type:"bar",
