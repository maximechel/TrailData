/* ---------------------------- Strava connect ---------------------------- */

// "flow" encodé dans le state OAuth pour que strava-callback sache où
// rediriger une fois l'autorisation Strava accordée : "self" = l'athlète est
// devant CET écran coach (connectStrava, cas rare) → retour au tableau de
// bord coach ; "remote" = lien envoyé à l'athlète pour son propre appareil
// (copyStravaLink, cas courant) → retour vers son espace personnel
// (client.html), jamais vers le tableau de bord coach qui lui demanderait
// une clé qu'il ne doit pas avoir. Bug corrigé le 2026-09-19 : avant ça, les
// deux flux redirigeaient vers le tableau de bord coach.
function buildStravaAuthUrl(athleteId, flow){
  const params = new URLSearchParams({
    client_id: STRAVA_CLIENT_ID,
    response_type: "code",
    redirect_uri: STRAVA_REDIRECT_URI,
    approval_prompt: "auto",
    scope: "activity:read_all",
    state: athleteId + ":" + (flow || "remote")
  });
  return "https://www.strava.com/oauth/authorize?" + params.toString();
}

// Déclenche l'envoi par Supabase Auth de l'email de connexion (lien magique)
// à l'adresse renseignée sur la fiche de l'athlète, avec la même URL de
// redirection que le formulaire de connexion de client.html -- évite au
// coach de devoir copier/coller le lien de la page et de le transmettre à la
// main (SMS, etc). Utilise uniquement la clé publique (anon) : aucune
// authentification requise pour demander un lien de connexion.
async function sendPortalLink(athlete){
  if(!athlete.email) return;
  const btn = document.getElementById("btn-send-portal-link");
  if(btn) btn.disabled = true;
  try{
    const res = await fetch(SUPABASE_URL + "/auth/v1/otp?redirect_to=" + encodeURIComponent(CLIENT_PORTAL_URL), {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ email: athlete.email })
    });
    if(!res.ok){
      let msg = "Erreur (" + res.status + ")";
      try{ const j = await res.json(); if(j.msg) msg = j.msg; else if(j.error_description) msg = j.error_description; }catch(e){}
      throw new Error(msg);
    }
    showToast("Lien de connexion envoyé à " + athlete.email, "--good");
  }catch(err){
    showToast("Envoi impossible : " + err.message, "--critical");
  }finally{
    if(btn) btn.disabled = false;
  }
}

// À utiliser uniquement quand c'est l'athlète lui-même qui est devant cet écran
// (ex. sur son propre téléphone) : ça l'envoie directement vers Strava pour
// autoriser SON compte. Le coach ne doit jamais cliquer ceci pour un autre
// athlète depuis son propre navigateur, sinon c'est le compte Strava du coach
// qui serait connecté à la fiche de cet athlète.
function connectStrava(athleteId){
  localStorage.setItem(ACTIVE_ATHLETE_STORAGE, athleteId);
  window.location.href = buildStravaAuthUrl(athleteId, "self");
}

// À utiliser par le coach pour connecter un athlète qui n'est pas devant cet
// écran : copie un lien personnel à lui envoyer (SMS, WhatsApp, email...).
// L'athlète l'ouvre sur son propre appareil, se connecte avec SON compte
// Strava, et revient automatiquement sur DATAS Trail running une fois autorisé.
// Tente une copie presse-papiers directe (fonctionne souvent, surtout sur
// mobile) ; mais affiche toujours le lien dans une fenêtre avec un champ
// sélectionnable, quoi qu'il arrive — jamais de dépendance à window.prompt()
// (bloqué dans certains contextes, notamment webviews/PWA) qui laisserait le
// clic ne rien faire de visible en cas d'échec silencieux de la copie auto.
async function copyStravaLink(athleteId){
  const athlete = state.athletes.find(a=>a.id===athleteId);
  const link = buildStravaAuthUrl(athleteId, "remote");
  let autoCopied = false;
  try{ await navigator.clipboard.writeText(link); autoCopied = true; }catch(e){ /* on retente depuis la fenêtre */ }
  showStravaLinkModal(athlete, link, autoCopied);
}

function showStravaLinkModal(athlete, link, autoCopied){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="ls-modal-overlay" id="strava-link-overlay">
    <div class="ls-modal">
      <h3>Lien Strava pour ${escapeHtml(athlete.name)}</h3>
      <div class="ls-modal-sub">${autoCopied? "Lien copié dans le presse-papiers — envoyez-le par SMS, WhatsApp ou email." : "Copie automatique indisponible sur ce navigateur : cliquez sur « Copier », ou sélectionnez le texte ci-dessous et copiez-le manuellement (Ctrl/Cmd+C)."} L'athlète l'ouvre sur son propre appareil, se connecte avec son compte Strava, et revient automatiquement connecté.</div>
      <div class="ls-field">
        <label>Lien personnel (usage unique par athlète)</label>
        <input type="text" id="strava-link-input" readonly value="${escapeHtml(link)}">
      </div>
      <div class="ls-modal-actions">
        <button type="button" class="ls-btn ghost" id="strava-link-close">Fermer</button>
        <button type="button" class="ls-btn primary" id="strava-link-copy">Copier le lien</button>
      </div>
    </div>
  </div>`;
  const input = document.getElementById("strava-link-input");
  input.addEventListener("click", ()=> input.select());
  input.focus(); input.select();
  document.getElementById("strava-link-close").addEventListener("click", closeModal);
  document.getElementById("strava-link-overlay").addEventListener("click", e=>{ if(e.target.id==="strava-link-overlay") closeModal(); });
  document.getElementById("strava-link-copy").addEventListener("click", async ()=>{
    input.select();
    try{
      await navigator.clipboard.writeText(link);
      showToast("Lien copié.", "--good");
    }catch(e){
      try{
        if(document.execCommand("copy")) showToast("Lien copié.", "--good");
        else throw new Error("execCommand a échoué");
      }catch(e2){
        showToast("Copie automatique indisponible — le texte est sélectionné, copiez-le avec Ctrl/Cmd+C.", "--warning");
      }
    }
  });
}

// Va chercher chez Strava les séances plus anciennes que l'import automatique
// initial (strava-callback, côté serveur, ne remonte qu'un premier lot à la
// connexion — voir son commentaire). Appelle la même fonction serveur que le
// coach peut aussi déclencher en ligne de commande (strava-import-history) :
// reprenable et idempotente (upsert sur strava_activity_id), donc on peut
// relancer plusieurs lots d'affilée sans risque de doublons. Strava limite
// les appels API à 100 toutes les 15 minutes, PARTAGÉS entre tous les
// athlètes connectés à l'appli — un historique profond peut donc nécessiter
// plusieurs lots ; la fonction serveur le signale (rate_limited) plutôt que
// d'échouer, et on relance automatiquement tant qu'elle répond juste "pas
// encore fini" (done:false) sans être bridée par Strava.
async function importStravaHistory(athleteId, btn){
  const key = localStorage.getItem(COACH_KEY_STORAGE) || "";
  const originalLabel = btn ? btn.textContent : "";
  if(btn) btn.disabled = true;
  let totalImported = 0, totalSkipped = 0, round = 0;
  try{
    while(true){
      round++;
      if(btn) btn.textContent = round===1 ? "Import en cours…" : `Import en cours (lot ${round})…`;
      let res;
      try{
        res = await fetch(STRAVA_IMPORT_HISTORY_URL, {
          method: "POST",
          headers: { "Content-Type":"application/json", "x-coach-key": key },
          body: JSON.stringify({ athlete_id: athleteId }),
        });
      }catch(e){
        throw new Error("Connexion au serveur impossible. Vérifiez votre connexion internet.");
      }
      if(res.status === 401){
        localStorage.removeItem(COACH_KEY_STORAGE);
        const err = new Error("Clé d'accès invalide ou expirée.");
        err.unauthorized = true;
        throw err;
      }
      let data = null;
      try{ data = await res.json(); }catch(e){ /* réponse non-JSON */ }
      if(!res.ok){
        throw new Error((data && data.error) || ("Erreur serveur (" + res.status + ")"));
      }
      totalImported += (data && data.imported) || 0;
      totalSkipped += (data && data.skipped) || 0;
      if(data && data.done){
        showToast("Historique Strava importé : " + totalImported + " séance(s)" + (totalSkipped ? ", " + totalSkipped + " ignorée(s)" : "") + ".", "--good");
        break;
      }
      if(data && data.rate_limited){
        showToast("Limite Strava atteinte pour l'instant (" + totalImported + " séance(s) importée(s) jusque-là) — recliquez dans ~15 minutes pour continuer.", "--warning");
        break;
      }
      await new Promise(r=>setTimeout(r, 500));
    }
  }catch(err){
    if(err.unauthorized) showKeyGate("Clé invalide, réessayez.");
    else showToast("Import impossible : " + err.message, "--critical");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

function handleStravaRedirectParam(){
  const url = new URL(window.location.href);
  const flag = url.searchParams.get("strava");
  if(!flag) return;
  url.searchParams.delete("strava");
  history.replaceState({}, "", url.pathname + (url.search? url.search : "") + url.hash);
  const messages = {
    connected: { css:"--good", text:"Compte Strava connecté. Les dernières séances (30 jours) sont en cours d'import — actualisez dans quelques instants si elles n'apparaissent pas encore." },
    denied: { css:"--warning", text:"Connexion Strava annulée : l'autorisation n'a pas été accordée." },
    unknown_athlete: { css:"--critical", text:"Connexion Strava impossible : athlète introuvable côté serveur." },
    error: { css:"--critical", text:"Une erreur est survenue lors de la connexion à Strava. Réessayez." }
  };
  const m = messages[flag];
  if(m) showToast(m.text, m.css);
}

function showToast(text, cssVarName){
  const root = document.getElementById("toast-root");
  if(!root) return;
  root.innerHTML = `<div class="ls-toast" style="border-left-color:var(${cssVarName||"--accent"})">
    <span>${escapeHtml(text)}</span>
    <button type="button" id="toast-close" aria-label="Fermer">✕</button>
  </div>`;
  const close = document.getElementById("toast-close");
  if(close) close.addEventListener("click", ()=>{ root.innerHTML = ""; });
}

/* ---------------------------- domain calculations ---------------------------- */

function trimp(session){
  const z = session.zones;
  const base = z[0]*1 + z[1]*2 + z[2]*3 + z[3]*4 + z[4]*5;
  // Pondère la charge par la technicité du terrain (même coefficient que le
  // GAP -- voir technicityCoef) : à profil de FC identique, un terrain
  // technique impose un coût neuromusculaire/attentionnel que la FC seule
  // sous-représente (rythme haché, freinage excentrique en descente...). Cette
  // pondération se répercute automatiquement sur charge aiguë/chronique, ACWR
  // et Forme/Fatigue (CTL/ATL), qui dérivent tous de trimp(). Heuristique de
  // coach -- coefficients calibrés à dire d'expert, pas une formule validée
  // par la littérature -- voir échange du 2026-09-22.
  return base * technicityCoef(session.technicity);
}

function dailySeries(sessions){
  // returns { "YYYY-MM-DD": trimpTotal }
  const map = {};
  sessions.forEach(s => { map[s.date] = (map[s.date]||0) + trimp(s); });
  return map;
}

function dateRangeDays(startISO, endISO){
  const out = [];
  let d = new Date(startISO);
  const end = new Date(endISO);
  while(d <= end){ out.push(fmtDate(d)); d.setDate(d.getDate()+1); }
  return out;
}

function rollingAvg(orderedDates, map, index, window){
  let sum = 0, n = 0;
  for(let k = index; k > index - window && k >= 0; k--){
    sum += map[orderedDates[k]] || 0; n++;
  }
  return n ? sum / window : 0;
}

function acwrSeries(sessions){
  if(sessions.length === 0) return { dates:[], acute:[], chronic:[], acwr:[], ctl:[], atl:[], tsb:[] };
  const map = dailySeries(sessions);
  const sorted = sessions.map(s=>s.date).sort();
  const start = sorted[0];
  const end = fmtDate(new Date());
  const dates = dateRangeDays(start, end);
  const acute = [], chronic = [], acwr = [];
  // Forme (CTL) / Fatigue (ATL) : moyennes mobiles EXPONENTIELLES du même TRIMP
  // quotidien que acute/chronic ci-dessus (constantes 42j/7j -- convention
  // Coggan/TrainingPeaks, voir échange du 2026-09-22), à ne pas confondre avec
  // les moyennes glissantes simples utilisées par l'ACWR. Comme toute EWMA,
  // elles démarrent à 0 au premier jour d'historique connu de l'athlète : les
  // premières semaines sous-estiment donc la charge réelle, le temps que la
  // moyenne "monte en régime" -- même limite que côté TrainingPeaks/Suunto.
  const ctl = [], atl = [], tsb = [];
  let ctlPrev = 0, atlPrev = 0;
  dates.forEach((d, i) => {
    const a = rollingAvg(dates, map, i, 7);
    const c = rollingAvg(dates, map, i, 28);
    acute.push(a); chronic.push(c);
    // Sous 14 jours d'historique, le ratio est trop instable pour être affiché.
    acwr.push(c > 0.5 && i >= 13 ? a/c : null);
    // TSB du jour = écart Forme/Fatigue AVANT la charge du jour lui-même
    // (convention standard : la séance du jour n'a pas encore pu influencer sa
    // propre fraîcheur).
    // TSB exprimé en % de la Forme (CTL) plutôt qu'en écart absolu :
    // les seuils de lecture (15/-10/-30) viennent de Suunto/TrainingPeaks,
    // calibrés sur leur propre échelle de TSS (~100 = 1h à l'allure seuil).
    // La charge de cette appli (TRIMP pondéré par la technicité, voir trimp())
    // est sur une tout autre échelle numérique -- un écart CTL-ATL brut y est
    // couramment de plusieurs centaines, ce qui rendait les mêmes seuils
    // absurdes (quasi tout l'historique en "intensité trop élevée"). En
    // ramenant l'écart à un % de la Forme du moment, les mêmes seuils
    // redeviennent interprétables quelle que soit l'unité de charge sous-
    // jacente (voir échange du 2026-09-23).
    tsb.push(i === 0 || ctlPrev <= 0 ? null : ((ctlPrev - atlPrev) / ctlPrev) * 100);
    const load = map[d] || 0;
    const ctlToday = ctlPrev + (load - ctlPrev) / 42;
    const atlToday = atlPrev + (load - atlPrev) / 7;
    ctl.push(ctlToday); atl.push(atlToday);
    ctlPrev = ctlToday; atlPrev = atlToday;
  });
  return { dates, acute, chronic, acwr, ctl, atl, tsb };
}

// Valeur d'une série alignée sur `dates` (voir acwrSeries) au dernier jour
// connu <= targetDate -- permet de lire Forme/Fatigue "à la fin de la
// période sélectionnée" plutôt que toujours "aujourd'hui" quand le coach
// change la période du graphique. Les courbes elles-mêmes restent calculées
// sur tout l'historique (une moyenne exponentielle ne peut pas être
// recalculée seulement sur une fenêtre sans perdre la charge accumulée
// avant) ; seule la lecture ponctuelle des badges suit la période.
function valueAtOrBefore(dates, arr, targetDate){
  if(!dates.length) return null;
  for(let i = dates.length - 1; i >= 0; i--){
    if(dates[i] <= targetDate) return arr[i];
  }
  return arr[0];
}

function classifyACWR(v){
  if(v == null || !isFinite(v)) return { key:"none", label:"Pas assez d'historique", css:"--text-muted" };
  if(v < 0.8) return { key:"warning", label:"Sous-charge" };
  if(v <= 1.3) return { key:"good", label:"Zone optimale" };
  if(v <= 1.5) return { key:"serious", label:"Prudence" };
  return { key:"critical", label:"Risque élevé" };
}

// Seuils de lecture du TSB (Training Stress Balance = CTL - ATL, voir
// acwrSeries) -- convention standard popularisée par TrainingPeaks/Coggan
// (Performance Management Chart), reprise telle quelle par la plupart des
// plateformes grand public (Suunto, Garmin...) : ce ne sont pas des seuils
// propriétaires, juste la lecture usuelle du même calcul. Demandé par
// Maxime le 2026-09-23 pour afficher un graphique "Forme (TSB)" équivalent
// à celui de Suunto entre Forme/Fatigue et ACWR.
function classifyTSB(v){
  if(v == null || !isFinite(v)) return { key:"none", label:"Pas assez d'historique" };
  if(v >= 15) return { key:"warning", label:"Perdre la forme ou récupérer" };
  if(v >= -10) return { key:"good", label:"Équilibre d'entraînement" };
  if(v >= -30) return { key:"serious", label:"Entraînement productif" };
  return { key:"critical", label:"Intensité trop élevée" };
}

function addDaysISO(dateISO, delta){
  const d = new Date(dateISO+"T00:00:00");
  d.setDate(d.getDate()+delta);
  return fmtDate(d);
}

// Corrige la zone "perte de forme / récupérer" du TSB (ambiguë en soi : un
// TSB haut peut aussi bien être un affûtage volontaire qu'un désentraînement
// subi) en la croisant avec le volume réellement couru sur la période
// sélectionnée. Règle donnée par Maxime le 2026-09-23 : si le volume moyen
// hebdo de la période est en baisse de plus de 50 % par rapport au volume
// moyen hebdo des 4 semaines qui précèdent la période, c'est un
// désentraînement (couleur inchangée -- toujours à surveiller) ; sinon
// c'est un affûtage réussi, donc un état de forme jugé excellent (couleur
// verte, comme la zone d'équilibre). Les autres zones (équilibre,
// entraînement productif, intensité trop élevée) ne sont pas ambiguës et
// gardent leur classification TSB brute.
function classifyTSBWithVolume(tsbNow, sessions, periodStart, periodEnd){
  const base = classifyTSB(tsbNow);
  if(base.key !== "warning") return base;
  const periodKm = sessions.reduce((sum,s)=> (s.date>=periodStart && s.date<=periodEnd) ? sum+(s.distance||0) : sum, 0);
  const periodDays = dateRangeDays(periodStart, periodEnd).length;
  const periodAvgWeeklyKm = periodDays>0 ? periodKm / periodDays * 7 : 0;
  const baselineEnd = addDaysISO(periodStart, -1);
  const baselineStart = addDaysISO(periodStart, -28);
  const baselineKm = sessions.reduce((sum,s)=> (s.date>=baselineStart && s.date<=baselineEnd) ? sum+(s.distance||0) : sum, 0);
  const baselineAvgWeeklyKm = baselineKm / 4;
  if(baselineAvgWeeklyKm <= 0) return base; // pas assez d'historique avant la période pour comparer
  const drop = 1 - (periodAvgWeeklyKm / baselineAvgWeeklyKm);
  if(drop > 0.5){
    return { key:"warning", label:"Désentraînement (volume en baisse de plus de 50 % sur 4 semaines)" };
  }
  return { key:"good", label:"Affûtage réussi (volume maintenu, forme fraîche)" };
}

function isoMonday(dateStr){
  const d = new Date(dateStr);
  const day = (d.getDay() + 6) % 7; // 0 = monday
  d.setDate(d.getDate() - day);
  return fmtDate(d);
}

// Agrège les séances par semaine (lundi au dimanche) sur la période
// [startISO, endISO] (bornes incluses).
function weeklyAggregates(sessions, startISO, endISO){
  const byWeek = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const wk = isoMonday(s.date);
    if(!byWeek[wk]) byWeek[wk] = { week: wk, km:0, dPlus:0, dMinus:0, zones:[0,0,0,0,0], paceZones:[0,0,0,0,0,0,0], hasPaceData:false, count:0 };
    const b = byWeek[wk];
    b.km += s.distance; b.dPlus += s.dPlus; b.dMinus += s.dMinus; b.count++;
    s.zones.forEach((m,i)=> b.zones[i]+=m);
    if(Array.isArray(s.paceZones)){ b.hasPaceData = true; s.paceZones.forEach((m,i)=> b.paceZones[i]+=m); }
  });
  return Object.values(byWeek).sort((a,b)=> a.week < b.week ? -1 : 1);
}

// Comme weeklyAggregates, mais retourne le kilométrage par semaine ET par
// catégorie (VOLUME_CATEGORIES) — sert au graphique Volume empilé.
function weeklyKmByCategory(sessions, startISO, endISO){
  const byWeek = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const wk = isoMonday(s.date);
    if(!byWeek[wk]) byWeek[wk] = {};
    const cat = volumeCategoryOf(s.type);
    byWeek[wk][cat] = (byWeek[wk][cat]||0) + s.distance;
  });
  return byWeek;
}

// Comme weeklyKmByCategory, mais pour le dénivelé positif/négatif — sert au
// graphique Dénivelé empilé par activité.
function weeklyElevationByCategory(sessions, startISO, endISO){
  const byWeek = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const wk = isoMonday(s.date);
    if(!byWeek[wk]) byWeek[wk] = {};
    const cat = volumeCategoryOf(s.type);
    if(!byWeek[wk][cat]) byWeek[wk][cat] = { dPlus:0, dMinus:0 };
    byWeek[wk][cat].dPlus += (s.dPlus||0);
    byWeek[wk][cat].dMinus += (s.dMinus||0);
  });
  return byWeek;
}

// Comme weeklyKmByCategory, mais par mois calendaire (clé "année-mois",
// mois 0-indexé) — sert au graphique Volume hebdomadaire, passé en
// agrégation mensuelle (demande du coach du 2026-09-23).
function monthlyKmByCategory(sessions, startISO, endISO){
  const byMonth = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const d = new Date(s.date+"T00:00:00");
    const key = d.getFullYear()+"-"+d.getMonth();
    if(!byMonth[key]) byMonth[key] = {};
    const cat = volumeCategoryOf(s.type);
    byMonth[key][cat] = (byMonth[key][cat]||0) + s.distance;
  });
  return byMonth;
}
// Comme weeklyElevationByCategory, mais par mois calendaire — sert au
// graphique Dénivelé hebdomadaire, même bascule mensuelle.
function monthlyElevationByCategory(sessions, startISO, endISO){
  const byMonth = {};
  sessions.forEach(s => {
    if(s.date < startISO || s.date > endISO) return;
    const d = new Date(s.date+"T00:00:00");
    const key = d.getFullYear()+"-"+d.getMonth();
    if(!byMonth[key]) byMonth[key] = {};
    const cat = volumeCategoryOf(s.type);
    if(!byMonth[key][cat]) byMonth[key][cat] = { dPlus:0, dMinus:0 };
    byMonth[key][cat].dPlus += (s.dPlus||0);
    byMonth[key][cat].dMinus += (s.dMinus||0);
  });
  return byMonth;
}

/* ---------------------------- Rapport environnemental (réplique Enduraw) ---------------------------- */
// Facteurs déjà calculés côté serveur (strava-webhook / strava-backfill-gap :
// chaleur WBGT, altitude, vent — voir commentaires de colonnes sur
// public.sessions) et stockés par séance Strava. Cette section ne fait que
// les résumer et les afficher ; aucun calcul environnemental côté client.

// Sévérité du facteur combiné, mêmes clés que classifyACWR (réutilise les
// mêmes couleurs --good/--warning/--serious/--critical déjà définies pour
// l'ACWR, pour rester cohérent visuellement dans toute l'appli).
function envSeverity(f){
  if(f == null) return { key:"none", label:"—" };
  if(f < 0.08) return { key:"good", label:"Faible" };
  if(f < 0.18) return { key:"warning", label:"Modéré" };
  if(f < 0.30) return { key:"serious", label:"Marqué" };
  return { key:"critical", label:"Fort" };
}

// Facteur de ralentissement lié au terrain — recalibré le 2026-09-18 pour
// utiliser le même calcul que rapport-seance.html : s.envSlopeCostRatio
// (ratio moyen coût Minetti pente réelle / coût à plat, pondéré par la
// distance parcourue à chaque point du flux GPS, calculé côté serveur par
// strava-webhook/strava-backfill-gap — voir leurs commentaires) multiplié
// par le coefficient de technicité de surface saisi par le coach (un seul
// champ désormais, voir TECHNICITY_COEFFICIENTS — avant le 2026-09-18 il y
// avait 3 champs montée/descente/plat, combinés avec 6 tranches de temps
// envGradeTimeShares ; la pente est maintenant gérée point par point par le
// calcul Minetti lui-même, donc un seul niveau de technicité de surface
// suffit). Calculé ici plutôt que stocké en base : contrairement à la météo
// (figée à l'import), la technicité peut être modifiée après coup en éditant
// la séance, donc ce facteur doit toujours refléter sa valeur actuelle.
function envTerrainFactor(s){
  if(s.envSlopeCostRatio == null) return null;
  const coef = technicityCoef(s.technicity);
  return (coef * s.envSlopeCostRatio) - 1;
}

// Facteur combiné météo + terrain (mêmes formules que côté serveur pour la
// météo : produit des (1+facteur) moins 1), avec le facteur terrain calculé
// dynamiquement ci-dessus. Se rabat sur le facteur météo seul si le terrain
// n'a pas pu être calculé (flux insuffisants). Plafonné à ±120% — même
// garde-fou que rapport-seance.html (COMBINED_FACTOR_CAP), pour les profils
// de séance atypiques plutôt qu'une correction qui s'envole.
const ENV_COMBINED_FACTOR_CAP = 1.20;
function envCombinedWithTerrain(s){
  if(s.envCombinedFactor == null) return null;
  const terrain = envTerrainFactor(s);
  const raw = terrain == null ? s.envCombinedFactor : (1+s.envCombinedFactor)*(1+terrain) - 1;
  return Math.max(-ENV_COMBINED_FACTOR_CAP, Math.min(ENV_COMBINED_FACTOR_CAP, raw));
}
function envAdjustedDurationWithTerrain(s){
  if(s.duration == null) return s.envAdjustedDuration;
  const combined = envCombinedWithTerrain(s);
  if(combined == null) return s.envAdjustedDuration;
  return s.duration/(1+combined);
}

// Résumé du rapport environnemental sur une fenêtre glissante de `weeks`
// semaines se terminant à `endDate` — uniquement les séances Strava pour
// lesquelles le calcul a abouti (flux GPS + météo historique disponibles).
// count = 0 si aucune séance éligible sur la période (renvoie alors un objet
// minimal, à tester avant de lire les autres champs).
function envSummaryFor(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  const eligible = sessions.filter(s=>{
    if(s.envCombinedFactor == null) return false;
    const d = new Date(s.date+"T00:00:00");
    return !isNaN(d) && d >= start && d <= endDate;
  });
  if(eligible.length === 0) return { count:0 };
  const avg = arr => arr.reduce((a,b)=>a+b,0) / arr.length;
  const combined = eligible.map(envCombinedWithTerrain);
  return {
    count: eligible.length,
    avgTemp: avg(eligible.map(s=>s.envTempC)),
    avgCombined: avg(combined),
    markedCount: combined.filter(v=>v >= 0.18).length,
  };
}

function envFmtPct(f){ return f==null ? "—" : (f>=0?"+":"") + Math.round(f*100) + "%"; }
function envFmtNum(v, unit, digits){ return v==null ? "—" : v.toFixed(digits!=null?digits:0) + unit; }

function envRowHtml(s){
  const combined = envCombinedWithTerrain(s);
  const adjustedDuration = envAdjustedDurationWithTerrain(s);
  const sev = envSeverity(combined);
  return `<tr>
    <td>${fmtDateFr(s.date)}</td>
    <td>${escapeHtml(s.type)}</td>
    <td>${fmtHoursMinutes(s.duration)}</td>
    <td>${adjustedDuration!=null ? fmtHoursMinutes(adjustedDuration) : "—"}</td>
    <td>${envFmtNum(s.envTempC,"°C",1)}</td>
    <td>${envFmtNum(s.envHumidityPct,"%",0)}</td>
    <td>${envFmtNum(s.envMeanAltitudeM,"m",0)}</td>
    <td>${envFmtNum(s.envWindMs,"m/s",1)}</td>
    <td>${envFmtPct(s.envHeatFactor)}</td>
    <td>${envFmtPct(s.envAltitudeFactor)}</td>
    <td>${envFmtPct(s.envWindFactor)}</td>
    <td>${envFmtPct(envTerrainFactor(s))}</td>
    <td><span class="ls-status-pill" style="background:var(${statusVar(sev.key)});color:${statusInk(sev.key)}">${envFmtPct(combined)}</span></td>
  </tr>`;
}

// Moyenne GAP par zone de FC sur un sous-ensemble de séances déjà filtré
// (ex : un mois calendaire) plutôt que sur
// une fenêtre glissante — sert au graphique "Efficacité physiologique", qui
// trace une courbe par mois plutôt qu'un simple avant/après.
function gapZoneAverageOf(sessionsSubset){
  const sums = [0,0,0,0,0], counts = [0,0,0,0,0];
  // Corrigé par la technicité du terrain (même coefficient et même logique
  // que gapGradeAverageInRange / "Profil terrain" -- voir échange du
  // 2026-09-22) : sans ça, un bloc de sorties techniques ferait baisser la
  // courbe même sans réelle perte de moteur aérobie.
  sessionsSubset.forEach(s=>{
    if(!Array.isArray(s.gapByHrZone)) return;
    const c = technicityCoef(s.technicity);
    s.gapByHrZone.forEach((v,i)=>{ if(v!=null){ sums[i]+=v*c; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}

// Liste des mois calendaires (année + mois 0-indexé) couverts par
// [periodStart, periodEnd], bornes incluses.
function monthsBetween(periodStart, periodEnd){
  const months = [];
  const cur = new Date(periodStart.getFullYear(), periodStart.getMonth(), 1);
  const last = new Date(periodEnd.getFullYear(), periodEnd.getMonth(), 1);
  while(cur <= last){
    months.push({ year: cur.getFullYear(), month: cur.getMonth() });
    cur.setMonth(cur.getMonth() + 1);
  }
  return months;
}
function monthLabelFr(year, month){
  const label = new Date(year, month, 1).toLocaleDateString("fr-FR", { month:"long", year:"numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}
// Version courte de monthLabelFr ("Mars 26") — sert d'étiquette d'axe X aux
// graphiques Volume/Dénivelé mensuels, où le nom complet du mois prendrait
// trop de place.
function monthLabelFrShort(year, month){
  const label = new Date(year, month, 1).toLocaleDateString("fr-FR", { month:"short" });
  return label.charAt(0).toUpperCase() + label.slice(1) + " " + String(year).slice(-2);
}
// Vrai si [startISO, endISO] correspond exactement à un ou plusieurs mois
// calendaires complets (début = 1er du mois, fin = dernier jour du mois).
// Sert à savoir si un encadré donnant la valeur exacte de la période
// sélectionnée doit s'afficher sur les graphiques Volume/Dénivelé (utile
// seulement quand la période chevauche des mois ou ne fait qu'une semaine —
// demande du coach du 2026-09-23).
function periodAlignsToMonths(startISO, endISO){
  const s = new Date(startISO+"T00:00:00");
  const e = new Date(endISO+"T00:00:00");
  const lastDayOfEndMonth = new Date(e.getFullYear(), e.getMonth()+1, 0).getDate();
  return s.getDate() === 1 && e.getDate() === lastDayOfEndMonth;
}

// Interpole entre deux couleurs hexadécimales (t=0 -> hexA, t=1 -> hexB) —
// sert au dégradé chronologique des courbes du graphique "Efficacité
// physiologique" (mois ancien = terne, mois récent = couleur pleine).
function hexToRgb(hex){
  hex = hex.replace("#","");
  if(hex.length === 3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex, 16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function mixHexColors(hexA, hexB, t){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const mix = a.map((v,i)=> Math.round(v + (b[i]-v)*t));
  return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
}
function hexToRgba(hex, alpha){
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

// GAP moyen par tranche de pente (6 tranches), sur un intervalle
// [startDate,endDate] explicite plutôt qu'une fenêtre glissante — sert au
// graphe "Profil terrain", dont les deux périodes de comparaison sont
// choisies librement par le coach. Les 6 tranches de gapByGrade sont, dans
// l'ordre : descente forte, descente modérée, plat, montée modérée, montée
// soutenue, montée forte (voir GRADE_BUCKET_LABELS). On corrige chaque
// tranche par le coefficient de technicité que le coach a saisi pour cette
// séance avant de moyenner entre séances — un terrain technique fait
// naturellement baisser le GAP brut à effort égal, ce coefficient « rend »
// au coureur la difficulté supplémentaire du terrain, en plus de la pente.
// Un seul champ de technicité par séance depuis le 2026-09-18 (voir
// envTerrainFactor) : même coefficient appliqué aux 6 tranches.
function gapGradeAverageInRange(sessions, startDate, endDate){
  const sums = [0,0,0,0,0,0], counts = [0,0,0,0,0,0];
  sessions.forEach(s=>{
    if(!Array.isArray(s.gapByGrade)) return;
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < startDate || d > endDate) return;
    const c = technicityCoef(s.technicity);
    s.gapByGrade.forEach((v,i)=>{ if(v!=null){ sums[i]+=v*c; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}

// Fenêtre (en semaines) utilisée pour moyenner les métriques autour de
// chaque date comparée, dérivée de la longueur de la période choisie par le
// coach : jusqu'à MATRIX_WINDOW_WEEKS (6), mais jamais plus de la moitié de
// la période (pour que les deux fenêtres — début et fin de période — ne se
// chevauchent pas sur une période courte).
function periodWeeksBetween(startDate, endDate){
  return Math.max(1, Math.round((endDate - startDate) / (7*86400000)));
}
function comparisonWindowWeeksFor(startDate, endDate){
  return Math.max(1, Math.min(MATRIX_WINDOW_WEEKS, Math.floor(periodWeeksBetween(startDate, endDate)/2)));
}

function sum7(sessions){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6);
  const cutoffStr = fmtDate(cutoff);
  return sessions.filter(s=>s.date >= cutoffStr).reduce((acc,s)=>{
    acc.km += s.distance; acc.dPlus += s.dPlus; acc.dMinus += s.dMinus; return acc;
  }, {km:0, dPlus:0, dMinus:0});
}

/* ---------------------------- Jumeau numérique : agrégation des 7 paramètres ---------------------------- */
//
// 1. Force max membre inférieur (N)  -> dernier test_type='force_membre_inf', valueDroite+valueGauche
// 2. VMA (km/h)                      -> dernier test_type='vma', value
// 3. Seuil 1 / aérobie (km/h)        -> dernier test_type='seuil1', value
// 4. Seuil 2 / anaérobie (km/h)      -> dernier test_type='seuil2', value
// 5. Montée  -> profil VAM (m/h) par zone FC (5) x tranche de pente montante
//    (3 : 4-10/10-18/>18%), calculé côté serveur (vamClimbProfile, 15 valeurs,
//    index = zone*3+tranche) et simplement moyenné ici entre séances de la
//    fenêtre, case par case (une séance sans valeur pour une case donnée
//    ne contribue simplement pas à cette case).
// 6. Descente -> même chose, profil VAM descente (10 valeurs, zone*2+tranche).
// 7. Volume -> moyenne hebdomadaire glissante sur 6 mois, en km et en heures.

// Dernier test en date d'un type donné pour un athlète (ou null si aucun).
function latestAthleteTest(athleteId, testType){
  const tests = (state.athleteTests || []).filter(t=>t.athleteId===athleteId && t.testType===testType);
  if(!tests.length) return null;
  return tests.reduce((latest,t)=> (!latest || t.date > latest.date) ? t : latest, null);
}

// Force max membre inférieur (N) = somme droite + gauche du dernier test,
// ou null si l'un des deux membres n'a pas été saisi.
function latestForceMax(athleteId){
  const t = latestAthleteTest(athleteId, "force_membre_inf");
  if(!t || t.valueDroite==null || t.valueGauche==null) return null;
  return { value: Math.round((t.valueDroite + t.valueGauche)*10)/10, date: t.date, valueDroite:t.valueDroite, valueGauche:t.valueGauche };
}
// VMA / Seuil 1 / Seuil 2 (km/h) du dernier test, ou null.
function latestSpeedTest(athleteId, testType){
  const t = latestAthleteTest(athleteId, testType);
  if(!t || t.value==null) return null;
  return { value: t.value, date: t.date };
}

// Moyenne, entre séances Strava de la fenêtre, d'un profil VAM plat (climb:
// 15 cases zone*3+tranche, descent: 10 cases zone*2+tranche) déjà moyenné par
// séance côté serveur : une séance sans
// donnée pour une case donnée ne contribue simplement pas à cette case.
function vamProfileAverage(sessions, endDate, weeks, field, cellCount){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  const sums = new Array(cellCount).fill(0), counts = new Array(cellCount).fill(0);
  sessions.forEach(s=>{
    const profile = s[field];
    if(!Array.isArray(profile)) return;
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    profile.forEach((v,i)=>{ if(v!=null){ sums[i]+=v; counts[i]++; } });
  });
  return sums.map((sum,i)=> counts[i]>0 ? Math.round((sum/counts[i])*10)/10 : null);
}
function vamClimbProfileAverage(sessions, endDate, weeks){
  return vamProfileAverage(sessions, endDate, weeks, "vamClimbProfile", 15);
}
function vamDescentProfileAverage(sessions, endDate, weeks){
  return vamProfileAverage(sessions, endDate, weeks, "vamDescentProfile", 10);
}
// Lecture d'une case du profil VAM montée/descente par zone de FC (0-4) et
// tranche de pente (climb: 0=modérée/1=soutenue/2=forte, descent:
// 0=forte/1=modérée) -- voir hrZoneIndex/climbBucketIndex/descentBucketIndex
// côté serveur (strava-webhook) pour les bornes exactes.
function vamProfileCell(profile, zoneIdx, bucketIdx, bucketsPerZone){
  if(!Array.isArray(profile)) return null;
  return profile[zoneIdx*bucketsPerZone + bucketIdx] ?? null;
}

// Types de séance retenus pour le Volume du jumeau numérique, selon les
// cases CAP / Vélo cochées par le coach (twinVolumeIncludeRun/Bike ci-dessus).
function twinVolumeSessionTypes(){
  const types = [];
  if(twinVolumeIncludeRun) types.push("Course à pied", "Trail");
  if(twinVolumeIncludeBike) types.push("Cyclisme");
  return types;
}
function isTwinVolumeSession(s){
  return twinVolumeSessionTypes().includes(s.type);
}

// Volume hebdomadaire moyen (km et heures), moyenne glissante sur 6 mois
// (26 semaines) se terminant à endDate -- somme des séances de la fenêtre
// divisée par le nombre de semaines, pas seulement des semaines avec séance.
const VOLUME_WINDOW_WEEKS = 26;
function volumeWeeklyAverage(sessions, endDate){
  const start = new Date(endDate); start.setDate(start.getDate() - VOLUME_WINDOW_WEEKS*7);
  let km = 0, minutes = 0;
  sessions.forEach(s=>{
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    km += s.distance || 0; minutes += s.duration || 0;
  });
  return { km: Math.round((km/VOLUME_WINDOW_WEEKS)*10)/10, hours: Math.round((minutes/60/VOLUME_WINDOW_WEEKS)*10)/10 };
}

// Les 7 paramètres du jumeau numérique pour un athlète, à une date de
// référence donnée (par défaut aujourd'hui) -- rassemble les 4 tests de
// terrain (dernière valeur) et les 3 paramètres calculés depuis Strava.
function digitalTwinParams(athleteId, sessions, endDate){
  endDate = endDate || new Date();
  const stravaSessions = sessions.filter(s=>s.athleteId===athleteId && s.source==="strava");
  const volumeSessions = stravaSessions.concat(sessions.filter(s=>s.athleteId===athleteId && s.source!=="strava")).filter(isTwinVolumeSession);
  return {
    forceMax: latestForceMax(athleteId),
    vma: latestSpeedTest(athleteId, "vma"),
    seuil1: latestSpeedTest(athleteId, "seuil1"),
    seuil2: latestSpeedTest(athleteId, "seuil2"),
    vam3: latestSpeedTest(athleteId, "vam3"),
    vam9: latestSpeedTest(athleteId, "vam9"),
    vamClimbProfile: vamClimbProfileAverage(stravaSessions, endDate, MATRIX_WINDOW_WEEKS),
    vamDescentProfile: vamDescentProfileAverage(stravaSessions, endDate, MATRIX_WINDOW_WEEKS),
    volume: volumeWeeklyAverage(volumeSessions, endDate),
  };
}
// Indice VAM3/VAM12 (%) : capacité de l'athlète à produire, sur 3 min en
// côte, une VAM supérieure à sa VAM soutenue sur 12 min. Nécessite les deux
// derniers tests ; ne rapproche pas leurs dates (chaque test reste la
// dernière valeur connue, comme les autres paramètres du jumeau).
function vam3To9Ratio(twin){
  if(!twin || !twin.vam3 || !twin.vam9 || !twin.vam9.value) return null;
  return (twin.vam3.value / twin.vam9.value) * 100;
}

/* ---------------------------- Simulateur : moteur de régression par paires ---------------------------- */
//
// Objectif : déplacer 1-2 des 7 paramètres du jumeau numérique et estimer
// l'effet sur les autres, à partir de l'historique propre de l'athlète (pas
// de formule physiologique générique). Deux catégories de paramètres :
//  - "physio" (Force, VMA, Seuil1, Seuil2) : un point par test de terrain,
//    donc toujours rare, même avec beaucoup d'historique d'entraînement.
//  - "perf"/"charge" (Montée, Descente, Volume) : dérivés des séances Strava
//    par fenêtres glissantes, donc denses et de plus en plus fiables avec le
//    temps.
// En dessous du seuil minimum d'observations appariées, on affiche un repère
// qualitatif par paire de catégories plutôt qu'un chiffre non fiable.

const SIM_PARAMS = [
  { key:"force", label:"Force max membre inférieur", category:"physio" },
  { key:"vma", label:"VMA", category:"physio" },
  { key:"seuil1", label:"Seuil 1 (aérobie)", category:"physio" },
  { key:"seuil2", label:"Seuil 2 (anaérobie)", category:"physio" },
  { key:"vam3", label:"VAM 3' (test de côte)", category:"physio" },
  { key:"vam9", label:"VAM 9' (test de côte)", category:"physio" },
  { key:"volume", label:"Volume hebdo", category:"charge" },
  { key:"descente", label:"Descente (VAM moy.)", category:"perf" },
];
const SIM_SNAPSHOT_WINDOW_WEEKS = 8;   // fenêtre glissante pour les instantanés Volume/Montée/Descente
const SIM_SNAPSHOT_STEP_WEEKS = 2;     // pas entre deux instantanés successifs
const SIM_MAX_GAP_DAYS = 21;           // écart temporel max pour apparier deux observations
const SIM_MIN_PAIRS = 4;               // nombre minimum de paires pour afficher une tendance chiffrée

function simParamSeriesFromTests(athleteTests, testType, extractValue){
  return athleteTests.filter(t=>t.testType===testType)
    .map(t=>({ date:new Date(t.date+"T00:00:00"), value:extractValue(t) }))
    .filter(p=> p.value!=null && !isNaN(p.date))
    .sort((a,b)=>a.date-b.date);
}
// Instantané du volume hebdo (km, non arrondi) sur une fenêtre de `weeks`
// semaines se terminant à `endDate` -- même principe que volumeWeeklyAverage,
// mais paramétrable en largeur de fenêtre pour le moteur de régression, et
// renvoie null (au lieu de 0) quand la fenêtre est vide.
function simVolumeSnapshotKm(sessions, endDate, weeks){
  const start = new Date(endDate); start.setDate(start.getDate() - weeks*7);
  let km = 0, count = 0;
  sessions.forEach(s=>{
    const d = new Date(s.date+"T00:00:00");
    if(isNaN(d) || d < start || d > endDate) return;
    km += s.distance || 0; count++;
  });
  return count>0 ? km/weeks : null;
}
// Moyenne des cases renseignées d'un profil VAM (climb/descent) -- réduit le
// profil 2D à une seule valeur pour les besoins du simulateur (l'onglet
// principal continue d'afficher le détail par zone de FC × pente).
function simAggregateVamProfile(profile){
  if(!Array.isArray(profile)) return null;
  const vals = profile.filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

// Série mensuelle de la VAM moyenne (montée ou descente, m/h), un mois
// calendaire à la fois sur `months` (voir monthsBetween) -- contrairement aux
// tableaux VAM par zone de FC × pente ci-dessus (instantané sur les
// MATRIX_WINDOW_WEEKS dernières semaines), sert à visualiser la tendance sur
// tout l'historique Strava dans le graphique "Évolution mensuelle de la VAM"
// de l'onglet Jumeau numérique. Un mois sans séance avec profil renseigné
// vaut null (spanGaps:true au rendu plutôt qu'un 0 trompeur).
function vamMonthlyAverage(stravaSessions, months, field, cellCount){
  return months.map(m=>{
    const monthSessions = stravaSessions.filter(s=>{
      const d = new Date(s.date+"T00:00:00");
      return !isNaN(d) && d.getFullYear()===m.year && d.getMonth()===m.month;
    });
    const sums = new Array(cellCount).fill(0), counts = new Array(cellCount).fill(0);
    monthSessions.forEach(s=>{
      const profile = s[field];
      if(!Array.isArray(profile)) return;
      profile.forEach((v,i)=>{ if(v!=null){ sums[i]+=v; counts[i]++; } });
    });
    return simAggregateVamProfile(sums.map((sum,i)=> counts[i]>0 ? sum/counts[i] : null));
  });
}
// Série temporelle d'un paramètre pour un athlète : un point par test pour
// les paramètres physio, des instantanés glissants tous les
// SIM_SNAPSHOT_STEP_WEEKS pour Volume/Montée/Descente.
function simParamSeries(sessions, athleteTests, key){
  if(key==="force") return simParamSeriesFromTests(athleteTests, "force_membre_inf", t=> (t.valueDroite!=null && t.valueGauche!=null) ? t.valueDroite+t.valueGauche : null);
  if(key==="vma") return simParamSeriesFromTests(athleteTests, "vma", t=>t.value);
  if(key==="seuil1") return simParamSeriesFromTests(athleteTests, "seuil1", t=>t.value);
  if(key==="seuil2") return simParamSeriesFromTests(athleteTests, "seuil2", t=>t.value);
  if(key==="vam3") return simParamSeriesFromTests(athleteTests, "vam3", t=>t.value);
  if(key==="vam9") return simParamSeriesFromTests(athleteTests, "vam9", t=>t.value);
  const stravaSessions = sessions.filter(s=>s.source==="strava");
  const dates = stravaSessions.map(s=>new Date(s.date+"T00:00:00")).filter(d=>!isNaN(d));
  if(!dates.length) return [];
  const rangeStart = new Date(Math.min.apply(null, dates)); rangeStart.setDate(rangeStart.getDate() + SIM_SNAPSHOT_WINDOW_WEEKS*7);
  const rangeEnd = new Date(Math.max.apply(null, dates));
  if(rangeStart > rangeEnd) return [];
  const out = [];
  let d = new Date(rangeStart);
  while(d <= rangeEnd){
    let value = null;
    if(key==="volume") value = simVolumeSnapshotKm(sessions.filter(isTwinVolumeSession), d, SIM_SNAPSHOT_WINDOW_WEEKS);
    else if(key==="descente") value = simAggregateVamProfile(vamProfileAverage(stravaSessions, d, SIM_SNAPSHOT_WINDOW_WEEKS, "vamDescentProfile", 10));
    if(value!=null) out.push({ date:new Date(d), value });
    d.setDate(d.getDate() + SIM_SNAPSHOT_STEP_WEEKS*7);
  }
  return out;
}
// Apparie deux séries temporelles par proximité de date (plus proche voisin,
// à moins de SIM_MAX_GAP_DAYS) -- donne une liste de paires [x,y] utilisables
// pour une régression linéaire.
function simPairObservations(seriesA, seriesB, maxGapDays){
  const pairs = [];
  seriesA.forEach(a=>{
    let best = null, bestDiff = Infinity;
    seriesB.forEach(b=>{
      const diff = Math.abs(a.date - b.date);
      if(diff < bestDiff){ bestDiff = diff; best = b; }
    });
    if(best && bestDiff <= maxGapDays*86400000) pairs.push([a.value, best.value]);
  });
  return pairs;
}
// Régression linéaire simple (moindres carrés) -- renvoie null si trop peu de
// paires ou si le paramètre déplacé n'a pas varié dans l'historique.
function simLinearRegression(pairs){
  const n = pairs.length;
  if(n < SIM_MIN_PAIRS) return null;
  let sumX=0, sumY=0, sumXY=0, sumXX=0;
  pairs.forEach(([x,y])=>{ sumX+=x; sumY+=y; sumXY+=x*y; sumXX+=x*x; });
  const denom = n*sumXX - sumX*sumX;
  if(Math.abs(denom) < 1e-9) return null;
  const slope = (n*sumXY - sumX*sumY) / denom;
  const intercept = (sumY - slope*sumX) / n;
  return { slope, intercept, n };
}
// Repères qualitatifs par paire de catégories, utilisés en dessous du seuil
// minimum d'observations -- volontairement génériques (principes
// d'entraînement établis), jamais un chiffre inventé à partir de trop peu de
// tests.
const SIM_CATEGORY_NOTES = {
  "physio|physio": "Les qualités physiologiques évoluent souvent de façon liée, mais pas forcément dans les mêmes proportions — un gain isolé sur l'une ne garantit pas un gain équivalent sur les autres.",
  "perf|physio": "La vitesse ascensionnelle/descendante dépend aussi de la technique et de l'expérience du terrain, pas seulement des qualités physiologiques mesurées au test.",
  "charge|physio": "Une progression physiologique permet en général d'absorber un volume plus élevé, mais augmenter le volume avant qu'elle soit confirmée par un nouveau test expose à un risque de surcharge.",
  "perf|perf": "Montée et descente sollicitent des qualités différentes (aérobie/puissance vs excentrique/technique) — une progression sur l'une ne présage pas d'une progression équivalente sur l'autre.",
  "charge|perf": "Un volume plus élevé favorise en général la progression des allures de montée/descente à moyen terme, à condition de rester dans la fourchette sûre indiquée ci-dessus.",
};
function simCategoryNote(catA, catB){
  const key = [catA, catB].sort().join("|");
  return SIM_CATEGORY_NOTES[key] || "Pas assez de recul pour formuler un repère fiable.";
}
function simFormatValue(key, value){
  if(value==null || !isFinite(value)) return "—";
  if(key==="force") return value.toFixed(0)+" N";
  if(key==="vma" || key==="seuil1" || key==="seuil2") return value.toFixed(1)+" km/h";
  if(key==="volume") return value.toFixed(1)+" km/sem.";
  if(key==="vam3" || key==="vam9" || key==="descente") return value.toFixed(0)+" m/h";
  return String(value);
}
// Position (%) de la bulle de valeur au-dessus du curseur moderne du
// simulateur, calée sur la position réelle du pouce du <input type=range>
// (clampée pour que la bulle ne déborde jamais de sa carte).
function simSliderPct(value, min, max){
  if(max===min) return 50;
  const p = (Number(value)-min)/(max-min)*100;
  return Math.max(4, Math.min(96, p));
}

// Score 0-10 d'un paramètre du jumeau numérique par rapport à sa propre
// plage observée chez cet athlète (0 = son plus bas, 10 = son plus haut) --
// alimente le radar "Profil du coureur" (onglet Entraînement), qui a
// remplacé l'ancien Runner Matrix basé sur l'historique GAP par zone/pente.
// Réutilise directement les séries du simulateur (simParamSeries) : au
// moins 2 points sont nécessaires pour établir une plage (un paramètre
// jamais testé/observé deux fois renvoie null, affiché à 0 avec une note
// dédiée plutôt qu'un score trompeur).
function twinRadarScoreFromSeries(series, currentValue){
  if(currentValue == null || series.length < 2) return null;
  const vals = series.map(p=>p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  if(max - min < 1e-9) return 5;
  return Math.round(Math.max(0, Math.min(10, (currentValue-min)/(max-min)*10)));
}
// Pour chaque paramètre non déplacé, prédit sa valeur (moyenne des
// prédictions si deux paramètres sont déplacés) via la régression sur
// l'historique de l'athlète, ou bascule sur un repère qualitatif si trop peu
// d'observations.
function simComputeEffects(seriesCache, currentValues, movedKeys, movedValues){
  const results = [];
  SIM_PARAMS.filter(p=> !movedKeys.includes(p.key)).forEach(target=>{
    const predictions = [];
    movedKeys.forEach((movedKey, i)=>{
      const pairs = simPairObservations(seriesCache[movedKey], seriesCache[target.key], SIM_MAX_GAP_DAYS);
      const reg = simLinearRegression(pairs);
      if(reg) predictions.push({ predictedValue: reg.intercept + reg.slope*movedValues[i], n: reg.n });
    });
    if(predictions.length){
      const avgPredicted = predictions.reduce((a,p)=>a+p.predictedValue,0) / predictions.length;
      const minN = Math.min.apply(null, predictions.map(p=>p.n));
      results.push({ key:target.key, label:target.label, mode:"quantified", predictedValue:avgPredicted, currentValue:currentValues[target.key], n:minN });
    } else {
      const notes = Array.from(new Set(movedKeys.map(mk=>{
        const moved = SIM_PARAMS.find(p=>p.key===mk);
        return simCategoryNote(moved.category, target.category);
      })));
      results.push({ key:target.key, label:target.label, mode:"qualitative", currentValue:currentValues[target.key], notes });
    }
  });
  return results;
}
// Fourchette de volume hebdo sûre : règle des 10% sur le volume moyen actuel
// (même base que twin.volume), recoupée avec l'ACWR déjà calculé pour
// l'onglet Entraînement (charge TRIMP acute/chronique) pour signaler un
// contexte de risque -- pas une double contrainte, juste un repère de
// prudence supplémentaire.
function simVolumeSafeRange(athleteSessions){
  const current = volumeWeeklyAverage(athleteSessions.filter(isTwinVolumeSession), new Date());
  if(!current.km) return null;
  const { acute, chronic } = acuteChronicLatest(athleteSessions);
  const acwrNow = chronic > 0.5 ? acute/chronic : null;
  const cls = classifyACWR(acwrNow);
  return {
    lowKm: current.km*0.9, highKm: current.km*1.1,
    lowH: current.hours*0.9, highH: current.hours*1.1,
    currentKm: current.km, currentH: current.hours,
    acwrKey: cls.key, acwrLabel: cls.label,
  };
}
function simVolumeRangeHtml(range){
  if(!range) return "";
  const riskNote = (range.acwrKey==="critical" || range.acwrKey==="serious")
    ? ` Attention : la charge actuelle de l'athlète est déjà en zone « ${escapeHtml(range.acwrLabel)} » (ACWR) — privilégier le bas de cette fourchette.`
    : "";
  return `<div class="ls-panel" style="margin-bottom:14px;">
    <div class="ls-stat-label" style="margin-bottom:4px;">Fourchette de volume hebdo sûre (règle des 10%)</div>
    <div class="ls-stat-value">${range.lowKm.toFixed(1)}–${range.highKm.toFixed(1)}<small>km/sem.</small></div>
    <div class="ls-chart-sub" style="margin-top:4px;">soit environ ${range.lowH.toFixed(1)}–${range.highH.toFixed(1)} h/sem. Actuel : ${range.currentKm.toFixed(1)} km/sem.${riskNote}</div>
  </div>`;
}
function simResultsHtml(effects){
  if(!effects.length) return '<div class="ls-empty">Choisissez au moins un paramètre à faire varier.</div>';
  return `<div class="ls-stat-grid">` + effects.map(e=>{
    if(e.mode==="quantified"){
      return `<div class="ls-stat"><div class="ls-stat-label">${escapeHtml(e.label)}</div>
        <div class="ls-stat-value">${simFormatValue(e.key, e.predictedValue)}</div>
        <small>actuel : ${simFormatValue(e.key, e.currentValue)} · tendance sur ${e.n} observations</small></div>`;
    }
    return `<div class="ls-stat" style="grid-column:1 / -1;"><div class="ls-stat-label">${escapeHtml(e.label)}</div>
      <div class="ls-chart-sub" style="margin-top:4px;">${e.notes.map(n=>escapeHtml(n)).join(" ")}</div></div>`;
  }).join("") + `</div>`;
}

/* ---------------------------- theme handling ---------------------------- */

function currentThemeMode(){
  return localStorage.getItem("loadscope-theme") || "system";
}
function applyTheme(mode){
  const root = document.documentElement;
  if(mode === "light") root.setAttribute("data-theme","light");
  else if(mode === "dark") root.setAttribute("data-theme","dark");
  else root.removeAttribute("data-theme");
  localStorage.setItem("loadscope-theme", mode);
  const labels = { system:"Automatique", light:"Clair", dark:"Sombre" };
  const btn = document.getElementById("btn-theme");
  if(btn) btn.textContent = "Thème : " + labels[mode];
  renderActiveTabCharts();
}
function cycleTheme(){
  const order = ["system","light","dark"];
  const next = order[(order.indexOf(currentThemeMode())+1) % order.length];
  applyTheme(next);
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function isDarkNow(){
  const mode = currentThemeMode();
  if(mode === "dark") return true;
  if(mode === "light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}

/* ---------------------------- rendering: sidebar ---------------------------- */

function athleteColor(a){ return cssVar(CAT_HUES[a.colorIndex % CAT_HUES.length]); }
function initials(name){ return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }

function renderAthleteList(){
  const list = document.getElementById("athlete-list");

  }
  list.innerHTML = state.athletes.map(a => {
    const sessions = state.sessions.filter(s=>s.athleteId===a.id);

    const last = acwr.length ? acwr[acwr.length-1] : null;
    const cls = classifyACWR(last);
    const wk = sum7(sessions);
    const active = (activeView==="athlete" && a.id === activeAthleteId) ? "active" : "";
    return `<button class="ls-athlete-card ${active}" data-athlete="${a.id}">
      <span class="ls-dot" style="background:${athleteColor(a)}"></span>
      <span class="ls-athlete-meta">
        <div class="ls-athlete-name">${escapeHtml(a.name)}</div>
        <div class="ls-athlete-sub">${escapeHtml(a.sport)} · ${wk.km.toFixed(0)} km/7j</div>
      </span>
      <span class="ls-pill" style="background:var(${statusVar(cls.key)});color:${statusInk(cls.key)}">${last!=null? last.toFixed(2):"—"}</span>
    </button>`;
  }).join("");

function statusVar(key){
  return { good:"--good", warning:"--warning", serious:"--serious", critical:"--critical", none:"--text-muted" }[key] || "--text-muted";
}
function statusInk(key){
  return { good:"var(--good-ink)", warning:"var(--warning-ink)", serious:"var(--serious-ink)", critical:"var(--critical-ink)", none:"var(--bg)" }[key] || "#fff";
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function athleteMetaLine(athlete){
  const bits = [escapeHtml(athlete.sport)];
  const age = ageFromBirthDate(athlete.birthDate);
  if(age != null) bits.push(age + " ans");
  if(athlete.maxHR) bits.push("FC max " + athlete.maxHR + " bpm");
  if(athlete.heightCm) bits.push(athlete.heightCm + " cm");
  if(athlete.weightKg) bits.push(athlete.weightKg + " kg");
  return bits.join(" · ");
}

async function deleteSelectedLeads(){
  const ids = [...selectedLeadIds];
  if(ids.length === 0) return;
  if(!confirm("Supprimer " + ids.length + " demande" + (ids.length>1?"s":"") + " ? Cette action est irréversible.")) return;
  try{
    await Promise.all(ids.map(id=>apiDeleteReportLead(id)));
    selectedLeadIds.clear();
    await refreshData();
  }catch(err){
    if(err.unauthorized){ showKeyGate("Clé d'accès expirée ou invalide, merci de la ressaisir."); return; }
    alert("Suppression impossible : " + err.message);
  }
}

  function simUpdatePill(paramKey, sliderEl, pillEl){
    if(!pillEl) return;
    if(!sliderEl || sliderEl.disabled){ pillEl.style.display = "none"; return; }
    pillEl.style.display = "";
    pillEl.style.left = simSliderPct(sliderEl.value, sliderEl.min, sliderEl.max) + "%";
    pillEl.textContent = simFormatValue(paramKey, Number(sliderEl.value));
  }
  function simSetupSlider(paramKey, sliderEl, pillEl, minEl, maxEl){
    if(!sliderEl) return;
    const cur = simCurrentValues[paramKey];

      if(pillEl) pillEl.style.display = "none";

    const min = cur*0.7, max = cur*1.3;

    sliderEl.value = cur; sliderEl.disabled = false;
    if(minEl) minEl.textContent = simFormatValue(paramKey, min);
    if(maxEl) maxEl.textContent = simFormatValue(paramKey, max);
    simUpdatePill(paramKey, sliderEl, pillEl);
  }
  function twinSimUpdate(){
    if(!simSel1 || !simSlider1) return;
    const key1 = simSel1.value, key2 = simSel2 ? simSel2.value : "none";

// Petit tableau VAM (m/h) par zone de FC (lignes, ZONE_LABELS) x tranche de
// pente (colonnes, gradeLabelIndices = indices dans GRADE_BUCKET_LABELS ;
// [3,4,5] pour la montée, [0,1] pour la descente) -- voir vamProfileCell.
// Grille couleur (heatmap) remplaçant l'ancien tableau brut : l'intensité de
// fond de chaque case est calculée par rapport au maximum observé dans CE
// profil (montée et descente ont chacune leur propre échelle), pour que les
// zones/pentes les plus rapides ressortent visuellement même quand les
// valeurs absolues diffèrent beaucoup entre athlètes. colorVar reprend la
// couleur déjà utilisée pour cette série sur le graphique d'évolution
// mensuelle juste en dessous (--cat-2 pour la montée, --cat-1 pour la
// descente), pour que les deux visualisations restent cohérentes entre elles.
function vamProfileHeatmapHtml(profile, gradeLabelIndices, colorVar){
  const bucketsPerZone = gradeLabelIndices.length;
  const headers = gradeLabelIndices.map(gi=>`<div class="ls-heat-head">${escapeHtml(GRADE_BUCKET_LABELS[gi])}</div>`).join("");
  const cellsGrid = [];
  let maxV = 0;
  ZONE_LABELS.forEach((label,zi)=>{
    gradeLabelIndices.forEach((_,bi)=>{
      const v = vamProfileCell(profile, zi, bi, bucketsPerZone);
      if(v!=null && v>maxV) maxV = v;
    });
  });
  const color = cssVar(colorVar);
  const rows = ZONE_LABELS.map((label,zi)=>{
    const rowLabel = `<div class="ls-heat-row-label">${escapeHtml(label.split(" · ")[0])}</div>`;
    const cells = gradeLabelIndices.map((_,bi)=>{
      const v = vamProfileCell(profile, zi, bi, bucketsPerZone);
      if(v==null) return `<div class="ls-heat-cell empty">—</div>`;
      const alpha = maxV>0 ? 0.10 + (v/maxV)*0.38 : 0.10;
      return `<div class="ls-heat-cell" style="background:${hexToRgba(color, alpha)};" title="${escapeHtml(label)}">${Math.round(v)}</div>`;
    }).join("");
    return rowLabel + cells;
  }).join("");
  return `<div class="ls-heat-card"><div class="ls-heat-grid" style="grid-template-columns:78px repeat(${bucketsPerZone},1fr);">
    <div></div>${headers}${rows}
  </div><div class="ls-matrix-note">Valeurs en m/h — case vide : moins de 60 s cumulées sur la fenêtre de ${MATRIX_WINDOW_WEEKS} semaines.</div></div>`;
}

function acuteChronicLatest(sessions){
  const { acute, chronic } = acwrSeries(sessions);
  return { acute: acute.length? acute[acute.length-1]:0, chronic: chronic.length? chronic[chronic.length-1]:0 };
}

function avgIgnoreNull(arr){
  const vals = arr.filter(v=>v!=null && isFinite(v));
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function hooperStatsFor(athleteId){
  const list = (state.hooperResponses||[]).filter(h=>h.athleteId===athleteId).slice().sort((a,b)=> a.weekStart<b.weekStart?-1:1);
  if(!list.length) return { list, last:null, avg:null, priorCount:0 };
  const last = list[list.length-1];
  const prior = list.slice(0,-1);
  const avg = prior.length ? {
    sommeil: avgIgnoreNull(prior.map(h=>h.sommeil)),
    fatigue: avgIgnoreNull(prior.map(h=>h.fatigue)),
    stress: avgIgnoreNull(prior.map(h=>h.stress)),
    douleur: avgIgnoreNull(prior.map(h=>h.douleur)),
  } : null;
  return { list, last, avg, priorCount: prior.length };
}
function injuryStatsFor(athleteId){
  const all = (state.injuryReports||[]).filter(r=>r.athleteId===athleteId).slice().sort((a,b)=> a.weekStart<b.weekStart?1:-1);
  const latestWeek = all.length ? all[0].weekStart : null;
  const latestItems = latestWeek ? all.filter(r=>r.weekStart===latestWeek) : [];
  return { all, latestWeek, latestItems };
}

      ${injuries.all.length ? `

        <div class="ls-sante-toggle-group">

        </div>
        ${santeHistoryView==="last"
          ? `<div style="margin-top:14px;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:12.5px;line-height:1.6;">
              ${injuries.latestItems.map(r=>`<div><strong>${escapeHtml(r.zoneLabel)}</strong> (${r.view==="face"?"face":"dos"}) — <span class="ls-status-pill" style="background:var(${santeSeverityVar(r.severity)});color:${statusInk(r.severity==="peu"?"warning":r.severity==="inquiet"?"serious":"critical")}">${santeSeverityLabel(r.severity)}</span></div>`).join("")}
